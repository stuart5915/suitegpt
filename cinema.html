<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Cinema</title>
    <link href="https://fonts.googleapis.com/css2?family=Nunito:wght@400;600;700;800;900&display=swap" rel="stylesheet">
    <style>
        * { margin: 0; padding: 0; box-sizing: border-box; }
        body {
            font-family: 'Nunito', sans-serif;
            background: #0a0a0f;
            color: #e2e8f0;
            min-height: 100vh;
            display: flex;
            flex-direction: column;
            align-items: center;
        }
        .header {
            width: 100%;
            max-width: 900px;
            padding: 24px 20px 0;
            display: flex;
            align-items: center;
            justify-content: space-between;
        }
        .header h1 {
            font-size: 1.6rem;
            font-weight: 800;
            color: #fff;
        }
        .header h1 span { color: #6366f1; }
        .viewer-badge {
            background: rgba(99,102,241,0.15);
            border: 1px solid rgba(99,102,241,0.3);
            color: #a5b4fc;
            padding: 6px 14px;
            border-radius: 20px;
            font-size: 0.85rem;
            font-weight: 600;
        }
        .main {
            width: 100%;
            max-width: 900px;
            padding: 20px;
            flex: 1;
        }
        .url-bar {
            display: flex;
            gap: 10px;
            margin-bottom: 16px;
        }
        .url-bar input {
            flex: 1;
            padding: 12px 16px;
            border-radius: 10px;
            border: 1px solid rgba(255,255,255,0.1);
            background: rgba(255,255,255,0.05);
            color: #fff;
            font-family: 'Nunito', sans-serif;
            font-size: 0.95rem;
            outline: none;
            transition: border-color 0.2s;
        }
        .url-bar input:focus { border-color: #6366f1; }
        .url-bar input:disabled { opacity: 0.5; cursor: not-allowed; }
        .btn {
            padding: 12px 24px;
            border-radius: 10px;
            border: none;
            background: #6366f1;
            color: #fff;
            font-family: 'Nunito', sans-serif;
            font-weight: 700;
            font-size: 0.95rem;
            cursor: pointer;
            transition: background 0.2s;
        }
        .btn:hover { background: #5558e6; }
        .btn:disabled { opacity: 0.4; cursor: not-allowed; }
        .video-wrap {
            position: relative;
            width: 100%;
            padding-bottom: 56.25%;
            background: rgba(255,255,255,0.03);
            border-radius: 12px;
            overflow: hidden;
            border: 1px solid rgba(255,255,255,0.06);
        }
        .video-wrap iframe, .video-wrap #player {
            position: absolute;
            top: 0; left: 0;
            width: 100%;
            height: 100%;
        }
        .video-placeholder {
            position: absolute;
            top: 0; left: 0;
            width: 100%;
            height: 100%;
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            color: rgba(255,255,255,0.25);
            gap: 12px;
        }
        .video-placeholder svg { width: 64px; height: 64px; opacity: 0.3; }
        .video-placeholder p { font-size: 1rem; }
        .controls {
            display: flex;
            align-items: center;
            gap: 12px;
            margin-top: 14px;
        }
        .play-btn {
            width: 44px;
            height: 44px;
            border-radius: 50%;
            border: none;
            background: #6366f1;
            color: #fff;
            cursor: pointer;
            display: flex;
            align-items: center;
            justify-content: center;
            transition: background 0.2s;
        }
        .play-btn:hover { background: #5558e6; }
        .play-btn:disabled { opacity: 0.4; cursor: not-allowed; }
        .time-display {
            font-size: 0.85rem;
            color: rgba(255,255,255,0.5);
            font-variant-numeric: tabular-nums;
        }
        .role-tag {
            margin-left: auto;
            font-size: 0.8rem;
            padding: 4px 12px;
            border-radius: 12px;
            font-weight: 600;
        }
        .role-host {
            background: rgba(99,102,241,0.15);
            color: #a5b4fc;
            border: 1px solid rgba(99,102,241,0.3);
        }
        .role-viewer {
            background: rgba(255,255,255,0.05);
            color: rgba(255,255,255,0.4);
            border: 1px solid rgba(255,255,255,0.08);
        }
        .status-bar {
            margin-top: 16px;
            padding: 10px 16px;
            background: rgba(255,255,255,0.03);
            border-radius: 10px;
            border: 1px solid rgba(255,255,255,0.06);
            font-size: 0.85rem;
            color: rgba(255,255,255,0.4);
            text-align: center;
        }
        .status-bar .dot {
            display: inline-block;
            width: 8px;
            height: 8px;
            border-radius: 50%;
            background: #22c55e;
            margin-right: 6px;
            vertical-align: middle;
        }
    </style>
</head>
<body>
    <div class="header">
        <h1><span>&#9654;</span> Cinema</h1>
        <div class="viewer-badge" id="viewerCount">1 watching</div>
    </div>

    <div class="main">
        <div class="url-bar" id="urlBar">
            <input type="text" id="urlInput" placeholder="Paste a YouTube URL..." />
            <button class="btn" id="loadBtn" onclick="loadVideo()">Load</button>
        </div>

        <div class="video-wrap">
            <div id="playerContainer"></div>
            <div class="video-placeholder" id="placeholder">
                <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.5"><polygon points="5 3 19 12 5 21 5 3"/></svg>
                <p>Paste a YouTube link to start watching</p>
            </div>
        </div>

        <div class="controls">
            <button class="play-btn" id="playBtn" onclick="togglePlay()" disabled>
                <svg id="playIcon" width="18" height="18" viewBox="0 0 24 24" fill="currentColor"><polygon points="5 3 19 12 5 21 5 3"/></svg>
                <svg id="pauseIcon" width="18" height="18" viewBox="0 0 24 24" fill="currentColor" style="display:none"><rect x="6" y="4" width="4" height="16"/><rect x="14" y="4" width="4" height="16"/></svg>
            </button>
            <span class="time-display" id="timeDisplay">0:00 / 0:00</span>
            <span class="role-tag" id="roleTag"></span>
        </div>

        <div class="status-bar" id="statusBar">
            <span class="dot"></span> Connecting...
        </div>
    </div>

<script>
    let player = null;
    let isHost = false;
    let currentVideoId = null;
    let ytReady = false;
    let heartbeatInterval = null;
    let timeUpdateInterval = null;
    let ignoreStateChange = false;

    // Extract YouTube video ID from various URL formats
    function extractVideoId(url) {
        url = url.trim();
        let m;
        m = url.match(/(?:youtube\.com\/watch\?.*v=|youtu\.be\/|youtube\.com\/shorts\/|youtube\.com\/embed\/)([a-zA-Z0-9_-]{11})/);
        if (m) return m[1];
        if (/^[a-zA-Z0-9_-]{11}$/.test(url)) return url;
        return null;
    }

    function formatTime(s) {
        s = Math.floor(s || 0);
        const m = Math.floor(s / 60);
        return m + ':' + String(s % 60).padStart(2, '0');
    }

    function updateTimeDisplay() {
        if (!player || typeof player.getCurrentTime !== 'function') return;
        const cur = player.getCurrentTime();
        const dur = player.getDuration();
        document.getElementById('timeDisplay').textContent = formatTime(cur) + ' / ' + formatTime(dur);
    }

    function updatePlayPauseIcon(playing) {
        document.getElementById('playIcon').style.display = playing ? 'none' : 'block';
        document.getElementById('pauseIcon').style.display = playing ? 'block' : 'none';
    }

    // Load YouTube IFrame API
    const tag = document.createElement('script');
    tag.src = 'https://www.youtube.com/iframe_api';
    document.head.appendChild(tag);

    window.onYouTubeIframeAPIReady = function() {
        ytReady = true;
    };

    function createPlayer(videoId) {
        currentVideoId = videoId;
        document.getElementById('placeholder').style.display = 'none';
        document.getElementById('playBtn').disabled = false;

        if (player) {
            player.loadVideoById(videoId);
            return;
        }

        player = new YT.Player('playerContainer', {
            videoId: videoId,
            playerVars: {
                autoplay: 1,
                controls: isHost ? 1 : 0,
                modestbranding: 1,
                rel: 0
            },
            events: {
                onStateChange: onPlayerStateChange
            }
        });
    }

    function onPlayerStateChange(e) {
        if (!isHost || ignoreStateChange) return;
        const playing = e.data === YT.PlayerState.PLAYING;
        const paused = e.data === YT.PlayerState.PAUSED;
        if (playing || paused) {
            updatePlayPauseIcon(playing);
            broadcastSync();
        }
    }

    function broadcastSync() {
        if (!isHost || !player || typeof player.getCurrentTime !== 'function') return;
        const playing = player.getPlayerState() === YT.PlayerState.PLAYING;
        updatePlayPauseIcon(playing);
        Realtime.send('sync', {
            videoId: currentVideoId,
            time: player.getCurrentTime(),
            playing: playing
        });
    }

    function loadVideo() {
        if (!isHost) return;
        const url = document.getElementById('urlInput').value;
        const vid = extractVideoId(url);
        if (!vid) {
            alert('Could not find a valid YouTube video ID in that URL.');
            return;
        }
        if (!ytReady) {
            alert('YouTube player is still loading, try again in a moment.');
            return;
        }
        createPlayer(vid);
        // Broadcast immediately so viewers load it too
        setTimeout(() => broadcastSync(), 1000);
    }

    function togglePlay() {
        if (!isHost || !player) return;
        const state = player.getPlayerState();
        if (state === YT.PlayerState.PLAYING) {
            player.pauseVideo();
        } else {
            player.playVideo();
        }
    }

    function applySync(data) {
        if (isHost) return;
        // Load video if different
        if (data.videoId && data.videoId !== currentVideoId) {
            if (!ytReady) return;
            createPlayer(data.videoId);
            // Wait for player to be ready before seeking
            setTimeout(() => applySeekAndState(data), 1500);
            return;
        }
        applySeekAndState(data);
    }

    function applySeekAndState(data) {
        if (!player || typeof player.seekTo !== 'function') return;
        ignoreStateChange = true;
        // Seek if more than 2s off
        const cur = player.getCurrentTime();
        if (Math.abs(cur - data.time) > 2) {
            player.seekTo(data.time, true);
        }
        if (data.playing) {
            player.playVideo();
        } else {
            player.pauseVideo();
        }
        updatePlayPauseIcon(data.playing);
        setTimeout(() => { ignoreStateChange = false; }, 500);
    }

    function updateViewerCount() {
        const players = Realtime.getPlayers();
        const count = players.length + 1; // +1 for self
        document.getElementById('viewerCount').textContent = count + ' watching';
    }

    function setRole(host) {
        isHost = host;
        const tag = document.getElementById('roleTag');
        const urlInput = document.getElementById('urlInput');
        const loadBtn = document.getElementById('loadBtn');

        if (host) {
            tag.className = 'role-tag role-host';
            tag.textContent = 'Host';
            urlInput.disabled = false;
            loadBtn.disabled = false;
            document.getElementById('statusBar').innerHTML = '<span class="dot"></span> You are the host — load a video to start';
            Realtime.setMyState({ role: 'host' });
        } else {
            tag.className = 'role-tag role-viewer';
            tag.textContent = 'Viewer';
            urlInput.disabled = true;
            urlInput.placeholder = 'Host controls the video...';
            loadBtn.disabled = true;
            document.getElementById('playBtn').style.display = 'none';
            document.getElementById('statusBar').innerHTML = '<span class="dot"></span> Synced with host';
            Realtime.setMyState({ role: 'viewer' });
        }
    }

    // Wait for Realtime SDK to be available
    function init() {
        if (typeof Realtime === 'undefined') {
            setTimeout(init, 200);
            return;
        }

        Realtime.connect('cinema').then(() => {
            // Check if there's already a host
            const players = Realtime.getPlayers();
            const existingHost = players.find(p => p.state && p.state.role === 'host');

            if (existingHost) {
                setRole(false);
            } else {
                setRole(true);
            }

            updateViewerCount();

            // Listen for sync events
            Realtime.on('sync', (data, senderId) => {
                applySync(data);
            });

            // Presence changes
            Realtime.onJoin(() => updateViewerCount());
            Realtime.onLeave((p) => {
                updateViewerCount();
                // If the host left and we're the first remaining player, become host
                if (p.state && p.state.role === 'host') {
                    const remaining = Realtime.getPlayers();
                    if (remaining.length === 0 || remaining[0].id === Realtime.me.id) {
                        setRole(true);
                        document.getElementById('statusBar').innerHTML = '<span class="dot"></span> Host left — you are now the host';
                    }
                }
            });

            // Host heartbeat — broadcast state every 3s for late joiners
            if (isHost) {
                heartbeatInterval = setInterval(() => broadcastSync(), 3000);
            }
        });

        // Update time display
        timeUpdateInterval = setInterval(updateTimeDisplay, 500);
    }

    // Also handle Enter key on URL input
    document.getElementById('urlInput').addEventListener('keydown', function(e) {
        if (e.key === 'Enter') loadVideo();
    });

    init();
</script>
</body>
</html>
