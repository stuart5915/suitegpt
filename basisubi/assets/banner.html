<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Basis Banner</title>
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Syne:wght@400;500;600;700;800&family=IBM+Plex+Mono:wght@400;500;600&display=swap" rel="stylesheet">
    <style>
        * { margin: 0; padding: 0; box-sizing: border-box; }
        body { background: #000; display: flex; align-items: center; justify-content: center; min-height: 100vh; }

        /* X/Twitter banner: 1500x500 */
        .banner {
            width: 1500px;
            height: 500px;
            background: #04040a;
            position: relative;
            overflow: hidden;
            font-family: 'Syne', system-ui, sans-serif;
        }

        /* Grain */
        .banner::after {
            content: '';
            position: absolute;
            inset: 0;
            z-index: 10;
            pointer-events: none;
            opacity: 0.03;
            background-image: url("data:image/svg+xml,%3Csvg viewBox='0 0 256 256' xmlns='http://www.w3.org/2000/svg'%3E%3Cfilter id='n'%3E%3CfeTurbulence type='fractalNoise' baseFrequency='0.9' numOctaves='4' stitchTiles='stitch'/%3E%3C/filter%3E%3Crect width='100%25' height='100%25' filter='url(%23n)'/%3E%3C/svg%3E");
            background-repeat: repeat;
            background-size: 256px;
        }

        /* Dot grid pattern */
        .dot-grid {
            position: absolute;
            inset: 0;
            z-index: 1;
            opacity: 0.35;
            background-image: radial-gradient(circle, rgba(130, 100, 255, 0.08) 1px, transparent 1px);
            background-size: 28px 28px;
        }

        /* Ambient orbs — shifted right */
        .orb {
            position: absolute;
            border-radius: 50%;
            filter: blur(120px);
        }
        .orb-1 {
            width: 550px; height: 550px;
            background: hsl(260, 100%, 60%);
            opacity: 0.1;
            top: -280px; right: 250px;
        }
        .orb-2 {
            width: 400px; height: 400px;
            background: hsl(175, 100%, 50%);
            opacity: 0.06;
            bottom: -220px; right: 80px;
        }
        .orb-3 {
            width: 300px; height: 300px;
            background: hsl(280, 100%, 70%);
            opacity: 0.04;
            top: 50%; left: 500px;
            transform: translateY(-50%);
        }

        /* Orbital ring SVG — positioned behind content */
        .orbital-ring {
            position: absolute;
            top: 50%;
            left: 780px;
            transform: translate(-50%, -50%);
            width: 480px;
            height: 480px;
            z-index: 2;
            pointer-events: none;
        }
        .orbital-ring .ring {
            fill: none;
            stroke-width: 1;
        }
        .orbital-ring .ring-1 {
            stroke: rgba(130, 100, 255, 0.12);
        }
        .orbital-ring .ring-2 {
            stroke: rgba(0, 255, 200, 0.06);
            stroke-dasharray: 6 12;
        }
        .orbital-ring .ring-3 {
            stroke: rgba(200, 120, 255, 0.05);
            stroke-dasharray: 4 16;
        }

        /* All content centered in the right 2/3 */
        .content {
            position: absolute;
            top: 0;
            right: 0;
            bottom: 0;
            left: 380px;
            z-index: 5;
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            text-align: center;
            padding: 0 80px 24px 0;
        }

        .badge {
            display: inline-flex;
            align-items: center;
            gap: 10px;
            padding: 7px 22px;
            border-radius: 100px;
            border: 1px solid hsla(260, 100%, 67%, 0.2);
            background: hsla(260, 100%, 67%, 0.06);
            font-family: 'IBM Plex Mono', monospace;
            font-size: 12px;
            color: hsl(260, 90%, 78%);
            margin-bottom: 24px;
            letter-spacing: 0.05em;
        }
        .badge .dot {
            width: 7px; height: 7px;
            border-radius: 50%;
            background: hsl(260, 100%, 75%);
            box-shadow: 0 0 12px hsl(260, 100%, 70%);
        }

        .title {
            font-family: 'Syne', sans-serif;
            font-size: 140px;
            font-weight: 800;
            letter-spacing: -0.05em;
            line-height: 1;
            margin-bottom: 6px;
            background: linear-gradient(135deg, hsl(260, 90%, 78%) 0%, #fff 45%, hsl(175, 100%, 55%) 100%);
            -webkit-background-clip: text;
            -webkit-text-fill-color: transparent;
            background-clip: text;
        }

        .ticker {
            font-family: 'IBM Plex Mono', monospace;
            font-size: 36px;
            font-weight: 500;
            color: hsl(260, 90%, 75%);
            margin-bottom: 20px;
            letter-spacing: 0.06em;
        }

        .tagline {
            font-family: 'Syne', sans-serif;
            font-size: 22px;
            color: rgba(240, 240, 248, 0.45);
            font-weight: 400;
            max-width: 620px;
            line-height: 1.35;
            letter-spacing: -0.01em;
        }

        /* Corner accents — refined */
        .corner {
            position: absolute;
            z-index: 4;
            width: 36px;
            height: 36px;
        }
        .corner-tl { top: 28px; left: 28px; border-top: 1px solid hsla(260, 100%, 67%, 0.2); border-left: 1px solid hsla(260, 100%, 67%, 0.2); }
        .corner-tr { top: 28px; right: 28px; border-top: 1px solid hsla(260, 100%, 67%, 0.2); border-right: 1px solid hsla(260, 100%, 67%, 0.2); }
        .corner-bl { bottom: 28px; left: 28px; border-bottom: 1px solid hsla(260, 100%, 67%, 0.2); border-left: 1px solid hsla(260, 100%, 67%, 0.2); }
        .corner-br { bottom: 28px; right: 28px; border-bottom: 1px solid hsla(260, 100%, 67%, 0.2); border-right: 1px solid hsla(260, 100%, 67%, 0.2); }

        /* Accent line — horizontal, subtler */
        .accent-line {
            position: absolute;
            top: 50%;
            left: 380px;
            right: 0;
            height: 1px;
            background: linear-gradient(90deg, transparent 0%, hsla(260, 100%, 67%, 0.1) 30%, hsla(175, 100%, 50%, 0.1) 70%, transparent 100%);
            z-index: 3;
        }
    </style>
</head>
<body>
    <div class="banner">
        <!-- Background effects -->
        <div class="orb orb-1"></div>
        <div class="orb orb-2"></div>
        <div class="orb orb-3"></div>
        <div class="dot-grid"></div>
        <div class="accent-line"></div>

        <!-- Orbital ring SVG -->
        <svg class="orbital-ring" viewBox="0 0 480 480">
            <circle class="ring ring-1" cx="240" cy="240" r="200"/>
            <circle class="ring ring-2" cx="240" cy="240" r="160"/>
            <circle class="ring ring-3" cx="240" cy="240" r="230"/>
        </svg>

        <!-- Corner accents -->
        <div class="corner corner-tl"></div>
        <div class="corner corner-tr"></div>
        <div class="corner corner-bl"></div>
        <div class="corner corner-br"></div>

        <!-- Content — all in the right 2/3, safe from profile pic -->
        <div class="content">
            <div class="badge">
                <span class="dot"></span>
                Autonomous on Virtuals Protocol
            </div>
            <div class="title">Basis</div>
            <div class="ticker">$BASIS</div>
            <div class="tagline">The autonomous AI agent powering universal basic income</div>
        </div>
    </div>
</body>
</html>
