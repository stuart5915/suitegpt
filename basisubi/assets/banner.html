<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Basis Banner</title>
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Space+Grotesk:wght@400;500;600;700&family=JetBrains+Mono:wght@400;500;600&display=swap" rel="stylesheet">
    <style>
        * { margin: 0; padding: 0; box-sizing: border-box; }
        body { background: #000; display: flex; align-items: center; justify-content: center; min-height: 100vh; }

        /* X/Twitter banner: 1500x500 */
        .banner {
            width: 1500px;
            height: 500px;
            background: #07070d;
            position: relative;
            overflow: hidden;
            font-family: 'Space Grotesk', system-ui, sans-serif;
        }

        /* Grain */
        .banner::after {
            content: '';
            position: absolute;
            inset: 0;
            z-index: 10;
            pointer-events: none;
            opacity: 0.04;
            background-image: url("data:image/svg+xml,%3Csvg viewBox='0 0 256 256' xmlns='http://www.w3.org/2000/svg'%3E%3Cfilter id='n'%3E%3CfeTurbulence type='fractalNoise' baseFrequency='0.9' numOctaves='4' stitchTiles='stitch'/%3E%3C/filter%3E%3Crect width='100%25' height='100%25' filter='url(%23n)'/%3E%3C/svg%3E");
            background-repeat: repeat;
            background-size: 256px;
        }

        /* Ambient orbs */
        .orb {
            position: absolute;
            border-radius: 50%;
            filter: blur(100px);
        }
        .orb-1 {
            width: 500px; height: 500px;
            background: hsl(255, 75%, 55%);
            opacity: 0.2;
            top: -200px; left: -50px;
        }
        .orb-2 {
            width: 400px; height: 400px;
            background: hsl(185, 80%, 50%);
            opacity: 0.12;
            bottom: -180px; right: 50px;
        }
        .orb-3 {
            width: 350px; height: 350px;
            background: hsl(255, 85%, 65%);
            opacity: 0.08;
            top: 50%; left: 55%;
            transform: translate(-50%, -50%);
        }

        /* Grid lines */
        .grid-overlay {
            position: absolute;
            inset: 0;
            z-index: 2;
            opacity: 0.04;
            background-image:
                linear-gradient(rgba(255,255,255,0.3) 1px, transparent 1px),
                linear-gradient(90deg, rgba(255,255,255,0.3) 1px, transparent 1px);
            background-size: 60px 60px;
        }

        /* Horizontal accent line */
        .accent-line {
            position: absolute;
            top: 50%;
            left: 0;
            right: 0;
            height: 1px;
            background: linear-gradient(90deg, transparent 0%, hsla(255, 75%, 60%, 0.3) 20%, hsla(185, 80%, 55%, 0.3) 80%, transparent 100%);
            z-index: 3;
        }

        /* Content */
        .content {
            position: absolute;
            inset: 0;
            z-index: 5;
            display: flex;
            flex-direction: row-reverse;
            align-items: center;
            padding: 0 120px 0 80px;
        }

        .left {
            flex: 1;
            text-align: right;
        }

        .badge {
            display: inline-flex;
            align-items: center;
            gap: 8px;
            padding: 8px 22px;
            border-radius: 100px;
            border: 1px solid hsla(255, 75%, 60%, 0.25);
            background: hsla(255, 75%, 60%, 0.08);
            font-family: 'JetBrains Mono', monospace;
            font-size: 14px;
            color: hsl(255, 85%, 75%);
            margin-bottom: 20px;
            letter-spacing: 0.03em;
        }
        .badge .dot {
            width: 7px; height: 7px;
            border-radius: 50%;
            background: hsl(255, 85%, 70%);
            box-shadow: 0 0 10px hsl(255, 85%, 70%);
        }

        .title {
            font-size: 120px;
            font-weight: 700;
            letter-spacing: -0.04em;
            line-height: 1;
            margin-bottom: 10px;
            background: linear-gradient(135deg, #f0f0f5 0%, hsl(255, 85%, 70%) 60%, hsl(185, 80%, 55%) 100%);
            -webkit-background-clip: text;
            -webkit-text-fill-color: transparent;
            background-clip: text;
        }

        .ticker {
            font-family: 'JetBrains Mono', monospace;
            font-size: 36px;
            font-weight: 500;
            color: hsl(255, 85%, 70%);
            margin-bottom: 18px;
        }

        .tagline {
            font-size: 24px;
            color: rgba(240, 240, 245, 0.6);
            font-weight: 400;
            max-width: 600px;
            line-height: 1.4;
            margin-left: auto;
        }

        /* Left side — logo (will be behind profile pic, that's fine) */
        .right {
            flex: 0 0 320px;
            display: flex;
            align-items: center;
            justify-content: center;
        }

        .symbol-ring {
            width: 280px;
            height: 280px;
            border-radius: 50%;
            border: 2px solid hsla(255, 75%, 60%, 0.2);
            display: flex;
            align-items: center;
            justify-content: center;
            position: relative;
        }
        .symbol-ring::before {
            content: '';
            position: absolute;
            inset: -20px;
            border-radius: 50%;
            border: 1px solid hsla(185, 80%, 55%, 0.1);
        }
        .symbol-ring::after {
            content: '';
            position: absolute;
            inset: 15px;
            border-radius: 50%;
            border: 1px solid hsla(255, 75%, 60%, 0.12);
        }

        .logo-img {
            width: 220px;
            height: 220px;
            border-radius: 50%;
            object-fit: cover;
            display: block;
            box-shadow:
                0 0 40px hsla(200, 90%, 50%, 0.35),
                0 0 80px hsla(220, 80%, 50%, 0.2),
                0 0 120px hsla(255, 75%, 55%, 0.12);
        }

        /* Orbiting dots */
        .orbit-dot {
            position: absolute;
            width: 6px;
            height: 6px;
            border-radius: 50%;
            background: hsl(255, 85%, 70%);
            box-shadow: 0 0 12px hsl(255, 85%, 70%);
        }
        .orbit-dot:nth-child(1) { top: 0; left: 50%; transform: translate(-50%, -50%); }
        .orbit-dot:nth-child(2) { bottom: 0; left: 50%; transform: translate(-50%, 50%); background: hsl(185, 80%, 55%); box-shadow: 0 0 12px hsl(185, 80%, 55%); }
        .orbit-dot:nth-child(3) { top: 50%; right: 0; transform: translate(50%, -50%); }
        .orbit-dot:nth-child(4) { top: 50%; left: 0; transform: translate(-50%, -50%); background: hsl(185, 80%, 55%); box-shadow: 0 0 12px hsl(185, 80%, 55%); }

        /* Corner accents */
        .corner {
            position: absolute;
            z-index: 4;
            width: 40px;
            height: 40px;
        }
        .corner-tl { top: 30px; left: 30px; border-top: 1px solid hsla(255, 75%, 60%, 0.3); border-left: 1px solid hsla(255, 75%, 60%, 0.3); }
        .corner-tr { top: 30px; right: 30px; border-top: 1px solid hsla(255, 75%, 60%, 0.3); border-right: 1px solid hsla(255, 75%, 60%, 0.3); }
        .corner-bl { bottom: 30px; left: 30px; border-bottom: 1px solid hsla(255, 75%, 60%, 0.3); border-left: 1px solid hsla(255, 75%, 60%, 0.3); }
        .corner-br { bottom: 30px; right: 30px; border-bottom: 1px solid hsla(255, 75%, 60%, 0.3); border-right: 1px solid hsla(255, 75%, 60%, 0.3); }
    </style>
</head>
<body>
    <div class="banner">
        <!-- Background effects -->
        <div class="orb orb-1"></div>
        <div class="orb orb-2"></div>
        <div class="orb orb-3"></div>
        <div class="grid-overlay"></div>
        <div class="accent-line"></div>

        <!-- Corner accents -->
        <div class="corner corner-tl"></div>
        <div class="corner corner-tr"></div>
        <div class="corner corner-bl"></div>
        <div class="corner corner-br"></div>

        <!-- Content -->
        <div class="content">
            <div class="left">
                <div class="badge">
                    <span class="dot"></span>
                    Autonomous on Virtuals Protocol
                </div>
                <div class="title">Basis</div>
                <div class="ticker">$BASIS</div>
                <div class="tagline">The autonomous AI agent powering universal income</div>
            </div>
            <div class="right">
                <div class="symbol-ring">
                    <span class="orbit-dot"></span>
                    <span class="orbit-dot"></span>
                    <span class="orbit-dot"></span>
                    <span class="orbit-dot"></span>
                    <img src="../basistoken.jpg" alt="Basis" class="logo-img">
                </div>
            </div>
        </div>
    </div>
</body>
</html>
