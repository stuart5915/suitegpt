<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Basis Banner</title>
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Syne:wght@400;500;600;700;800&family=IBM+Plex+Mono:wght@400;500;600&display=swap" rel="stylesheet">
    <style>
        * { margin: 0; padding: 0; box-sizing: border-box; }
        body { background: #000; display: flex; align-items: center; justify-content: center; min-height: 100vh; }

        .banner {
            width: 1500px;
            height: 500px;
            background: #04040a;
            position: relative;
            overflow: hidden;
            display: flex;
            align-items: center;
            justify-content: center;
        }

        /* Grain */
        .banner::after {
            content: '';
            position: absolute;
            inset: 0;
            z-index: 10;
            pointer-events: none;
            opacity: 0.025;
            background-image: url("data:image/svg+xml,%3Csvg viewBox='0 0 256 256' xmlns='http://www.w3.org/2000/svg'%3E%3Cfilter id='n'%3E%3CfeTurbulence type='fractalNoise' baseFrequency='0.9' numOctaves='4' stitchTiles='stitch'/%3E%3C/filter%3E%3Crect width='100%25' height='100%25' filter='url(%23n)'/%3E%3C/svg%3E");
            background-repeat: repeat;
            background-size: 256px;
        }

        /* Radial glow behind text */
        .glow {
            position: absolute;
            top: 50%;
            left: 50%;
            transform: translate(-50%, -50%);
            width: 800px;
            height: 400px;
            background: radial-gradient(ellipse, hsla(260, 100%, 50%, 0.1) 0%, hsla(260, 100%, 50%, 0.03) 45%, transparent 70%);
            z-index: 1;
            pointer-events: none;
        }

        /* Ambient orbs */
        .orb {
            position: absolute;
            border-radius: 50%;
            filter: blur(120px);
            z-index: 1;
            pointer-events: none;
        }
        .orb-1 {
            width: 500px; height: 500px;
            background: hsl(260, 100%, 50%);
            opacity: 0.1;
            top: -250px; left: 50%;
            transform: translateX(-50%);
        }
        .orb-2 {
            width: 350px; height: 350px;
            background: hsl(175, 100%, 45%);
            opacity: 0.05;
            bottom: -200px; right: 250px;
        }

        /* Orbital ring — absolutely centered */
        .orbital {
            position: absolute;
            top: 50%;
            left: 50%;
            transform: translate(-50%, -50%);
            width: 460px;
            height: 460px;
            z-index: 2;
            pointer-events: none;
        }
        .orbital .ring { fill: none; }
        .orbital .r1 { stroke: rgba(130, 100, 255, 0.09); stroke-width: 1; }
        .orbital .r2 { stroke: rgba(130, 100, 255, 0.06); stroke-width: 0.7; stroke-dasharray: 6 10; }
        .orbital .r3 { stroke: rgba(0, 255, 200, 0.04); stroke-width: 0.5; stroke-dasharray: 3 8; }

        /* Content — dead center with flexbox, slight upward nudge */
        .content {
            position: relative;
            z-index: 5;
            display: flex;
            flex-direction: column;
            align-items: center;
            text-align: center;
            margin-top: -16px;
        }

        .badge {
            display: inline-flex;
            align-items: center;
            gap: 10px;
            padding: 8px 22px;
            border-radius: 100px;
            border: 1px solid hsla(260, 100%, 67%, 0.18);
            background: hsla(260, 100%, 67%, 0.05);
            font-family: 'IBM Plex Mono', monospace;
            font-size: 13px;
            color: hsl(260, 85%, 76%);
            margin-bottom: 18px;
            letter-spacing: 0.04em;
        }
        .badge .dot {
            width: 7px; height: 7px;
            border-radius: 50%;
            background: hsl(260, 100%, 72%);
            box-shadow: 0 0 14px hsl(260, 100%, 65%);
        }

        .title {
            font-family: 'Syne', sans-serif;
            font-size: 120px;
            font-weight: 800;
            letter-spacing: -0.04em;
            line-height: 0.9;
            margin-bottom: 6px;
            padding: 0 40px;
            background: linear-gradient(145deg, hsl(260, 80%, 78%) 0%, #fff 30%, #fff 60%, hsl(175, 100%, 58%) 100%);
            -webkit-background-clip: text;
            -webkit-text-fill-color: transparent;
            background-clip: text;
        }

        .ticker {
            font-family: 'IBM Plex Mono', monospace;
            font-size: 34px;
            font-weight: 500;
            color: hsl(260, 85%, 73%);
            margin-bottom: 16px;
            letter-spacing: 0.1em;
        }

        .tagline {
            font-family: 'Syne', sans-serif;
            font-size: 20px;
            color: rgba(240, 240, 248, 0.38);
            font-weight: 500;
            line-height: 1.4;
            letter-spacing: -0.01em;
        }

        /* Corner accents */
        .corner {
            position: absolute;
            z-index: 4;
            width: 30px;
            height: 30px;
        }
        .corner-tl { top: 24px; left: 24px; border-top: 1px solid hsla(260, 100%, 67%, 0.13); border-left: 1px solid hsla(260, 100%, 67%, 0.13); }
        .corner-tr { top: 24px; right: 24px; border-top: 1px solid hsla(260, 100%, 67%, 0.13); border-right: 1px solid hsla(260, 100%, 67%, 0.13); }
        .corner-bl { bottom: 24px; left: 24px; border-bottom: 1px solid hsla(260, 100%, 67%, 0.13); border-left: 1px solid hsla(260, 100%, 67%, 0.13); }
        .corner-br { bottom: 24px; right: 24px; border-bottom: 1px solid hsla(260, 100%, 67%, 0.13); border-right: 1px solid hsla(260, 100%, 67%, 0.13); }
    </style>
</head>
<body>
    <div class="banner">
        <!-- Background -->
        <div class="glow"></div>
        <div class="orb orb-1"></div>
        <div class="orb orb-2"></div>

        <!-- Orbital ring -->
        <svg class="orbital" viewBox="0 0 460 460">
            <circle class="ring r1" cx="230" cy="230" r="220"/>
            <circle class="ring r2" cx="230" cy="230" r="170"/>
            <circle class="ring r3" cx="230" cy="230" r="120"/>
        </svg>

        <!-- Corners -->
        <div class="corner corner-tl"></div>
        <div class="corner corner-tr"></div>
        <div class="corner corner-bl"></div>
        <div class="corner corner-br"></div>

        <!-- Content — centered via parent flexbox -->
        <div class="content">
            <div class="badge">
                <span class="dot"></span>
                Autonomous on Virtuals Protocol
            </div>
            <div class="title">Basis</div>
            <div class="ticker">$BASIS</div>
            <div class="tagline">The autonomous AI agent powering universal basic income</div>
        </div>
    </div>
</body>
</html>
