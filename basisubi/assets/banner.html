<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Basis Banner</title>
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Space+Grotesk:wght@400;500;600;700&family=JetBrains+Mono:wght@400;500;600&display=swap" rel="stylesheet">
    <style>
        * { margin: 0; padding: 0; box-sizing: border-box; }
        body { background: #000; display: flex; align-items: center; justify-content: center; min-height: 100vh; }

        /* X/Twitter banner: 1500x500 */
        .banner {
            width: 1500px;
            height: 500px;
            background: #07070d;
            position: relative;
            overflow: hidden;
            font-family: 'Space Grotesk', system-ui, sans-serif;
        }

        /* Grain */
        .banner::after {
            content: '';
            position: absolute;
            inset: 0;
            z-index: 10;
            pointer-events: none;
            opacity: 0.04;
            background-image: url("data:image/svg+xml,%3Csvg viewBox='0 0 256 256' xmlns='http://www.w3.org/2000/svg'%3E%3Cfilter id='n'%3E%3CfeTurbulence type='fractalNoise' baseFrequency='0.9' numOctaves='4' stitchTiles='stitch'/%3E%3C/filter%3E%3Crect width='100%25' height='100%25' filter='url(%23n)'/%3E%3C/svg%3E");
            background-repeat: repeat;
            background-size: 256px;
        }

        /* Ambient orbs — shifted right to avoid profile pic area */
        .orb {
            position: absolute;
            border-radius: 50%;
            filter: blur(100px);
        }
        .orb-1 {
            width: 500px; height: 500px;
            background: hsl(255, 75%, 55%);
            opacity: 0.15;
            top: -250px; right: 300px;
        }
        .orb-2 {
            width: 400px; height: 400px;
            background: hsl(185, 80%, 50%);
            opacity: 0.08;
            bottom: -200px; right: 100px;
        }

        /* Grid lines */
        .grid-overlay {
            position: absolute;
            inset: 0;
            z-index: 2;
            opacity: 0.03;
            background-image:
                linear-gradient(rgba(255,255,255,0.3) 1px, transparent 1px),
                linear-gradient(90deg, rgba(255,255,255,0.3) 1px, transparent 1px);
            background-size: 60px 60px;
        }

        /* All content centered in the right 2/3 of the banner */
        .content {
            position: absolute;
            top: 0;
            right: 0;
            bottom: 0;
            left: 380px; /* avoid profile pic zone entirely */
            z-index: 5;
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            text-align: center;
            padding: 0 80px 30px 0;
        }

        .badge {
            display: inline-flex;
            align-items: center;
            gap: 8px;
            padding: 7px 20px;
            border-radius: 100px;
            border: 1px solid hsla(255, 75%, 60%, 0.25);
            background: hsla(255, 75%, 60%, 0.08);
            font-family: 'JetBrains Mono', monospace;
            font-size: 13px;
            color: hsl(255, 85%, 75%);
            margin-bottom: 22px;
            letter-spacing: 0.03em;
        }
        .badge .dot {
            width: 7px; height: 7px;
            border-radius: 50%;
            background: hsl(255, 85%, 70%);
            box-shadow: 0 0 10px hsl(255, 85%, 70%);
        }

        .title {
            font-size: 130px;
            font-weight: 700;
            letter-spacing: -0.04em;
            line-height: 1;
            margin-bottom: 6px;
            background: linear-gradient(135deg, #f0f0f5 0%, hsl(255, 85%, 70%) 60%, hsl(185, 80%, 55%) 100%);
            -webkit-background-clip: text;
            -webkit-text-fill-color: transparent;
            background-clip: text;
        }

        .ticker {
            font-family: 'JetBrains Mono', monospace;
            font-size: 38px;
            font-weight: 500;
            color: hsl(255, 85%, 70%);
            margin-bottom: 18px;
        }

        .tagline {
            font-size: 24px;
            color: rgba(240, 240, 245, 0.55);
            font-weight: 400;
            max-width: 650px;
            line-height: 1.35;
        }

        /* Corner accents */
        .corner {
            position: absolute;
            z-index: 4;
            width: 40px;
            height: 40px;
        }
        .corner-tl { top: 30px; left: 30px; border-top: 1px solid hsla(255, 75%, 60%, 0.3); border-left: 1px solid hsla(255, 75%, 60%, 0.3); }
        .corner-tr { top: 30px; right: 30px; border-top: 1px solid hsla(255, 75%, 60%, 0.3); border-right: 1px solid hsla(255, 75%, 60%, 0.3); }
        .corner-bl { bottom: 30px; left: 30px; border-bottom: 1px solid hsla(255, 75%, 60%, 0.3); border-left: 1px solid hsla(255, 75%, 60%, 0.3); }
        .corner-br { bottom: 30px; right: 30px; border-bottom: 1px solid hsla(255, 75%, 60%, 0.3); border-right: 1px solid hsla(255, 75%, 60%, 0.3); }

        /* Accent line — horizontal */
        .accent-line {
            position: absolute;
            top: 50%;
            left: 380px;
            right: 0;
            height: 1px;
            background: linear-gradient(90deg, transparent 0%, hsla(255, 75%, 60%, 0.15) 30%, hsla(185, 80%, 55%, 0.15) 70%, transparent 100%);
            z-index: 3;
        }
    </style>
</head>
<body>
    <div class="banner">
        <!-- Background effects -->
        <div class="orb orb-1"></div>
        <div class="orb orb-2"></div>
        <div class="grid-overlay"></div>
        <div class="accent-line"></div>

        <!-- Corner accents -->
        <div class="corner corner-tl"></div>
        <div class="corner corner-tr"></div>
        <div class="corner corner-bl"></div>
        <div class="corner corner-br"></div>

        <!-- Content — all in the right 2/3, safe from profile pic -->
        <div class="content">
            <div class="badge">
                <span class="dot"></span>
                Autonomous on Virtuals Protocol
            </div>
            <div class="title">Basis</div>
            <div class="ticker">$BASIS</div>
            <div class="tagline">The autonomous AI agent powering universal basic income</div>
        </div>
    </div>
</body>
</html>
