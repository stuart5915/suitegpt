    <style>
        body { opacity: 1; background: var(--bg-deepest); }

        .tokens-page {
            max-width: 1100px;
            margin: 0 auto;
            padding: var(--space-lg) var(--space-lg) var(--space-3xl);
        }

        /* ── Hero ── */
        .tokens-hero {
            text-align: center;
            margin-bottom: var(--space-2xl);
            animation: fadeUp 0.5s ease both;
        }
        .tokens-hero h1 {
            font-family: var(--font-display);
            font-size: 2.2rem;
            font-weight: 900;
            background: var(--title-gradient);
            -webkit-background-clip: text;
            -webkit-text-fill-color: transparent;
            background-clip: text;
            line-height: 1.15;
            margin-bottom: var(--space-xs);
        }
        .tokens-hero p {
            font-size: 0.95rem;
            color: var(--text-dim);
            max-width: 480px;
            margin: 0 auto;
        }

        /* ── Toolbar ── */
        .tokens-toolbar {
            display: flex;
            align-items: center;
            justify-content: space-between;
            gap: var(--space-sm);
            margin-bottom: var(--space-md);
            flex-wrap: wrap;
        }
        .token-tabs {
            display: flex;
            gap: 4px;
            background: var(--bg-card);
            border-radius: var(--radius-full);
            padding: 3px;
            border: 1px solid var(--border-subtle);
        }
        .token-tab {
            background: transparent;
            border: none;
            border-radius: var(--radius-full);
            padding: 7px 16px;
            font-family: var(--font-mono);
            font-size: 0.78rem;
            font-weight: 600;
            color: var(--text-dim);
            cursor: pointer;
            transition: all 0.15s ease;
            white-space: nowrap;
        }
        .token-tab:hover { color: var(--text-secondary); }
        .token-tab.active {
            background: var(--bg-elevated);
            color: var(--text-primary);
            box-shadow: 0 1px 4px rgba(0,0,0,0.3);
        }
        .lp-filters {
            display: flex;
            gap: 4px;
        }
        .lp-filter-tab {
            background: transparent;
            border: 1px solid var(--border-subtle);
            border-radius: 20px;
            padding: 5px 14px;
            font-family: var(--font-body);
            font-size: 0.75rem;
            font-weight: 600;
            color: var(--text-dim);
            cursor: pointer;
            transition: all 0.15s;
        }
        .lp-filter-tab:hover {
            color: var(--text-secondary);
            border-color: var(--border-default);
        }
        .lp-filter-tab.active {
            background: var(--accent-primary, #6366f1);
            border-color: var(--accent-primary, #6366f1);
            color: #fff;
        }
        .lp-sort {
            margin-left: auto;
            background: var(--bg-elevated);
            border: 1px solid var(--border-subtle);
            border-radius: 20px;
            padding: 5px 14px;
            font-family: var(--font-body);
            font-size: 0.75rem;
            font-weight: 600;
            color: var(--text-secondary);
            cursor: pointer;
            appearance: auto;
        }

        /* ── Table ── */
        .tokens-table {
            width: 100%;
            border-collapse: separate;
            border-spacing: 0;
            table-layout: fixed;
        }
        .tokens-table thead th {
            font-family: var(--font-mono);
            font-size: 0.68rem;
            font-weight: 600;
            color: var(--text-dim);
            text-transform: uppercase;
            letter-spacing: 0.06em;
            padding: 10px 12px;
            text-align: left;
            border-bottom: 1px solid var(--border-subtle);
            position: sticky;
            top: 0;
            background: var(--bg-deepest);
            z-index: 2;
        }
        .tokens-table thead th:first-child { padding-left: 16px; width: 40px; }
        .tokens-table thead th.col-name { width: 30%; }
        .tokens-table thead th.col-mcap { text-align: right; width: 110px; }
        .tokens-table thead th.col-badges { text-align: center; }
        .tokens-table thead th.col-actions { text-align: right; padding-right: 16px; width: 260px; }

        .tokens-table tbody tr {
            cursor: pointer;
            transition: background 0.15s;
        }
        .tokens-table tbody tr:hover {
            background: var(--bg-elevated);
        }
        .tokens-table tbody td {
            padding: 14px 12px;
            border-bottom: 1px solid var(--border-subtle);
            vertical-align: middle;
        }
        .tokens-table tbody td:first-child { padding-left: 16px; }
        .tokens-table tbody td:last-child { padding-right: 16px; }

        /* Row number */
        .tok-rank {
            font-family: var(--font-mono);
            font-size: 0.75rem;
            color: var(--text-dim);
        }

        /* Name cell */
        .tok-name-cell {
            display: flex;
            align-items: center;
            gap: 10px;
            overflow: hidden;
        }
        .tok-logo {
            width: 32px;
            height: 32px;
            border-radius: 50%;
            object-fit: cover;
            flex-shrink: 0;
        }
        .tok-logo-placeholder {
            width: 32px;
            height: 32px;
            border-radius: 50%;
            display: flex;
            align-items: center;
            justify-content: center;
            font-weight: 800;
            font-size: 0.8rem;
            color: #fff;
            flex-shrink: 0;
        }
        .tok-name {
            font-family: var(--font-heading);
            font-size: 0.88rem;
            font-weight: 700;
            color: var(--text-primary);
            line-height: 1.2;
            overflow: hidden;
            text-overflow: ellipsis;
            white-space: nowrap;
        }
        .tok-symbol {
            font-family: var(--font-mono);
            font-size: 0.7rem;
            color: var(--text-dim);
            margin-left: 6px;
        }

        /* Market cap */
        .tok-mcap {
            font-family: var(--font-mono);
            font-size: 0.82rem;
            font-weight: 700;
            color: var(--text-secondary);
            text-align: right;
            white-space: nowrap;
            display: block;
        }

        /* Badges */
        .tok-badges {
            display: flex;
            gap: 4px;
            justify-content: center;
            flex-wrap: wrap;
        }
        .tok-badges span {
            font-family: var(--font-mono);
            font-size: 0.6rem;
            font-weight: 700;
            padding: 2px 7px;
            border-radius: 4px;
            text-transform: uppercase;
            letter-spacing: 0.04em;
            white-space: nowrap;
        }
        .lp-tier-incubated   { background: rgba(99,102,241,0.15); color: #818cf8; }
        .lp-tier-permissionless { background: rgba(34,197,94,0.15); color: #4ade80; }
        .lp-tier-ecosystem   { background: rgba(251,191,36,0.15); color: #fbbf24; }
        .lp-tier-partner     { background: rgba(236,72,153,0.15); color: #f472b6; }
        .lp-tier-drops       { background: rgba(139,92,246,0.15); color: #a78bfa; }
        .lp-badge-staking    { background: rgba(45,212,191,0.15); color: #2dd4bf; }
        .lp-badge-agent      { background: rgba(139,92,246,0.15); color: #a78bfa; }
        .lp-chain-base       { background: rgba(56,133,255,0.15); color: #3885ff; }
        .lp-chain-solana     { background: rgba(0,209,140,0.12); color: #00d18c; }
        .lp-chain-cardano    { background: rgba(0,51,180,0.12); color: #4a84ff; }

        /* Action buttons */
        .tok-actions {
            display: flex;
            gap: 6px;
            justify-content: flex-end;
        }
        .tok-actions a {
            font-family: var(--font-mono);
            font-size: 0.65rem;
            font-weight: 700;
            padding: 5px 12px;
            border-radius: 6px;
            text-decoration: none;
            text-transform: uppercase;
            letter-spacing: 0.04em;
            transition: all 0.15s;
            white-space: nowrap;
        }
        .tok-actions a:hover, .tok-actions button:hover { opacity: 0.8; }
        .btn-wallet {
            background: rgba(251,191,36,0.12);
            color: #fbbf24;
            border: 1px solid rgba(251,191,36,0.2);
            font-family: var(--font-mono);
            font-size: 0.65rem;
            font-weight: 700;
            padding: 5px 10px;
            border-radius: 6px;
            text-transform: uppercase;
            letter-spacing: 0.04em;
            cursor: pointer;
            transition: all 0.15s;
            white-space: nowrap;
        }
        .btn-clanker {
            background: rgba(99,102,241,0.12);
            color: #818cf8;
            border: 1px solid rgba(99,102,241,0.2);
        }
        .btn-uniswap {
            background: rgba(236,72,153,0.12);
            color: #f472b6;
            border: 1px solid rgba(236,72,153,0.2);
        }
        .btn-stake {
            background: rgba(45,212,191,0.12);
            color: #2dd4bf;
            border: 1px solid rgba(45,212,191,0.2);
        }

        /* Loading / empty */
        .tokens-loading, .tokens-empty {
            text-align: center;
            padding: var(--space-3xl) var(--space-lg);
            color: var(--text-dim);
            font-family: var(--font-body);
            font-size: 0.9rem;
        }

        /* ── Mobile ── */
        @media (max-width: 768px) {
            .tokens-table thead { display: none; }
            .tokens-table, .tokens-table tbody, .tokens-table tr, .tokens-table td {
                display: block;
            }
            .tokens-table tbody tr {
                padding: 14px 16px;
                border-bottom: 1px solid var(--border-subtle);
                display: grid;
                grid-template-columns: auto 1fr auto;
                grid-template-rows: auto auto;
                gap: 6px 10px;
                align-items: center;
            }
            .tokens-table tbody td {
                padding: 0;
                border: none;
            }
            /* rank */
            .tokens-table tbody td:nth-child(1) {
                grid-row: 1 / 3;
                align-self: center;
            }
            /* name */
            .tokens-table tbody td:nth-child(2) {
                grid-column: 2;
                grid-row: 1;
            }
            /* mcap */
            .tokens-table tbody td:nth-child(3) {
                grid-column: 3;
                grid-row: 1;
            }
            .tok-mcap { font-size: 0.78rem; }
            /* badges */
            .tokens-table tbody td:nth-child(4) {
                grid-column: 2 / 4;
                grid-row: 2;
            }
            .tok-badges { justify-content: flex-start; }
            /* actions */
            .tokens-table tbody td:nth-child(5) {
                display: none;
            }
        }
        @media (max-width: 480px) {
            .tokens-hero h1 { font-size: 1.6rem; }
            .tokens-toolbar { gap: 4px; }
            .lp-filter-tab { padding: 4px 10px; font-size: 0.7rem; }
        }

        /* ── Footer ── */
        .footer {
            text-align: center;
            padding: var(--space-2xl) var(--space-lg);
            color: var(--text-dim);
            font-size: 0.82rem;
        }
    </style>
</head>
