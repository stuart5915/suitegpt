<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Tokens — Inclawbate</title>
    <meta name="description" content="Browse all tokens launched on Inclawbator. View market caps, staking status, and trade on Clanker or Uniswap.">
    <meta property="og:title" content="Tokens — Inclawbate">
    <meta property="og:description" content="Browse all tokens launched on Inclawbator. View market caps, staking status, and trade on Clanker or Uniswap.">
    <meta property="og:type" content="website">
    <meta property="og:url" content="https://inclawbate.com/tokens">
    <meta property="og:image" content="https://www.inclawbate.com/api/inclawbate/og?page=tokens">
    <meta name="twitter:card" content="summary_large_image">
    <meta name="twitter:site" content="@inclawbate">
    <link rel="icon" href="data:image/svg+xml,<svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 100 100'><text y='.9em' font-size='90'>&#129438;</text></svg>">
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Nunito:wght@400;500;600;700;800;900&family=JetBrains+Mono:wght@300;400;600;700&display=swap" rel="stylesheet">
    <style>body{opacity:0}</style>
    <link rel="stylesheet" href="/styles/core.css">
    <link rel="stylesheet" href="/styles/components.css">
    <style>
        body { opacity: 1; background: var(--bg-deepest); }

        .tokens-page {
            max-width: 1100px;
            margin: 0 auto;
            padding: calc(var(--nav-height) + var(--space-xl)) var(--space-lg) var(--space-3xl);
        }

        /* ── Hero ── */
        .tokens-hero {
            text-align: center;
            margin-bottom: var(--space-2xl);
            animation: fadeUp 0.5s ease both;
        }
        .tokens-hero h1 {
            font-family: var(--font-display);
            font-size: 2.4rem;
            font-weight: 900;
            background: var(--title-gradient);
            -webkit-background-clip: text;
            -webkit-text-fill-color: transparent;
            background-clip: text;
            line-height: 1.15;
            margin-bottom: var(--space-sm);
        }
        .tokens-hero p {
            font-size: 1.05rem;
            color: var(--text-secondary);
            max-width: 520px;
            margin: 0 auto;
        }

        /* ── Live Projects Section ── */
        .live-projects-section {
            margin-bottom: var(--space-3xl);
        }
        .live-projects-header {
            display: flex;
            align-items: center;
            gap: var(--space-md);
            margin-bottom: var(--space-lg);
            flex-wrap: wrap;
        }
        .live-projects-header h2 {
            font-family: var(--font-heading);
            font-size: 1.3rem;
            font-weight: 800;
            color: var(--text-primary);
            margin: 0;
            white-space: nowrap;
        }
        .lp-filters {
            display: flex;
            gap: 6px;
            margin-left: auto;
        }
        .lp-filter-tab {
            background: var(--bg-elevated);
            border: 1px solid var(--border-subtle);
            border-radius: var(--radius-md, 8px);
            padding: 6px 14px;
            font-family: var(--font-body);
            font-size: 0.78rem;
            font-weight: 600;
            color: var(--text-dim);
            cursor: pointer;
            transition: all 0.2s;
        }
        .lp-filter-tab:hover {
            color: var(--text-secondary);
            border-color: var(--border-default);
        }
        .lp-filter-tab.active {
            background: var(--accent-primary, #6366f1);
            border-color: var(--accent-primary, #6366f1);
            color: #fff;
        }
        .lp-sort {
            background: var(--bg-elevated);
            border: 1px solid var(--border-subtle);
            border-radius: var(--radius-md, 8px);
            padding: 6px 12px;
            font-family: var(--font-body);
            font-size: 0.78rem;
            font-weight: 600;
            color: var(--text-secondary);
            cursor: pointer;
            appearance: auto;
        }
        .projects-grid {
            display: grid;
            grid-template-columns: repeat(auto-fill, minmax(280px, 1fr));
            gap: var(--space-md);
        }
        .projects-loading {
            grid-column: 1 / -1;
            text-align: center;
            padding: var(--space-2xl);
            color: var(--text-dim);
            font-family: var(--font-body);
            font-size: 0.9rem;
        }
        .projects-empty {
            grid-column: 1 / -1;
            text-align: center;
            padding: var(--space-2xl);
            color: var(--text-dim);
            font-family: var(--font-body);
            font-size: 0.88rem;
        }
        .project-card {
            background: var(--bg-card);
            border: 1px solid var(--border-subtle);
            border-radius: var(--radius-lg, 16px);
            padding: var(--space-lg);
            cursor: pointer;
            transition: transform 0.2s, box-shadow 0.2s, border-color 0.2s;
            text-decoration: none;
            color: inherit;
            display: block;
            animation: lpCardIn 0.35s ease both;
        }
        .project-card:hover {
            transform: translateY(-3px);
            box-shadow: 0 8px 24px rgba(0,0,0,0.25);
            border-color: var(--border-default);
        }
        @keyframes lpCardIn {
            from { opacity: 0; transform: translateY(12px); }
            to   { opacity: 1; transform: translateY(0); }
        }
        .project-card-head {
            display: flex;
            align-items: center;
            gap: var(--space-sm);
            margin-bottom: var(--space-sm);
        }
        .project-card-logo {
            width: 40px;
            height: 40px;
            border-radius: 50%;
            object-fit: cover;
            flex-shrink: 0;
        }
        .project-card-logo-placeholder {
            width: 40px;
            height: 40px;
            border-radius: 50%;
            display: flex;
            align-items: center;
            justify-content: center;
            font-weight: 800;
            font-size: 1rem;
            color: #fff;
            flex-shrink: 0;
        }
        .project-card-name {
            font-family: var(--font-heading);
            font-size: 0.95rem;
            font-weight: 700;
            color: var(--text-primary);
            line-height: 1.2;
        }
        .project-card-symbol {
            font-family: var(--font-mono);
            font-size: 0.72rem;
            color: var(--text-dim);
        }
        .project-card-badges {
            display: flex;
            flex-wrap: wrap;
            gap: 5px;
            margin-bottom: var(--space-sm);
        }
        .project-card-badges span {
            font-family: var(--font-mono);
            font-size: 0.65rem;
            font-weight: 700;
            padding: 3px 8px;
            border-radius: 6px;
            text-transform: uppercase;
            letter-spacing: 0.04em;
        }
        .lp-tier-incubated   { background: rgba(99,102,241,0.15); color: #818cf8; }
        .lp-tier-permissionless { background: rgba(34,197,94,0.15); color: #4ade80; }
        .lp-tier-ecosystem   { background: rgba(251,191,36,0.15); color: #fbbf24; }
        .lp-tier-partner     { background: rgba(236,72,153,0.15); color: #f472b6; }
        .lp-badge-staking    { background: rgba(45,212,191,0.15); color: #2dd4bf; }
        .lp-badge-agent      { background: rgba(139,92,246,0.15); color: #a78bfa; }
        .project-card-mcap {
            font-family: var(--font-mono);
            font-size: 0.82rem;
            font-weight: 700;
            color: var(--text-secondary);
            margin-top: var(--space-xs);
        }
        .project-card-actions {
            display: flex;
            gap: 6px;
            margin-top: var(--space-sm);
        }
        .project-card-actions a {
            font-family: var(--font-mono);
            font-size: 0.68rem;
            font-weight: 700;
            padding: 4px 10px;
            border-radius: 6px;
            text-decoration: none;
            text-transform: uppercase;
            letter-spacing: 0.04em;
            transition: opacity 0.2s;
        }
        .project-card-actions a:hover {
            opacity: 0.8;
        }
        .btn-clanker {
            background: rgba(99,102,241,0.15);
            color: #818cf8;
        }
        .btn-uniswap {
            background: rgba(236,72,153,0.15);
            color: #f472b6;
        }
        @media (max-width: 600px) {
            .live-projects-header {
                flex-direction: column;
                align-items: flex-start;
            }
            .lp-filters {
                margin-left: 0;
            }
            .projects-grid {
                grid-template-columns: 1fr;
            }
        }

        /* ── Footer ── */
        .footer {
            text-align: center;
            padding: var(--space-2xl) var(--space-lg);
            color: var(--text-dim);
            font-size: 0.82rem;
        }
    </style>
</head>
<body>

<nav class="nav">
    <a href="/" class="nav-brand">
        <span class="nav-logo">inclawbate &#129438;</span>
    </a>
    <div class="nav-links">
        <a href="/stake" class="nav-link">Stake</a>
        <a href="/angel" class="nav-link">NFT</a>
        <a href="/apps" class="nav-link">Apps</a>
        <a href="/tokens" class="nav-link active">Tokens</a>
        <a href="/inclawbator" class="nav-link">Inclawbator</a>
        <a href="/dashboard" class="nav-link">Dashboard</a>
        <a href="/blog" class="nav-link">Blog</a>
    </div>
</nav>

<div class="tokens-page">

    <section class="tokens-hero">
        <h1>Tokens Launched</h1>
        <p>All tokens launched through the Inclawbator. Trade on Clanker or Uniswap.</p>
    </section>

    <section class="live-projects-section" id="liveProjectsSection">
        <div class="live-projects-header">
            <h2>All Tokens</h2>
            <div class="lp-filters" id="lpFilters">
                <button class="lp-filter-tab active" data-filter="all">All</button>
                <button class="lp-filter-tab" data-filter="tokens">Tokens</button>
                <button class="lp-filter-tab" data-filter="staking">Staking</button>
                <button class="lp-filter-tab" data-filter="agents">Agents</button>
            </div>
            <select class="lp-sort" id="lpSort">
                <option value="mcap">Market Cap</option>
                <option value="newest">Newest</option>
            </select>
        </div>
        <div id="liveProjectsGrid" class="projects-grid">
            <div class="projects-loading">Loading projects...</div>
        </div>
    </section>

</div>

<footer class="footer">
    <p>&copy; 2026 Inclawbate. Built on Base.</p>
</footer>

<script src="/inclawbate/js/tokens-app.js"></script>

</body>
</html>
