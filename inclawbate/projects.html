    <style>body{opacity:0}.nav{position:fixed;top:0;left:0;right:0;height:60px;display:flex;align-items:center;justify-content:space-between;padding:0 28px;z-index:100}</style>
    <link rel="stylesheet" href="/styles/core.css">
    <link rel="stylesheet" href="/styles/components.css">
    <style>
        body { opacity: 1; background: var(--bg-deepest); }

        .explore-page {
            max-width: 1100px;
            margin: 0 auto;
            padding: calc(var(--nav-height) + var(--space-xl)) var(--space-lg) var(--space-3xl);
        }

        /* ── Hero ── */
        .explore-hero {
            text-align: center;
            margin-bottom: var(--space-2xl);
            animation: fadeUp 0.5s ease both;
        }
        .explore-hero h1 {
            font-family: var(--font-display);
            font-size: 2.2rem;
            font-weight: 900;
            background: var(--title-gradient);
            -webkit-background-clip: text;
            -webkit-text-fill-color: transparent;
            background-clip: text;
            line-height: 1.15;
            margin-bottom: var(--space-xs);
        }
        .explore-hero p {
            font-size: 0.95rem;
            color: var(--text-dim);
            max-width: 480px;
            margin: 0 auto;
        }

        /* ── Toolbar ── */
        .explore-toolbar {
            display: flex;
            align-items: center;
            gap: var(--space-sm);
            margin-bottom: var(--space-md);
            flex-wrap: wrap;
        }
        .explore-search {
            flex: 1;
            min-width: 180px;
            padding: 8px 14px;
            font-family: var(--font-body);
            font-size: 0.85rem;
            color: var(--text-primary);
            background: var(--bg-card);
            border: 1px solid var(--border-subtle);
            border-radius: var(--radius-full);
            outline: none;
            transition: border-color var(--transition-fast);
        }
        .explore-search:focus { border-color: var(--lobster-400); }
        .explore-search::placeholder { color: var(--text-dim); }
        .explore-filters {
            display: flex;
            gap: 4px;
        }
        .explore-filter-tab {
            background: transparent;
            border: 1px solid var(--border-subtle);
            border-radius: 20px;
            padding: 5px 14px;
            font-family: var(--font-body);
            font-size: 0.75rem;
            font-weight: 600;
            color: var(--text-dim);
            cursor: pointer;
            transition: all 0.15s;
        }
        .explore-filter-tab:hover {
            color: var(--text-secondary);
            border-color: var(--border-default);
        }
        .explore-filter-tab.active {
            color: var(--text-on-accent);
            background: var(--accent-gradient);
            border-color: transparent;
        }

        /* ── Grid ── */
        .explore-grid {
            display: grid;
            grid-template-columns: repeat(auto-fill, minmax(300px, 1fr));
            gap: var(--space-lg);
        }

        /* ── Card ── */
        .project-card {
            background: var(--bg-card);
            border: 1px solid var(--border-subtle);
            border-radius: var(--radius-xl);
            padding: var(--space-lg);
            transition: border-color var(--transition-base), transform var(--transition-base);
            text-decoration: none;
            display: flex;
            flex-direction: column;
            gap: var(--space-sm);
        }
        .project-card:hover {
            border-color: var(--border-default);
            transform: translateY(-2px);
        }
        .project-card-header {
            display: flex;
            align-items: center;
            gap: var(--space-sm);
        }
        .project-card-logo {
            width: 88px; height: 88px;
            border-radius: var(--radius-md);
            object-fit: cover;
            flex-shrink: 0;
        }
        .project-card-logo-placeholder {
            width: 88px; height: 88px;
            border-radius: var(--radius-md);
            display: flex;
            align-items: center;
            justify-content: center;
            font-family: var(--font-display);
            font-weight: 900;
            font-size: 1.1rem;
            color: #fff;
            flex-shrink: 0;
        }
        .project-card-name {
            font-family: var(--font-display);
            font-size: 1rem;
            font-weight: 800;
            color: var(--text-primary);
            line-height: 1.2;
        }
        .project-card-slug {
            font-family: var(--font-mono);
            font-size: 0.7rem;
            color: var(--text-dim);
        }
        .project-card-desc {
            font-family: var(--font-body);
            font-size: 0.82rem;
            color: var(--text-secondary);
            line-height: 1.5;
            display: -webkit-box;
            -webkit-line-clamp: 3;
            -webkit-box-orient: vertical;
            overflow: hidden;
            flex: 1;
        }
        .project-card-badges {
            display: flex;
            flex-wrap: wrap;
            gap: 4px;
            margin-top: auto;
        }
        .project-card-badge {
            font-family: var(--font-mono);
            font-size: 0.62rem;
            font-weight: 600;
            letter-spacing: 0.04em;
            text-transform: uppercase;
            padding: 3px 8px;
            border-radius: var(--radius-full);
            color: var(--text-dim);
            background: var(--bg-elevated);
            border: 1px solid var(--border-subtle);
        }
        .project-card-badge--app { color: var(--seafoam-300); background: var(--green-dim); border-color: hsla(172,30%,56%,0.2); }
        .project-card-badge--token { color: var(--lobster-300); background: var(--accent-glow); border-color: hsla(10,50%,56%,0.2); }
        .project-card-badge--stake { color: var(--sand-300); background: var(--yellow-dim); border-color: hsla(32,32%,66%,0.2); }
        .project-card-badge--x { color: var(--text-secondary); }

        /* ── Empty State ── */
        .explore-empty {
            text-align: center;
            padding: var(--space-4xl) var(--space-lg);
            color: var(--text-dim);
            font-family: var(--font-body);
            font-size: 0.9rem;
            grid-column: 1 / -1;
        }

        /* ── Loading ── */
        .explore-loading {
            display: flex;
            justify-content: center;
            padding: var(--space-4xl) 0;
            grid-column: 1 / -1;
        }

        /* ── Responsive ── */
        @media (max-width: 600px) {
            .explore-grid { grid-template-columns: 1fr; }
            .explore-toolbar { flex-direction: column; }
            .explore-search { width: 100%; }
        }

    </style>
</head>
