<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Build Dashboard — Inclawbator</title>
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Nunito:wght@400;600;700;800;900&family=JetBrains+Mono:wght@300;400;600&display=swap" rel="stylesheet">
    <style>
        * { margin: 0; padding: 0; box-sizing: border-box; }
        body {
            font-family: 'Nunito', sans-serif;
            background: #0a0a0f; color: #e0e0e0;
            padding: 20px; overflow-y: auto;
        }
        .dash-section { margin-bottom: 28px; }
        .dash-header {
            display: flex; align-items: center; justify-content: space-between;
            margin-bottom: 12px;
        }
        .dash-title {
            font-size: 0.82rem; font-weight: 800; color: #fff;
            display: flex; align-items: center; gap: 8px;
        }
        .dash-count {
            font-family: 'JetBrains Mono', monospace; font-size: 0.65rem;
            font-weight: 600; color: #e87955; background: rgba(232,121,85,0.1);
            padding: 2px 8px; border-radius: 999px;
        }
        .dash-new-btn {
            font-family: 'Nunito', sans-serif; font-size: 0.72rem; font-weight: 700;
            padding: 5px 14px; border-radius: 999px; cursor: pointer;
            border: 1px solid rgba(232,121,85,0.3); background: rgba(232,121,85,0.08);
            color: #e87955; transition: all 0.15s; text-decoration: none;
        }
        .dash-new-btn:hover { background: rgba(232,121,85,0.2); border-color: #e87955; }

        .dash-grid {
            display: grid; grid-template-columns: repeat(auto-fill, minmax(160px, 1fr));
            gap: 10px;
        }
        .dash-card {
            background: rgba(255,255,255,0.03); border: 1px solid rgba(255,255,255,0.06);
            border-radius: 10px; padding: 14px; cursor: pointer;
            transition: all 0.15s; text-decoration: none; color: inherit; display: block;
        }
        .dash-card:hover { border-color: rgba(232,121,85,0.3); background: rgba(255,255,255,0.05); transform: translateY(-1px); }
        .dash-card-icon { font-size: 1.5rem; margin-bottom: 6px; }
        .dash-card-name {
            font-size: 0.78rem; font-weight: 800; color: #fff;
            margin-bottom: 3px; white-space: nowrap; overflow: hidden; text-overflow: ellipsis;
        }
        .dash-card-desc {
            font-size: 0.65rem; color: rgba(255,255,255,0.4); line-height: 1.3;
            display: -webkit-box; -webkit-line-clamp: 2; -webkit-box-orient: vertical; overflow: hidden;
        }
        .dash-card-actions {
            display: flex; gap: 6px; margin-top: 8px;
        }
        .dash-card-btn {
            font-family: 'JetBrains Mono', monospace; font-size: 0.58rem; font-weight: 600;
            padding: 3px 8px; border-radius: 999px; border: 1px solid rgba(255,255,255,0.1);
            background: none; color: rgba(255,255,255,0.5); cursor: pointer; transition: all 0.15s;
            text-decoration: none;
        }
        .dash-card-btn:hover { border-color: #e87955; color: #e87955; }
        .dash-card-btn--edit { border-color: rgba(232,121,85,0.25); color: #e87955; }

        .dash-list-item {
            display: flex; align-items: center; gap: 12px;
            padding: 10px 14px; background: rgba(255,255,255,0.03);
            border: 1px solid rgba(255,255,255,0.06); border-radius: 10px;
            margin-bottom: 6px; transition: all 0.15s;
        }
        .dash-list-item:hover { border-color: rgba(232,121,85,0.3); }
        .dash-list-icon { font-size: 1.3rem; flex-shrink: 0; }
        .dash-list-info { flex: 1; min-width: 0; }
        .dash-list-name { font-size: 0.78rem; font-weight: 800; color: #fff; }
        .dash-list-meta { font-family: 'JetBrains Mono', monospace; font-size: 0.62rem; color: rgba(255,255,255,0.4); }
        .dash-list-actions { display: flex; gap: 4px; flex-shrink: 0; }

        .dash-empty {
            text-align: center; padding: 30px 20px;
            color: rgba(255,255,255,0.3); font-size: 0.82rem;
        }
        .dash-loading { text-align: center; padding: 40px; color: rgba(255,255,255,0.3); font-size: 0.78rem; }

        .dash-tag {
            font-family: 'JetBrains Mono', monospace; font-size: 0.55rem; font-weight: 600;
            padding: 1px 6px; border-radius: 999px; white-space: nowrap;
        }
        .dash-tag--live { background: rgba(74,222,128,0.1); color: #4ade80; }
        .dash-tag--staking { background: rgba(99,102,241,0.1); color: #818cf8; }
    </style>
</head>
<body>

<div id="dashContent">
    <div class="dash-loading">Loading your dashboard...</div>
</div>

<script>
(function() {
    var wallet = null;

    // Try to get wallet from parent window
    try {
        if (window.parent && window.parent.document) {
            var walletEl = window.parent.document.querySelector('[data-wallet]');
            if (walletEl) wallet = walletEl.getAttribute('data-wallet');
            // Also try the nav wallet display
            if (!wallet) {
                var navWallet = window.parent.document.querySelector('.nav-wallet-addr, .wallet-addr');
                if (navWallet) wallet = navWallet.textContent.trim();
            }
        }
    } catch(_) {}

    // Also check URL params
    var params = new URLSearchParams(window.location.search);
    if (params.get('wallet')) wallet = params.get('wallet');

    var container = document.getElementById('dashContent');

    if (!wallet || wallet.length < 10) {
        container.innerHTML =
            '<div style="margin-bottom:16px;">' +
                '<div style="font-size:0.88rem;font-weight:800;color:#fff;margin-bottom:4px;">What do you want to build?</div>' +
                '<div style="font-size:0.75rem;color:rgba(255,255,255,0.4);">Pick a template or describe anything in the chat.</div>' +
            '</div>' +
            '<div class="dash-grid">' +
                '<div class="dash-card" onclick="sendToChat(\'Build me a landing page for my project\')">' +
                    '<div class="dash-card-icon">&#127760;</div>' +
                    '<div class="dash-card-name">Landing Page</div>' +
                    '<div class="dash-card-desc">Professional site with hero, features, and CTA</div>' +
                '</div>' +
                '<div class="dash-card" onclick="sendToChat(\'Build me a portfolio tracker that shows my token balances\')">' +
                    '<div class="dash-card-icon">&#128200;</div>' +
                    '<div class="dash-card-name">Portfolio Tracker</div>' +
                    '<div class="dash-card-desc">Track token balances, prices, and P&L</div>' +
                '</div>' +
                '<div class="dash-card" onclick="sendToChat(\'Build me a staking dashboard for my community\')">' +
                    '<div class="dash-card-icon">&#129438;</div>' +
                    '<div class="dash-card-name">Staking Dashboard</div>' +
                    '<div class="dash-card-desc">Stake tokens, view rewards, claim earnings</div>' +
                '</div>' +
                '<div class="dash-card" onclick="sendToChat(\'Build me a simple web app\')">' +
                    '<div class="dash-card-icon">&#9889;</div>' +
                    '<div class="dash-card-name">Custom App</div>' +
                    '<div class="dash-card-desc">Describe anything — AI builds it live</div>' +
                '</div>' +
            '</div>';
        return;
    }

    // Send prompt to parent Inclawbator chat
    window.sendToChat = function(prompt) {
        try {
            if (window.parent && window.parent.sendChatMessage) {
                window.parent.sendChatMessage(prompt);
            } else if (window.parent) {
                // Fallback: find the chat input and submit
                var input = window.parent.document.querySelector('.inclaw-input input, .inclaw-input textarea');
                if (input) {
                    input.value = prompt;
                    input.dispatchEvent(new Event('input', { bubbles: true }));
                    var form = input.closest('form');
                    var btn = window.parent.document.querySelector('.inclaw-send-btn, .inclaw-input button[type="submit"]');
                    if (btn) btn.click();
                    else if (form) form.dispatchEvent(new Event('submit', { bubbles: true }));
                }
            }
        } catch(e) { console.error('sendToChat:', e); }
    };

    // Fetch all user data in parallel
    Promise.all([
        fetch('/api/inclawbate/apps?creator_wallet=' + encodeURIComponent(wallet) + '&limit=50').then(r => r.json()).catch(() => ({ apps: [] })),
        fetch('/api/inclawbate/inclawbator?wallet=' + encodeURIComponent(wallet)).then(r => r.json()).catch(() => []),
    ]).then(function(results) {
        var appsData = results[0];
        var projectsData = results[1];

        var apps = (appsData.apps || []).filter(a => a.is_listed !== false);
        var projects = Array.isArray(projectsData) ? projectsData : (projectsData.projects || []);

        var html = '';

        // ── MY APPS ──
        html += '<div class="dash-section">';
        html += '<div class="dash-header">';
        html += '<div class="dash-title">&#128296; My Apps <span class="dash-count">' + apps.length + '</span></div>';
        html += '<button class="dash-new-btn" onclick="sendToChat(\'I want to build an app\')">+ New App</button>';
        html += '</div>';

        if (apps.length) {
            html += '<div class="dash-grid">';
            apps.forEach(function(app) {
                var url = 'https://inclawbate.app/s/' + app.slug;
                html += '<div class="dash-card" onclick="openInBuildStudio(\'' + app.slug + '\')">';
                html += '<div class="dash-card-icon">&#128187;</div>';
                html += '<div class="dash-card-name">' + escHtml(app.name || app.slug) + '</div>';
                html += '<div class="dash-card-desc">' + escHtml((app.description || '').slice(0, 80)) + '</div>';
                html += '<div class="dash-card-actions">';
                html += '<span class="dash-card-btn dash-card-btn--edit">Edit in Studio</span>';
                html += '<a class="dash-card-btn" href="' + url + '" target="_blank" onclick="event.stopPropagation()">View</a>';
                html += '</div>';
                html += '</div>';
            });
            html += '</div>';
        } else {
            html += '<div class="dash-empty">No apps yet. Build your first one!</div>';
        }
        html += '</div>';

        // ── MY TOKENS / PROJECTS ──
        html += '<div class="dash-section">';
        html += '<div class="dash-header">';
        html += '<div class="dash-title">&#128640; My Tokens <span class="dash-count">' + projects.length + '</span></div>';
        html += '<button class="dash-new-btn" onclick="sendToChat(\'I want to launch a token\')">+ New Token</button>';
        html += '</div>';

        if (projects.length) {
            projects.forEach(function(p) {
                html += '<div class="dash-list-item">';
                html += '<div class="dash-list-icon">&#129689;</div>';
                html += '<div class="dash-list-info">';
                html += '<div class="dash-list-name">' + escHtml(p.token_name || p.project_name || 'Token') + '</div>';
                html += '<div class="dash-list-meta">';
                if (p.token_address) html += p.token_address.slice(0, 6) + '...' + p.token_address.slice(-4);
                if (p.staking_address) html += ' <span class="dash-tag dash-tag--staking">Staking</span>';
                if (p.agent_enabled) html += ' <span class="dash-tag dash-tag--live">Agent</span>';
                html += '</div>';
                html += '</div>';
                html += '<div class="dash-list-actions">';
                html += '<button class="dash-card-btn" onclick="sendToChat(\'Check analytics for ' + (p.token_address || '') + '\')">Analytics</button>';
                if (!p.staking_address) html += '<button class="dash-card-btn dash-card-btn--edit" onclick="sendToChat(\'Deploy staking for ' + (p.token_address || '') + '\')">+ Staking</button>';
                html += '</div>';
                html += '</div>';
            });
        } else {
            html += '<div class="dash-empty">No tokens yet. Launch your first one!</div>';
        }
        html += '</div>';

        // ── QUICK ACTIONS ──
        html += '<div class="dash-section">';
        html += '<div class="dash-header"><div class="dash-title">&#9889; Quick Actions</div></div>';
        html += '<div class="dash-grid">';
        html += '<div class="dash-card" onclick="sendToChat(\'Create an AI marketing agent for X\')"><div class="dash-card-icon">&#128227;</div><div class="dash-card-name">Marketing Agent</div><div class="dash-card-desc">Auto-post to X</div></div>';
        html += '<div class="dash-card" onclick="sendToChat(\'Airdrop tokens to my community\')"><div class="dash-card-icon">&#127919;</div><div class="dash-card-name">Airdrop</div><div class="dash-card-desc">Send to many wallets</div></div>';
        html += '<div class="dash-card" onclick="sendToChat(\'Run a health check on my project\')"><div class="dash-card-icon">&#128202;</div><div class="dash-card-name">Health Check</div><div class="dash-card-desc">Project diagnostics</div></div>';
        html += '<div class="dash-card" onclick="sendToChat(\'I want to hire someone from the Council\')"><div class="dash-card-icon">&#129309;</div><div class="dash-card-name">Hire Council</div><div class="dash-card-desc">Get human help</div></div>';
        html += '</div>';
        html += '</div>';

        container.innerHTML = html;
    });

    function escHtml(s) {
        return String(s || '').replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/>/g,'&gt;').replace(/"/g,'&quot;');
    }

    // Open app in Build Studio (replaces this dashboard in the parent panel)
    window.openInBuildStudio = function(slug) {
        try {
            // Tell parent to load Build Studio with this app
            if (window.parent) {
                window.parent.postMessage({ type: 'open-build-studio', slug: slug }, '*');
            }
        } catch(_) {
            // Fallback: navigate directly
            window.location.href = '/build?app=' + encodeURIComponent(slug);
        }
    };

    // Send a message to the parent Inclawbator chat
    window.sendToChat = function(msg) {
        try {
            if (window.parent && window.parent.sendMessage) {
                window.parent.sendMessage(msg);
            } else if (window.parent) {
                // Post message to parent for cross-origin compat
                window.parent.postMessage({ type: 'inclawbator-chat', message: msg }, '*');
            }
        } catch(_) {
            // Fallback: navigate to inclawbator with prompt
            window.top.location.href = '/inclawbator?prompt=' + encodeURIComponent(msg);
        }
    };
})();
</script>
</body>
</html>
