<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>PFP Generator — Inclawbate</title>
    <meta name="description" content="Create a torn-paper collage profile card in the Inclawbate style. Upload your photo, pick a vibe, add stickers, download for X and socials.">
    <meta property="og:title" content="PFP Generator — Inclawbate">
    <meta property="og:description" content="Create a torn-paper collage profile card. Upload, customize, download.">
    <meta property="og:type" content="website">
    <meta property="og:url" content="https://inclawbate.com/pfp">
    <meta property="og:image" content="https://inclawbate.com/inclawbate/assets/logo-square.jpg">
    <meta name="twitter:card" content="summary">
    <link rel="icon" href="/inclawbate/assets/logo-circle.jpg">

    <!-- Fonts -->
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Nunito:wght@400;600;700;800;900&family=JetBrains+Mono:wght@400;600&family=Special+Elite&family=Permanent+Marker&display=swap" rel="stylesheet">

    <!-- Design system -->
    <style>body{opacity:0}</style>
    <link rel="stylesheet" href="/styles/core.css">
    <link rel="stylesheet" href="/styles/components.css">
    <link rel="stylesheet" href="/styles/pfp-generator.css">

    <!-- html2canvas -->
    <script defer src="https://cdnjs.cloudflare.com/ajax/libs/html2canvas/1.4.1/html2canvas.min.js"></script>

    <!-- App logic -->
    <script defer src="/js/pfp-generator-app.js"></script>
</head>
<body>

    <!-- Nav -->
    <nav class="nav">
        <a href="/" class="nav-logo">inclawbate</a>
        <div class="nav-links">
            <a href="/" class="nav-link">Home</a>
            <a href="/pfp" class="nav-link active">PFP</a>
        </div>
    </nav>

    <!-- Workspace -->
    <div class="pfp-workspace">

        <!-- Controls -->
        <div class="pfp-controls">

            <!-- Upload -->
            <div>
                <div class="pfp-section-label">Upload Your Photo</div>
                <div class="pfp-upload-zone">
                    <div class="upload-prompt">
                        <div class="upload-icon">📸</div>
                        <div class="upload-text"><strong>Click or drag</strong> to upload a photo</div>
                    </div>
                    <img class="upload-thumb" alt="Your photo">
                </div>
                <input type="file" id="pfp-file-input" accept="image/*" hidden>
            </div>

            <!-- Vibes -->
            <div>
                <div class="pfp-section-label">Pick Your Vibe</div>
                <div class="pfp-vibes-grid"></div>
            </div>

            <!-- Customize -->
            <div>
                <div class="pfp-section-label">Background</div>
                <div class="pfp-colors"></div>
            </div>

            <div>
                <div class="pfp-section-label">Add Stickers</div>
                <div class="pfp-sticker-tray"></div>
            </div>

            <div>
                <div class="pfp-section-label">Display Name</div>
                <input type="text" class="pfp-name-input" placeholder="Your name or handle" maxlength="30">
            </div>

            <!-- Download -->
            <div class="pfp-download-row">
                <button id="btn-download-square" class="btn btn-primary">Download PFP (1080&times;1080)</button>
                <button id="btn-download-circle" class="btn btn-secondary">Download Circle Crop</button>
            </div>
        </div>

        <!-- Preview -->
        <div class="pfp-preview-wrap">
            <div class="pfp-canvas">
                <!-- Empty state -->
                <div class="pfp-empty-state">
                    <div class="empty-icon">🦞</div>
                    <div class="empty-text">Upload a photo to start building your Inclawbate PFP</div>
                </div>

                <!-- Ransom text -->
                <div class="pfp-ransom-text"></div>

                <!-- Photo -->
                <div class="pfp-photo-frame">
                    <img alt="Your PFP">
                </div>

                <!-- Name + watermark -->
                <div class="pfp-display-name"></div>
                <div class="pfp-watermark">inclawbate.com</div>

                <!-- Stickers are appended here by JS -->
            </div>
        </div>
    </div>

    <script>document.body.style.opacity = 1;</script>
</body>
</html>
