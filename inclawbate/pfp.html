<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>PFP Generator — Inclawbate</title>
    <meta name="description" content="Create a torn-paper collage profile card in the Inclawbate style. Upload your photo, pick a background, add stickers, download for X and socials.">
    <meta property="og:title" content="PFP Generator — Inclawbate">
    <meta property="og:description" content="Create a torn-paper collage PFP. Upload, customize, download.">
    <meta property="og:type" content="website">
    <meta property="og:url" content="https://inclawbate.app/pfp">
    <meta property="og:image" content="https://inclawbate.app/inclawbate/assets/logo-square.jpg">
    <meta name="twitter:card" content="summary">
    <meta name="twitter:site" content="@inclawbate">
    <link rel="icon" href="/inclawbate/assets/logo-circle.jpg">

    <!-- Fonts -->
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Nunito:wght@400;600;700;800;900&family=JetBrains+Mono:wght@400;600&family=Special+Elite&family=Permanent+Marker&display=swap" rel="stylesheet">

    <!-- Design system -->
    <style>body{opacity:0}</style>
    <link rel="stylesheet" href="/styles/core.css">
    <link rel="stylesheet" href="/styles/components.css">
    <link rel="stylesheet" href="/styles/pfp-generator.css">

    <!-- html2canvas -->
    <script defer src="https://cdnjs.cloudflare.com/ajax/libs/html2canvas/1.4.1/html2canvas.min.js"></script>

    <!-- App logic -->
    <script defer src="/js/pfp-generator-app.js"></script>
</head>
<body>

    <!-- Nav -->
    <nav class="nav">
        <a href="/" class="nav-logo">inclawbate</a>
        <div class="nav-links">
        <a href="/inclawbator" class="nav-link nav-link-featured">Inclawbator</a>
        <a href="/claws" class="nav-link">$CLAWS</a>
        <div class="nav-group">
            <a href="#" class="nav-link" onclick="return false">Explore</a>
            <div class="nav-group-menu">
                <a href="/build">Build</a>
                <a href="/inclawbations">Inclawbations</a>
                <a href="/apps">Apps</a>
                <a href="/tokens">Tokens</a>
                <a href="/nfts">NFTs</a>
                <a href="/stake">Staking</a>
                <a href="/schedule">X Schedule</a>
                <a href="/agents">Agents</a>
                <a href="/tools">Tools</a>
                <a href="/inclawbators">Inclawbators</a>

            </div>
        </div>
        <a href="/dashboard" class="nav-link">Dashboard</a>
        <a href="/blog" class="nav-link">Blog</a>
    </div>
    </nav>

    <!-- Workspace: Preview LEFT, Controls RIGHT -->
    <div class="pfp-workspace">

        <!-- Preview (left) -->
        <div class="pfp-preview-wrap">
            <div class="pfp-canvas">
                <!-- Empty state -->
                <div class="pfp-empty-state">
                    <div class="empty-icon">&#129438;</div>
                    <div class="empty-text">Upload a photo to create your Inclawbate collage PFP</div>
                </div>

                <!-- Ransom text -->
                <div class="pfp-ransom-text"></div>

                <!-- Photo (displayed directly, no processing) -->
                <div class="pfp-photo-frame">
                    <img alt="Your PFP">
                </div>

                <!-- Name + watermark -->
                <div class="pfp-display-name"></div>
                <div class="pfp-watermark">inclawbate.app</div>

                <!-- Stickers appended here by JS -->
            </div>

            <!-- Download buttons below preview -->
            <div class="pfp-download-row">
                <button id="btn-download-square" class="btn btn-primary">Download (1080&times;1080)</button>
                <button id="btn-download-circle" class="btn btn-secondary">Circle Crop</button>
            </div>
        </div>

        <!-- Controls (right) -->
        <div class="pfp-controls">

            <!-- Step 1: Upload -->
            <div class="pfp-step">
                <div class="pfp-step-header">
                    <div class="pfp-step-badge">1</div>
                    <div class="pfp-step-label">Upload Your Photo</div>
                </div>
                <div class="pfp-upload-zone">
                    <div class="upload-prompt">
                        <div class="upload-icon">&#128247;</div>
                        <div class="upload-text"><strong>Click or drag</strong> to upload</div>
                    </div>
                    <img class="upload-thumb" alt="Your photo">
                </div>
                <input type="file" id="pfp-file-input" accept="image/*" hidden>
            </div>

            <!-- Step 2: Background -->
            <div class="pfp-step">
                <div class="pfp-step-header">
                    <div class="pfp-step-badge">2</div>
                    <div class="pfp-step-label">Background</div>
                </div>
                <div class="pfp-bg-grid"></div>
            </div>

            <!-- Step 3: Customize -->
            <div class="pfp-step">
                <div class="pfp-step-header">
                    <div class="pfp-step-badge">3</div>
                    <div class="pfp-step-label">Customize</div>
                    <div class="pfp-step-hint">optional</div>
                </div>
                <input type="text" class="pfp-name-input" placeholder="Display name or handle" maxlength="30">
                <div class="pfp-sticker-tray"></div>
            </div>

        </div>
    </div>

    <script>document.body.style.opacity = 1;</script>
</body>
</html>
