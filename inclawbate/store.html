<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Store — Inclawbate</title>
    <meta name="description" content="The Inclawbate Store. Lobster gear, custom goods, and everything in between — every dollar ends up as $INCLAWNCH.">
    <meta property="og:title" content="Store — Inclawbate">
    <meta property="og:description" content="Lobster gear, custom goods, and everything in between. Pay with card or $INCLAWNCH.">
    <meta property="og:type" content="website">
    <meta property="og:url" content="https://inclawbate.com/store">
    <meta property="og:image" content="https://www.inclawbate.com/api/inclawbate/og?tagline=The+Inclawbate+Store">
    <meta name="twitter:card" content="summary_large_image">
    <link rel="icon" href="data:image/svg+xml,<svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 100 100'><text y='.9em' font-size='90'>&#129438;</text></svg>">
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Nunito:wght@400;500;600;700;800;900&family=JetBrains+Mono:wght@300;400;600;700&display=swap" rel="stylesheet">
    <style>body{opacity:0}</style>
    <link rel="stylesheet" href="/styles/core.css">
    <link rel="stylesheet" href="/styles/components.css">
    <style>
        /* ══════════════════════════════════════
           STORE — 2-TAB LAYOUT
           ══════════════════════════════════════ */
        .store {
            max-width: 780px;
            margin: 0 auto;
            padding: calc(var(--nav-height) + var(--space-xl)) var(--space-lg) var(--space-2xl);
            background:
                radial-gradient(ellipse 80% 50% at 50% 0%, hsla(9, 50%, 45%, 0.06) 0%, transparent 60%),
                radial-gradient(ellipse 60% 40% at 80% 80%, hsla(172, 30%, 40%, 0.04) 0%, transparent 50%);
        }

        /* ── Hero ── */
        .store-hero {
            text-align: center;
            margin-bottom: var(--space-xl);
            animation: storeFadeIn 0.5s var(--ease-smooth) both;
        }
        .store-hero h1 {
            font-family: var(--font-display);
            font-size: 2.8rem;
            font-weight: 900;
            background: var(--title-gradient);
            -webkit-background-clip: text;
            -webkit-text-fill-color: transparent;
            background-clip: text;
            line-height: 1.15;
            margin-bottom: var(--space-md);
        }
        .store-hero-sub {
            font-size: 1.05rem;
            color: var(--text-secondary);
            line-height: 1.6;
            max-width: 520px;
            margin: 0 auto var(--space-sm);
        }
        .store-hero-note {
            font-family: var(--font-mono);
            font-size: 0.7rem;
            color: var(--text-dim);
            letter-spacing: 0.03em;
        }

        /* ── Pricing Banner ── */
        .pricing-banner {
            background: var(--bg-elevated);
            border: 1px solid var(--border-subtle);
            border-radius: var(--radius-2xl);
            padding: var(--space-lg) var(--space-xl);
            margin-bottom: var(--space-xl);
            position: relative;
            overflow: hidden;
            animation: storeFadeIn 0.5s 0.06s var(--ease-smooth) both;
        }
        .pricing-banner::before {
            content: '';
            position: absolute;
            top: 0; left: 0; right: 0;
            height: 3px;
            background: linear-gradient(90deg, var(--lobster-400), hsl(43, 65%, 55%), var(--seafoam-400));
        }
        .pricing-banner-title {
            font-family: var(--font-display);
            font-size: 1rem;
            font-weight: 800;
            color: var(--text-primary);
            margin-bottom: var(--space-md);
            text-align: center;
        }
        .pricing-rows {
            display: grid;
            grid-template-columns: 1fr 1fr;
            gap: var(--space-md);
            margin-bottom: var(--space-md);
        }
        .pricing-row {
            display: flex;
            align-items: center;
            gap: var(--space-sm);
            padding: var(--space-sm) var(--space-md);
            background: var(--bg-card);
            border-radius: var(--radius-lg);
            border: 1px solid var(--border-subtle);
        }
        .pricing-row-icon {
            font-size: 1.1rem;
            flex-shrink: 0;
        }
        .pricing-row-text {
            font-size: 0.82rem;
            color: var(--text-secondary);
            line-height: 1.5;
        }
        .pricing-row-text strong {
            color: var(--text-primary);
            font-weight: 700;
        }
        .pricing-banner-tagline {
            text-align: center;
            font-family: var(--font-display);
            font-size: 0.88rem;
            font-weight: 700;
            color: var(--lobster-300);
        }

        /* ── Tabs ── */
        .store-tabs {
            position: sticky;
            top: var(--nav-height);
            z-index: 90;
            background: var(--bg-primary);
            border-bottom: 1px solid var(--border-subtle);
            margin: 0 calc(-1 * var(--space-lg));
            padding: 0 var(--space-lg);
            animation: storeFadeIn 0.5s 0.1s var(--ease-smooth) both;
        }
        .store-tabs-inner {
            display: flex;
            gap: var(--space-xl);
            justify-content: center;
        }
        .store-tab {
            display: inline-flex;
            align-items: center;
            padding: var(--space-md) 0;
            font-family: var(--font-mono);
            font-size: 0.72rem;
            font-weight: 700;
            text-transform: uppercase;
            letter-spacing: 0.1em;
            color: var(--text-dim);
            background: none;
            border: none;
            border-bottom: 2px solid transparent;
            cursor: pointer;
            white-space: nowrap;
            transition: color 0.25s, border-color 0.25s;
        }
        .store-tab:hover {
            color: var(--text-secondary);
        }
        .store-tab.active {
            color: var(--lobster-400);
            border-bottom-color: var(--lobster-400);
        }

        /* ── Section Transitions ── */
        .store-section {
            display: none;
            opacity: 0;
            transform: translateY(12px);
            transition: opacity 0.35s var(--ease-smooth), transform 0.35s var(--ease-smooth);
            padding-top: var(--space-xl);
        }
        .store-section.active {
            display: block;
            opacity: 1;
            transform: translateY(0);
        }

        /* ── Section intro ── */
        .store-intro {
            font-size: 0.88rem;
            color: var(--text-secondary);
            line-height: 1.6;
            margin-bottom: var(--space-xl);
            text-align: center;
            max-width: 560px;
            margin-left: auto;
            margin-right: auto;
        }

        /* ── Product Grid (Amazon) ── */
        .merch-grid {
            display: grid;
            grid-template-columns: repeat(3, 1fr);
            gap: var(--space-lg);
            margin-bottom: var(--space-xl);
        }
        .merch-card {
            display: block;
            text-decoration: none;
            background: var(--bg-elevated);
            border: 1px solid var(--border-subtle);
            border-radius: var(--radius-xl);
            padding: var(--space-xl);
            text-align: center;
            transition: border-color var(--transition-base), transform var(--transition-base), box-shadow var(--transition-base);
        }
        .merch-card:hover {
            border-color: var(--border-default);
            transform: translateY(-2px);
            box-shadow: var(--shadow-md);
        }
        .merch-card-icon {
            font-size: 2.2rem;
            margin-bottom: var(--space-sm);
            line-height: 1;
        }
        .merch-card-name {
            font-family: var(--font-display);
            font-size: 0.92rem;
            font-weight: 700;
            color: var(--text-primary);
            margin-bottom: var(--space-sm);
        }
        .merch-card-link {
            display: inline-block;
            font-family: var(--font-mono);
            font-size: 0.68rem;
            font-weight: 700;
            text-transform: uppercase;
            letter-spacing: 0.08em;
            color: var(--seafoam-300);
            text-decoration: none;
            transition: color 0.2s;
        }
        .merch-card-link:hover {
            color: var(--seafoam-200, hsl(172, 50%, 70%));
        }
        .merch-affiliate-note {
            text-align: center;
            font-family: var(--font-mono);
            font-size: 0.68rem;
            color: var(--text-dim);
            letter-spacing: 0.02em;
        }

        /* ── Merch card animations ── */
        .merch-grid .merch-card {
            animation: storeFadeIn 0.5s var(--ease-smooth) both;
        }
        .merch-grid .merch-card:nth-child(1) { animation-delay: 0.05s; }
        .merch-grid .merch-card:nth-child(2) { animation-delay: 0.1s; }
        .merch-grid .merch-card:nth-child(3) { animation-delay: 0.15s; }
        .merch-grid .merch-card:nth-child(4) { animation-delay: 0.2s; }
        .merch-grid .merch-card:nth-child(5) { animation-delay: 0.25s; }
        .merch-grid .merch-card:nth-child(6) { animation-delay: 0.3s; }

        /* ══════════════════════════════════════
           ORIGINALS TAB
           ══════════════════════════════════════ */

        /* ── The Claw Flagship ── */
        .claw-card {
            background: var(--bg-elevated);
            border: 1px solid var(--border-subtle);
            border-radius: var(--radius-2xl);
            padding: var(--space-2xl);
            margin-bottom: var(--space-3xl);
            position: relative;
            overflow: hidden;
            text-align: center;
            animation: storeFadeIn 0.5s 0.04s var(--ease-smooth) both;
        }
        .claw-card::before {
            content: '';
            position: absolute;
            top: 0; left: 0; right: 0;
            height: 4px;
            background: linear-gradient(90deg, hsl(43, 80%, 55%), hsl(38, 70%, 60%), hsl(43, 80%, 55%));
        }
        .claw-card .product-badge--flagship {
            display: inline-block;
            font-family: var(--font-mono);
            font-size: 0.6rem;
            font-weight: 700;
            text-transform: uppercase;
            letter-spacing: 0.12em;
            color: hsl(43, 80%, 60%);
            background: hsla(43, 80%, 55%, 0.12);
            border: 1px solid hsla(43, 80%, 55%, 0.3);
            padding: 4px 14px;
            border-radius: var(--radius-full);
            margin-bottom: var(--space-md);
        }
        .claw-card-icon {
            font-size: 3.2rem;
            margin-bottom: var(--space-sm);
            line-height: 1;
        }
        .claw-card-title {
            font-family: var(--font-display);
            font-size: 1.6rem;
            font-weight: 900;
            color: var(--text-primary);
            margin-bottom: var(--space-xs);
        }
        .claw-card-type {
            font-family: var(--font-mono);
            font-size: 0.68rem;
            font-weight: 600;
            text-transform: uppercase;
            letter-spacing: 0.08em;
            color: hsl(43, 70%, 55%);
            margin-bottom: var(--space-md);
        }
        .claw-card-desc {
            font-size: 0.92rem;
            color: var(--text-secondary);
            line-height: 1.6;
            max-width: 420px;
            margin: 0 auto var(--space-lg);
        }
        .claw-card .dual-price {
            margin: 0 auto var(--space-lg);
            max-width: 360px;
        }
        .claw-card .product-btn {
            display: inline-flex;
            align-items: center;
            justify-content: center;
            gap: 6px;
            padding: 12px 32px;
            border-radius: var(--radius-full);
            font-family: var(--font-mono);
            font-size: 0.82rem;
            font-weight: 700;
            cursor: pointer;
            text-decoration: none;
            border: 1px solid hsla(43, 80%, 55%, 0.4);
            background: hsla(43, 80%, 55%, 0.08);
            color: hsl(43, 80%, 65%);
            transition: all 0.25s var(--ease-smooth);
        }
        .claw-card .product-btn:hover {
            background: hsla(43, 80%, 55%, 0.15);
            border-color: hsla(43, 80%, 55%, 0.6);
            transform: translateY(-1px);
        }

        /* ── Category Header ── */
        .category-header {
            font-family: var(--font-display);
            font-size: 1.15rem;
            font-weight: 800;
            color: var(--text-primary);
            margin-bottom: var(--space-lg);
            padding-bottom: var(--space-sm);
            border-bottom: 1px solid var(--border-subtle);
        }
        .category-header span {
            font-family: var(--font-mono);
            font-size: 0.65rem;
            font-weight: 600;
            text-transform: uppercase;
            letter-spacing: 0.08em;
            color: var(--text-dim);
            margin-left: 8px;
        }

        /* ── Product Card (Originals) ── */
        .product-grid {
            display: grid;
            gap: var(--space-lg);
            margin-bottom: var(--space-3xl);
        }
        .product-grid--2x2 {
            grid-template-columns: repeat(2, 1fr);
        }
        .product-grid--3col {
            grid-template-columns: repeat(3, 1fr);
        }
        .product-card {
            background: var(--bg-elevated);
            border: 1px solid var(--border-subtle);
            border-radius: var(--radius-xl);
            padding: var(--space-lg);
            text-align: center;
            transition: border-color var(--transition-base), transform var(--transition-base), box-shadow var(--transition-base);
            position: relative;
        }
        .product-card:hover {
            border-color: var(--border-default);
            transform: translateY(-2px);
            box-shadow: var(--shadow-md);
        }
        .product-badge {
            display: inline-block;
            font-family: var(--font-mono);
            font-size: 0.58rem;
            font-weight: 700;
            text-transform: uppercase;
            letter-spacing: 0.1em;
            color: var(--sand-300);
            background: hsla(32, 32%, 66%, 0.12);
            border: 1px solid hsla(32, 32%, 66%, 0.25);
            padding: 3px 10px;
            border-radius: var(--radius-full);
            margin-bottom: var(--space-sm);
        }
        .product-card-icon {
            font-size: 1.8rem;
            margin-bottom: var(--space-xs);
            line-height: 1;
        }
        .product-card-name {
            font-family: var(--font-display);
            font-size: 0.88rem;
            font-weight: 700;
            color: var(--text-primary);
            margin-bottom: var(--space-sm);
        }

        /* ── Dual Price Display ── */
        .dual-price {
            display: grid;
            grid-template-columns: 1fr 1fr;
            gap: 6px;
            background: var(--bg-card);
            border-radius: var(--radius-lg);
            border: 1px solid var(--border-subtle);
            padding: 8px;
        }
        .dual-price-item {
            text-align: center;
            padding: 4px 6px;
        }
        .dual-price-label {
            font-family: var(--font-mono);
            font-size: 0.56rem;
            font-weight: 700;
            text-transform: uppercase;
            letter-spacing: 0.08em;
            color: var(--text-dim);
            margin-bottom: 2px;
        }
        .dual-price-value {
            font-family: var(--font-mono);
            font-size: 0.72rem;
            font-weight: 700;
            color: var(--text-secondary);
        }
        .dual-price-item--inclawnch .dual-price-value {
            color: var(--lobster-300);
        }

        /* ── Footer ── */
        .store-footer {
            text-align: center;
            padding: var(--space-xl) 0;
            border-top: 1px solid var(--border-subtle);
        }
        .store-footer p {
            font-family: var(--font-mono);
            font-size: 0.72rem;
            color: var(--text-dim);
            letter-spacing: 0.03em;
        }

        /* ── Animations ── */
        @keyframes storeFadeIn {
            from { opacity: 0; transform: translateY(12px); }
            to { opacity: 1; transform: translateY(0); }
        }

        /* ── Responsive ── */
        @media (max-width: 640px) {
            .store-hero h1 { font-size: 2rem; }
            .pricing-rows { grid-template-columns: 1fr; }
            .merch-grid { grid-template-columns: repeat(2, 1fr); }
            .product-grid--2x2 { grid-template-columns: repeat(2, 1fr); }
            .product-grid--3col { grid-template-columns: repeat(2, 1fr); }
            .claw-card { padding: var(--space-xl); }
        }
        @media (max-width: 400px) {
            .store-hero h1 { font-size: 1.6rem; }
            .merch-grid { grid-template-columns: 1fr; }
            .product-grid--2x2 { grid-template-columns: 1fr; }
            .product-grid--3col { grid-template-columns: 1fr; }
        }
    </style>
</head>
<body>

<nav class="nav">
    <a href="/" class="nav-brand">
        <span class="nav-logo">inclawbate &#129438;</span>
    </a>
    <div class="nav-links">
        <a href="/ubi" class="nav-link">UBI</a>

</nav>

<main class="store">

    <section class="store-hero">
        <h1>The Inclawbate Store &#129438;</h1>
        <p class="store-hero-sub">Lobster gear, custom goods, and everything in between.</p>
    </section>

    <section style="text-align:center;padding:var(--space-3xl) var(--space-xl);animation:storeFadeIn 0.5s 0.1s var(--ease-smooth) both;">
        <div style="font-size:3.5rem;margin-bottom:var(--space-md);">&#129438;</div>
        <div style="font-family:var(--font-display);font-size:1.4rem;font-weight:800;color:var(--text-primary);margin-bottom:var(--space-sm);">Coming Soon</div>
        <p style="font-size:0.92rem;color:var(--text-secondary);max-width:420px;margin:0 auto var(--space-xl);line-height:1.6;">Card payments &amp; $INCLAWNCH accepted. Lobster gear, originals, and custom goods &mdash; all dropping soon.</p>
        <a href="https://t.me/inclawbate" target="_blank" rel="noopener" class="btn btn-secondary btn-sm" style="font-family:var(--font-mono);">Join Telegram for updates</a>
    </section>

    <footer class="store-footer">
        <p>inclawbate.com/store &#129438;</p>
    </footer>

</main>

</body>
</html>
