<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>App Store — Inclawbate</title>
    <meta name="description" content="Discover apps built on Inclawbate. Upvote your favorites, unlock premium tools with CLAWS.">
    <meta property="og:title" content="App Store — Inclawbate">
    <meta property="og:description" content="Discover apps built on Inclawbate. Upvote your favorites, unlock premium tools with CLAWS.">
    <meta property="og:type" content="website">
    <meta property="og:url" content="https://inclawbate.app/apps">
    <meta name="twitter:card" content="summary_large_image">
    <meta name="twitter:site" content="@inclawbate">
    <link rel="icon" href="data:image/svg+xml,<svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 100 100'><text y='.9em' font-size='90'>&#129438;</text></svg>">
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Nunito:wght@400;500;600;700;800;900&family=JetBrains+Mono:wght@300;400;600;700&display=swap" rel="stylesheet">
    <style>body{opacity:0}</style>
    <link rel="stylesheet" href="/styles/core.css">
    <link rel="stylesheet" href="/styles/components.css">
    <style>
        body { opacity: 1; background: var(--bg-deepest); }

        .apps-page {
            max-width: var(--max-width);
            margin: 0 auto;
            padding: var(--space-lg) var(--space-xl) var(--space-3xl);
        }

        /* ── Hero ── */
        .apps-hero {
            text-align: center;
            margin-bottom: var(--space-2xl);
            animation: fadeUp 0.5s ease both;
        }
        .apps-hero h1 {
            font-family: var(--font-display);
            font-size: 2.8rem;
            font-weight: 900;
            background: var(--title-gradient);
            -webkit-background-clip: text;
            -webkit-text-fill-color: transparent;
            background-clip: text;
            line-height: 1.15;
            margin-bottom: var(--space-sm);
        }
        .apps-hero p {
            font-size: 1.05rem;
            color: var(--text-secondary);
            max-width: 520px;
            margin: 0 auto var(--space-lg);
        }
        .apps-hero-stats {
            display: flex;
            align-items: center;
            justify-content: center;
            gap: var(--space-xl);
            margin-bottom: var(--space-lg);
        }
        .apps-stat {
            display: flex;
            align-items: baseline;
            gap: 6px;
        }
        .apps-stat-num {
            font-family: var(--font-mono);
            font-size: 1.4rem;
            font-weight: 800;
            color: var(--text-primary);
        }
        .apps-stat-label {
            font-size: 0.78rem;
            color: var(--text-dim);
            font-family: var(--font-mono);
            text-transform: uppercase;
            letter-spacing: 0.04em;
        }
        .apps-hero-cta {
            display: inline-flex;
            align-items: center;
            gap: var(--space-sm);
            padding: 12px var(--space-xl);
            background: var(--accent-gradient);
            color: #fff;
            border: none;
            border-radius: var(--radius-md);
            font-family: var(--font-body);
            font-size: 0.9rem;
            font-weight: 700;
            text-decoration: none;
            cursor: pointer;
            transition: all 0.2s ease;
            box-shadow: 0 2px 12px hsla(9, 60%, 54%, 0.2);
        }
        .apps-hero-cta:hover {
            transform: translateY(-2px);
            box-shadow: var(--shadow-glow-lg);
            color: #fff;
        }

        /* ── Concierge ── */
        .app-concierge {
            margin-bottom: var(--space-xl);
        }
        .concierge-input-row {
            display: flex;
            gap: var(--space-sm);
        }
        .concierge-input-row input {
            flex: 1;
            padding: var(--space-sm) var(--space-md);
            background: var(--bg-card);
            border: 1px solid var(--border-subtle);
            border-radius: var(--radius-lg);
            color: var(--text-primary);
            font-family: var(--font-body);
            font-size: 0.92rem;
            outline: none;
            transition: border-color 0.2s;
        }
        .concierge-input-row input:focus {
            border-color: var(--accent-primary);
        }
        .concierge-input-row button {
            padding: var(--space-sm) var(--space-lg);
            background: var(--accent-primary);
            color: #fff;
            border: none;
            border-radius: var(--radius-lg);
            font-family: var(--font-body);
            font-weight: 700;
            font-size: 0.88rem;
            cursor: pointer;
            transition: opacity 0.2s;
        }
        .concierge-input-row button:disabled {
            opacity: 0.5;
            cursor: not-allowed;
        }
        .concierge-response {
            margin-top: var(--space-sm);
            padding: var(--space-md);
            background: var(--bg-card);
            border: 1px solid var(--border-subtle);
            border-radius: var(--radius-lg);
            color: var(--text-secondary);
            font-size: 0.9rem;
            line-height: 1.6;
        }
        .concierge-response a {
            color: var(--accent-primary);
            text-decoration: none;
            font-weight: 600;
        }
        .concierge-response a:hover {
            text-decoration: underline;
        }

        /* ── Suggestion Chips ── */
        .concierge-suggestions {
            display: flex;
            flex-wrap: wrap;
            gap: var(--space-xs);
            margin-top: var(--space-sm);
        }
        .suggestion-chip {
            padding: 6px 14px;
            background: var(--bg-elevated);
            border: 1px solid var(--border-subtle);
            border-radius: var(--radius-full);
            color: var(--text-secondary);
            font-family: var(--font-body);
            font-size: 0.8rem;
            cursor: pointer;
            transition: all 0.15s ease;
        }
        .suggestion-chip:hover {
            border-color: var(--accent-primary);
            color: var(--text-primary);
            background: hsla(9, 60%, 54%, 0.08);
        }

        /* ── Regen Button ── */
        .concierge-regen {
            display: inline-flex;
            align-items: center;
            gap: 4px;
            margin-top: var(--space-sm);
            padding: 4px 10px;
            background: transparent;
            border: 1px solid var(--border-subtle);
            border-radius: var(--radius-md);
            color: var(--text-dim);
            font-size: 0.75rem;
            cursor: pointer;
            transition: all 0.15s ease;
        }
        .concierge-regen:hover {
            border-color: var(--accent-primary);
            color: var(--text-secondary);
        }

        /* ── Suggest CTA ── */
        .suggest-cta {
            background: transparent;
            border: 2px solid var(--accent-primary);
            color: var(--accent-primary);
            box-shadow: none;
        }
        .suggest-cta:hover {
            background: var(--accent-primary);
            color: #fff;
            box-shadow: var(--shadow-glow-lg);
        }
        .hero-ctas {
            display: flex;
            gap: var(--space-sm);
            justify-content: center;
            flex-wrap: wrap;
        }

        /* ── Controls ── */
        .apps-controls {
            display: flex;
            align-items: center;
            gap: var(--space-md);
            margin-bottom: var(--space-xl);
            flex-wrap: wrap;
        }
        .apps-categories {
            display: flex;
            gap: var(--space-xs);
            flex: 1;
            flex-wrap: wrap;
        }
        .cat-tab {
            padding: var(--space-xs) var(--space-md);
            background: var(--bg-card);
            border: 1px solid var(--border-subtle);
            border-radius: var(--radius-full);
            color: var(--text-secondary);
            font-family: var(--font-body);
            font-size: 0.78rem;
            font-weight: 600;
            cursor: pointer;
            transition: all 0.15s ease;
            white-space: nowrap;
        }
        .cat-tab:hover { border-color: var(--border-bright); color: var(--text-primary); }
        .cat-divider {
            width: 1px; height: 20px; background: var(--border-subtle); align-self: center;
        }
        .cat-tab[data-pricing="free"].active { background: var(--green, #10b981); border-color: var(--green, #10b981); }
        .cat-tab[data-pricing="paid"].active { background: var(--lobster-400, #e17055); border-color: var(--lobster-400, #e17055); }
        .cat-tab.active {
            background: var(--accent-primary);
            border-color: var(--accent-primary);
            color: #fff;
        }
        .apps-search {
            width: 220px;
            padding: var(--space-sm) var(--space-md);
            background: var(--bg-card);
            border: 1px solid var(--border-subtle);
            border-radius: var(--radius-md);
            color: var(--text-primary);
            font-family: var(--font-body);
            font-size: 0.85rem;
            outline: none;
        }
        .apps-search:focus { border-color: var(--accent-primary); }
        .apps-search::placeholder { color: var(--text-dim); }
        .apps-sort {
            padding: var(--space-sm) var(--space-md);
            background: var(--bg-card);
            border: 1px solid var(--border-subtle);
            border-radius: var(--radius-md);
            color: var(--text-primary);
            font-family: var(--font-body);
            font-size: 0.85rem;
            cursor: pointer;
            outline: none;
        }

        /* ── Featured Section ── */
        .featured-section {
            margin-bottom: var(--space-xl);
            display: none;
        }
        .featured-section.visible { display: block; }
        .featured-header {
            display: flex;
            align-items: center;
            gap: var(--space-sm);
            margin-bottom: var(--space-md);
        }
        .featured-title {
            font-family: var(--font-display);
            font-size: 1.15rem;
            font-weight: 700;
            color: var(--text-primary);
        }
        .featured-badge {
            font-family: var(--font-mono);
            font-size: 0.6rem;
            font-weight: 600;
            text-transform: uppercase;
            letter-spacing: 0.06em;
            padding: 0.25em 0.65em;
            border-radius: var(--radius-sm);
            background: hsla(42, 80%, 55%, 0.12);
            color: hsl(42, 80%, 55%);
        }
        .featured-grid {
            display: grid;
            grid-template-columns: repeat(auto-fill, minmax(340px, 1fr));
            gap: var(--space-lg);
        }
        .featured-grid .app-card {
            border-color: hsla(42, 80%, 55%, 0.15);
        }
        .featured-grid .app-card:hover {
            border-color: hsla(42, 80%, 55%, 0.35);
            box-shadow: 0 4px 20px hsla(42, 80%, 55%, 0.08);
        }

        /* ── Grid ── */
        .apps-grid {
            display: grid;
            grid-template-columns: repeat(auto-fill, minmax(340px, 1fr));
            gap: var(--space-lg);
        }

        /* ── Card ── */
        .app-card {
            background: var(--bg-card);
            border: 1px solid var(--border-subtle);
            border-radius: var(--radius-lg);
            overflow: hidden;
            cursor: pointer;
            transition: border-color 0.2s ease, transform 0.2s ease, box-shadow 0.2s ease;
            animation: fadeUp 0.3s ease both;
        }
        .app-card:hover {
            border-color: var(--border-bright);
            transform: translateY(-4px);
            box-shadow: var(--shadow-md);
        }

        /* Preview area */
        .app-card-preview {
            width: 100%;
            height: 180px;
            position: relative;
            overflow: hidden;
            background: var(--bg-elevated);
            border-bottom: 1px solid var(--border-subtle);
        }
        .app-card-preview iframe {
            width: 200%;
            height: 200%;
            border: none;
            pointer-events: none;
            transform: scale(0.5);
            transform-origin: top left;
        }
        .app-card-preview::after {
            content: '';
            position: absolute;
            bottom: 0; left: 0; right: 0;
            height: 40px;
            background: linear-gradient(transparent, var(--bg-card));
            pointer-events: none;
            z-index: 1;
        }
        .app-card-placeholder {
            width: 100%;
            height: 100%;
            display: flex;
            align-items: center;
            justify-content: center;
            font-size: 3.2rem;
            position: relative;
        }
        .app-card-placeholder::before {
            content: '';
            position: absolute; inset: 0;
            opacity: 0.12;
            background: radial-gradient(circle at 30% 40%, currentColor 0%, transparent 60%);
        }
        .app-card-placeholder[data-cat="tools"]   { background: linear-gradient(135deg, hsl(240, 15%, 14%) 0%, hsl(200, 20%, 18%) 100%); color: hsl(200, 50%, 60%); }
        .app-card-placeholder[data-cat="games"]   { background: linear-gradient(135deg, hsl(280, 20%, 14%) 0%, hsl(320, 15%, 18%) 100%); color: hsl(280, 50%, 65%); }
        .app-card-placeholder[data-cat="creative"] { background: linear-gradient(135deg, hsl(330, 18%, 14%) 0%, hsl(10, 20%, 18%) 100%); color: hsl(340, 50%, 65%); }
        .app-card-placeholder[data-cat="finance"]  { background: linear-gradient(135deg, hsl(140, 18%, 12%) 0%, hsl(160, 20%, 16%) 100%); color: hsl(160, 45%, 55%); }
        .app-card-placeholder[data-cat="social"]   { background: linear-gradient(135deg, hsl(200, 20%, 13%) 0%, hsl(220, 18%, 17%) 100%); color: hsl(210, 50%, 60%); }
        .app-card-placeholder[data-cat="other"]    { background: linear-gradient(135deg, hsl(30, 15%, 13%) 0%, hsl(20, 20%, 17%) 100%); color: hsl(30, 40%, 55%); }

        /* Info area */
        .app-card-info {
            padding: var(--space-md) var(--space-lg) var(--space-lg);
        }
        .app-card-name {
            font-size: 1rem;
            font-weight: 800;
            color: var(--text-primary);
            margin-bottom: 4px;
            white-space: nowrap;
            overflow: hidden;
            text-overflow: ellipsis;
        }
        .app-card-desc {
            font-size: 0.82rem;
            color: var(--text-secondary);
            line-height: 1.5;
            display: -webkit-box;
            -webkit-line-clamp: 2;
            -webkit-box-orient: vertical;
            overflow: hidden;
            margin-bottom: var(--space-md);
            min-height: 2.46em;
        }

        /* Meta row */
        .app-card-meta {
            display: flex;
            align-items: center;
            gap: var(--space-sm);
            flex-wrap: wrap;
        }
        .app-creator {
            font-family: var(--font-mono);
            font-size: 0.72rem;
            color: var(--text-dim);
            flex: 1;
            min-width: 0;
            overflow: hidden;
            text-overflow: ellipsis;
            white-space: nowrap;
        }
        .app-badge {
            display: inline-block;
            padding: 2px var(--space-sm);
            border-radius: var(--radius-full);
            font-size: 0.65rem;
            font-weight: 700;
            text-transform: uppercase;
            letter-spacing: 0.03em;
            flex-shrink: 0;
        }
        .app-badge.cat {
            background: hsla(240, 10%, 30%, 0.4);
            color: var(--text-secondary);
        }
        .app-badge.free {
            background: hsla(172, 40%, 30%, 0.3);
            color: var(--seafoam-300);
        }
        .app-badge.paid {
            background: hsla(32, 40%, 30%, 0.3);
            color: var(--sand-300);
        }
        .app-badge.owned {
            background: hsla(142, 40%, 30%, 0.3);
            color: #4ade80;
        }
        .app-badge.stake {
            display: inline-flex;
            align-items: center;
            gap: 4px;
            background: hsla(172, 40%, 30%, 0.3);
            color: var(--seafoam-300);
            text-decoration: none;
            cursor: pointer;
            transition: background 0.15s ease;
        }
        .app-badge.stake:hover {
            background: hsla(172, 40%, 35%, 0.45);
        }
        .app-badge.token {
            background: hsla(32, 40%, 30%, 0.3);
            color: var(--sand-300);
        }
        .app-badge-apy {
            font-size: 0.58rem;
            opacity: 0.8;
        }
        .app-detail-stake {
            margin: var(--space-md) 0;
        }
        .app-detail-stake-link {
            display: inline-flex;
            align-items: center;
            gap: 6px;
            padding: 8px 18px;
            border: 1.5px solid var(--seafoam-300);
            border-radius: var(--radius-full);
            background: hsla(172, 40%, 30%, 0.15);
            color: var(--seafoam-300);
            font-size: 0.82rem;
            font-weight: 700;
            font-family: var(--font-body);
            text-decoration: none;
            transition: all 0.15s ease;
        }
        .app-detail-stake-link:hover {
            background: hsla(172, 40%, 30%, 0.3);
            transform: translateY(-1px);
        }
        .app-detail-token-badge {
            display: inline-block;
            padding: 6px 14px;
            border-radius: var(--radius-full);
            background: hsla(32, 40%, 30%, 0.3);
            color: var(--sand-300);
            font-size: 0.78rem;
            font-weight: 700;
            font-family: var(--font-mono);
        }
        .app-card-upvote {
            display: inline-flex;
            align-items: center;
            gap: 4px;
            padding: 4px 10px;
            background: none;
            border: 1px solid var(--border-default);
            border-radius: var(--radius-full);
            color: var(--text-dim);
            font-family: var(--font-mono);
            font-size: 0.72rem;
            font-weight: 700;
            cursor: pointer;
            transition: all 0.15s ease;
            flex-shrink: 0;
        }
        .app-card-upvote:hover {
            border-color: var(--accent-primary);
            color: var(--accent-primary);
        }
        .app-card-upvote.upvoted {
            background: var(--accent-primary);
            border-color: var(--accent-primary);
            color: #fff;
        }
        .app-card-upvote svg { width: 12px; height: 12px; }

        /* ── Moderation buttons ── */
        .app-card-mod {
            display: flex;
            gap: 6px;
            padding: 6px 10px 2px;
        }
        .mod-btn {
            padding: 3px 10px;
            border-radius: 4px;
            border: 1px solid;
            font-size: 0.7rem;
            font-weight: 600;
            cursor: pointer;
            background: none;
            transition: all 0.15s ease;
        }
        .mod-hide {
            color: #f59e0b;
            border-color: rgba(245,158,11,0.3);
        }
        .mod-hide:hover { background: rgba(245,158,11,0.15); }
        .mod-delete {
            color: #ef4444;
            border-color: rgba(239,68,68,0.3);
        }
        .mod-delete:hover { background: rgba(239,68,68,0.15); }
        .mod-unhide {
            color: #22c55e;
            border-color: rgba(34,197,94,0.3);
        }
        .mod-unhide:hover { background: rgba(34,197,94,0.15); }
        .app-card.moderated {
            opacity: 0.45;
            border: 1px dashed rgba(239,68,68,0.4);
        }
        .app-card.moderated:hover { opacity: 0.7; }
        .admin-toggle {
            display: inline-flex;
            align-items: center;
            gap: 6px;
            font-size: 0.8rem;
            color: var(--sand-400);
            cursor: pointer;
            white-space: nowrap;
        }
        .admin-toggle input { cursor: pointer; }

        /* ── Detail Modal ── */
        .app-detail-overlay {
            position: fixed;
            inset: 0;
            background: hsla(240, 20%, 3%, 0.8);
            backdrop-filter: blur(8px);
            -webkit-backdrop-filter: blur(8px);
            z-index: 500;
            display: flex;
            align-items: center;
            justify-content: center;
            padding: var(--space-xl);
            animation: fadeIn 0.2s ease;
        }
        .app-detail-modal {
            background: var(--bg-elevated);
            border: 1px solid var(--border-subtle);
            border-radius: var(--radius-xl);
            width: 100%;
            max-width: 720px;
            max-height: 90vh;
            overflow-y: auto;
            box-shadow: var(--shadow-xl);
            animation: modalIn 0.25s var(--ease-smooth);
        }
        .app-detail-close {
            position: sticky;
            top: 0;
            z-index: 2;
            display: flex;
            justify-content: flex-end;
            padding: var(--space-md) var(--space-lg) 0;
        }
        .app-detail-close button {
            width: 36px;
            height: 36px;
            border-radius: var(--radius-full);
            background: var(--bg-card);
            border: 1px solid var(--border-subtle);
            color: var(--text-secondary);
            font-size: 1.1rem;
            cursor: pointer;
            display: flex;
            align-items: center;
            justify-content: center;
            transition: all 0.15s ease;
        }
        .app-detail-close button:hover {
            background: var(--bg-card-hover);
            color: var(--text-primary);
        }
        .app-detail-preview {
            width: 100%;
            height: 400px;
            position: relative;
            overflow: hidden;
            border-bottom: 1px solid var(--border-subtle);
            background: var(--bg-card);
        }
        .app-detail-preview iframe {
            width: 100%;
            height: 100%;
            border: none;
        }
        .app-detail-preview .app-card-placeholder {
            height: 100%;
            font-size: 4rem;
        }
        .app-detail-body {
            padding: var(--space-xl) var(--space-xl) var(--space-2xl);
        }
        .app-detail-name {
            font-size: 1.5rem;
            font-weight: 900;
            color: var(--text-primary);
            margin-bottom: var(--space-sm);
        }
        .app-detail-desc {
            font-size: 0.92rem;
            color: var(--text-secondary);
            line-height: 1.65;
            margin-bottom: var(--space-lg);
        }
        .app-detail-tags {
            display: flex;
            gap: var(--space-xs);
            flex-wrap: wrap;
            margin-bottom: var(--space-lg);
        }
        .app-tag {
            padding: 2px var(--space-sm);
            background: var(--bg-card);
            border: 1px solid var(--border-subtle);
            border-radius: var(--radius-full);
            font-size: 0.7rem;
            color: var(--text-dim);
            font-family: var(--font-mono);
        }
        .app-detail-creator {
            display: flex;
            align-items: center;
            gap: var(--space-sm);
            margin-bottom: var(--space-lg);
            font-family: var(--font-mono);
            font-size: 0.8rem;
            color: var(--text-dim);
        }
        .app-detail-actions {
            display: flex;
            gap: var(--space-sm);
            margin-bottom: var(--space-xl);
        }
        .app-use-btn {
            padding: 12px var(--space-xl);
            background: var(--accent-gradient);
            color: #fff;
            border: none;
            border-radius: var(--radius-md);
            font-family: var(--font-body);
            font-size: 0.88rem;
            font-weight: 700;
            cursor: pointer;
            text-decoration: none;
            transition: all 0.15s ease;
            display: inline-flex;
            align-items: center;
            gap: var(--space-sm);
        }
        .app-use-btn:hover { opacity: 0.88; color: #fff; }
        .app-fork-btn {
            padding: 12px var(--space-xl);
            background: var(--bg-card);
            border: 1px solid var(--border-default);
            border-radius: var(--radius-md);
            color: var(--text-secondary);
            font-family: var(--font-body);
            font-size: 0.88rem;
            font-weight: 700;
            cursor: pointer;
            transition: all 0.15s ease;
        }
        .app-fork-btn:hover {
            border-color: var(--border-bright);
            color: var(--text-primary);
        }
        .app-share-btn {
            padding: 12px var(--space-xl);
            background: var(--bg-card);
            border: 1px solid var(--border-default);
            border-radius: var(--radius-md);
            color: var(--text-secondary);
            font-family: var(--font-body);
            font-size: 0.88rem;
            font-weight: 700;
            cursor: pointer;
            transition: all 0.15s ease;
            display: inline-flex;
            align-items: center;
            gap: 6px;
        }
        .app-share-btn:hover {
            border-color: var(--border-bright);
            color: var(--text-primary);
        }
        .app-share-btn.copied {
            border-color: var(--seafoam-400);
            color: var(--seafoam-400);
        }
        .app-detail-upvote {
            display: inline-flex;
            align-items: center;
            gap: 6px;
            padding: 10px var(--space-lg);
            background: none;
            border: 1px solid var(--border-default);
            border-radius: var(--radius-md);
            color: var(--text-secondary);
            font-family: var(--font-mono);
            font-size: 0.82rem;
            font-weight: 700;
            cursor: pointer;
            transition: all 0.15s ease;
        }
        .app-detail-upvote:hover {
            border-color: var(--accent-primary);
            color: var(--accent-primary);
        }
        .app-detail-upvote.upvoted {
            background: var(--accent-primary);
            border-color: var(--accent-primary);
            color: #fff;
        }
        .app-detail-upvote svg { width: 14px; height: 14px; }

        /* Unlock + Tip sections in modal */
        .app-unlock-section, .app-tip-section {
            margin-top: var(--space-lg);
            padding-top: var(--space-lg);
            border-top: 1px solid var(--border-subtle);
        }
        .app-unlock-section h4, .app-tip-section h4 {
            font-size: 0.88rem;
            color: var(--text-primary);
            margin-bottom: var(--space-sm);
        }
        .app-unlock-info {
            font-size: 0.8rem;
            color: var(--text-secondary);
            margin-bottom: var(--space-md);
        }
        .app-unlock-status {
            font-size: 0.85rem;
            font-weight: 700;
            color: var(--seafoam-400);
            margin-bottom: var(--space-sm);
        }
        .app-tx-row {
            display: flex;
            gap: var(--space-sm);
            align-items: center;
            margin-bottom: var(--space-sm);
        }
        .app-tx-input {
            flex: 1;
            padding: var(--space-sm) var(--space-md);
            background: var(--bg-card);
            border: 1px solid var(--border-subtle);
            border-radius: var(--radius-md);
            color: var(--text-primary);
            font-family: var(--font-mono);
            font-size: 0.75rem;
            outline: none;
        }
        .app-tx-input:focus { border-color: var(--accent-primary); }
        .app-tx-input::placeholder { color: var(--text-dim); }
        .app-verify-btn {
            padding: var(--space-sm) var(--space-lg);
            background: var(--accent-gradient);
            color: #fff;
            border: none;
            border-radius: var(--radius-md);
            font-family: var(--font-body);
            font-size: 0.8rem;
            font-weight: 700;
            cursor: pointer;
            white-space: nowrap;
        }
        .app-verify-btn:disabled { opacity: 0.4; cursor: default; }
        .app-tip-amounts {
            display: flex;
            gap: var(--space-xs);
            margin-bottom: var(--space-sm);
            flex-wrap: wrap;
        }
        .app-tip-btn {
            padding: var(--space-xs) var(--space-md);
            background: var(--bg-card);
            border: 1px solid var(--border-default);
            border-radius: var(--radius-full);
            color: var(--text-secondary);
            font-family: var(--font-mono);
            font-size: 0.75rem;
            font-weight: 600;
            cursor: pointer;
            transition: all 0.15s ease;
        }
        .app-tip-btn:hover {
            border-color: var(--sand-400);
            color: var(--sand-300);
        }
        .app-tip-btn.active {
            background: hsla(32, 40%, 30%, 0.3);
            border-color: var(--sand-400);
            color: var(--sand-300);
        }
        .app-result {
            font-size: 0.8rem;
            margin-top: var(--space-sm);
        }
        .app-result.success { color: var(--seafoam-400); }
        .app-result.error { color: #ef4444; }

        /* ── Empty + Loading ── */
        .apps-empty, .apps-loading {
            text-align: center;
            padding: var(--space-3xl) var(--space-xl);
            color: var(--text-dim);
            grid-column: 1 / -1;
        }
        .apps-empty a { color: var(--accent-primary); }

        /* ── Pagination ── */
        .apps-pagination {
            display: flex;
            align-items: center;
            justify-content: center;
            gap: var(--space-md);
            margin-top: var(--space-xl);
        }
        .apps-pagination button {
            padding: var(--space-sm) var(--space-lg);
            background: var(--bg-card);
            border: 1px solid var(--border-default);
            border-radius: var(--radius-md);
            color: var(--text-secondary);
            font-family: var(--font-body);
            font-size: 0.85rem;
            cursor: pointer;
        }
        .apps-pagination button:disabled { opacity: 0.3; cursor: default; }
        .apps-pagination span {
            font-size: 0.85rem;
            color: var(--text-dim);
            font-family: var(--font-mono);
        }

        @keyframes fadeUp {
            from { opacity: 0; transform: translateY(12px); }
            to { opacity: 1; transform: translateY(0); }
        }
        @keyframes fadeIn {
            from { opacity: 0; }
            to { opacity: 1; }
        }
        @keyframes modalIn {
            from { opacity: 0; transform: translateY(20px) scale(0.97); }
            to { opacity: 1; transform: translateY(0) scale(1); }
        }

        /* ── Mobile ── */
        @media (max-width: 768px) {
            .apps-page { padding-left: var(--space-md); padding-right: var(--space-md); }
            .apps-hero h1 { font-size: 2rem; }
            .apps-controls { flex-direction: column; align-items: stretch; }
            .apps-search { width: 100%; }
            .apps-grid { grid-template-columns: 1fr; }
            .app-detail-overlay { padding: 0; align-items: flex-end; }
            .app-detail-modal {
                max-height: 95vh;
                border-radius: var(--radius-xl) var(--radius-xl) 0 0;
                max-width: 100%;
            }
            .app-detail-preview { height: 260px; }
            .app-detail-actions { flex-wrap: wrap; }
        }
    </style>
</head>
<body>

<nav class="nav">
    <a href="/" class="nav-brand">
        <span class="nav-logo">inclawbate &#129438;</span>
    </a>
    <div class="nav-links">
        <a href="/inclawbator" class="nav-link nav-link-featured">Inclawbator</a>
        <a href="/claws" class="nav-link">$CLAWS</a>
        <div class="nav-group">
            <a href="#" class="nav-link" onclick="return false">Explore</a>
            <div class="nav-group-menu">
                <a href="/build">Build</a>
                <a href="/apps">Apps</a>
                <a href="/tokens">Tokens</a>
                <a href="/nfts">NFTs</a>
                <a href="/stake">Staking</a>
                <a href="/schedule">X Schedule</a>

</nav>

<div class="apps-page">
    <!-- Hero -->
    <div class="apps-hero">
        <h1>App Store</h1>
        <p>Discover apps built on Inclawbate. Use them, fork them, build your own.</p>
        <div class="apps-hero-stats">
            <div class="apps-stat">
                <span class="apps-stat-num" id="statApps">--</span>
                <span class="apps-stat-label">Apps</span>
            </div>
            <div class="apps-stat">
                <span class="apps-stat-num" id="statBuilders">--</span>
                <span class="apps-stat-label">Builders</span>
            </div>
        </div>
        <div class="hero-ctas">
            <a href="/build" class="apps-hero-cta">Build Your Own</a>
            <button class="apps-hero-cta suggest-cta" id="suggestBtn">Suggest an Idea</button>
        </div>
    </div>

    <!-- Concierge -->
    <div class="app-concierge">
        <div class="concierge-input-row">
            <input type="text" id="conciergeInput" placeholder="What kind of app are you looking for?">
            <button id="conciergeBtn">Ask</button>
        </div>
        <div id="conciergeSuggestions" class="concierge-suggestions"></div>
        <div id="conciergeResponse" class="concierge-response" style="display:none;"></div>
    </div>

    <!-- Featured Apps -->
    <div id="featuredSection" class="featured-section">
        <div class="featured-header">
            <span class="featured-title">Featured Apps</span>
            <span class="featured-badge">Staff Picks</span>
        </div>
        <div id="featuredGrid" class="featured-grid"></div>
    </div>

    <!-- Controls -->
    <div class="apps-controls">
        <div class="apps-categories">
            <button class="cat-tab active" data-cat="all">All</button>
            <button class="cat-tab" data-cat="tools">Tools</button>
            <button class="cat-tab" data-cat="games">Games</button>
            <button class="cat-tab" data-cat="creative">Creative</button>
            <button class="cat-tab" data-cat="finance">Finance</button>
            <button class="cat-tab" data-cat="social">Social</button>
            <span class="cat-divider"></span>
            <button class="cat-tab" data-pricing="free">Free</button>
            <button class="cat-tab" data-pricing="paid">Paid</button>
        </div>
        <input class="apps-search" type="text" placeholder="Search apps or builders..." id="appSearch">
        <select class="apps-sort" id="appSort">
            <option value="trending">Trending</option>
            <option value="newest">Newest</option>
            <option value="popular">Most Popular</option>
        </select>
        <label class="admin-toggle" id="showHiddenToggle" style="display:none">
            <input type="checkbox" id="showHiddenCheck">
            <span>Show Hidden</span>
        </label>
        <label class="admin-toggle" id="anonPublishToggle" style="display:none">
            <input type="checkbox" id="anonPublishCheck" checked>
            <span>Allow Anonymous Publishing</span>
        </label>
    </div>

    <!-- Grid -->
    <div id="appsFeed" class="apps-grid">
        <div class="apps-loading">Loading apps...</div>
    </div>

    <!-- Pagination -->
    <div id="appsPagination" class="apps-pagination" style="display:none;">
        <button id="prevPage" onclick="AppStore.prevPage()">Prev</button>
        <span id="pageInfo">1 / 1</span>
        <button id="nextPage" onclick="AppStore.nextPage()">Next</button>
    </div>
</div>

<script>
(function() {
    'use strict';

    var API = '/api/inclawbate/apps';
    var state = {
        category: 'all',
        pricing: '',
        search: '',
        sort: 'trending',
        page: 1,
        pages: 1,
        apps: [],
        total: 0,
        showHidden: false,
        creatorWallet: '',
        creatorXHandle: '',
        creatorId: ''
    };

    var searchTimer = null;
    var feedEl = document.getElementById('appsFeed');
    var paginationEl = document.getElementById('appsPagination');

    // Category emoji map
    var catEmoji = { tools: '\u{1F527}', games: '\u{1F3AE}', creative: '\u{1F3A8}', finance: '\u{1F4B0}', social: '\u{1F4AC}', other: '\u{1F680}' };

    // ── Creator display: display_name > @x_handle > 0xABCD...1234 > Anonymous ──
    function creatorLabel(app) {
        if (app.creator_display_name) return app.creator_display_name;
        if (app.creator_x_handle && !app.creator_x_handle.startsWith('w_')) return '@' + app.creator_x_handle;
        if (app.creator_wallet) return app.creator_wallet.slice(0, 6) + '...' + app.creator_wallet.slice(-4);
        return 'Anonymous';
    }

    // ── Auth ──
    function getToken() { return localStorage.getItem('inclawbate_token'); }
    function getProfile() {
        try { return JSON.parse(localStorage.getItem('inclawbate_profile')); } catch(e) { return null; }
    }
    function isLoggedIn() { return !!getToken() && !!getProfile(); }

    var SUPER_ADMIN = '0x91b5c0d07859cfeafeb67d9694121cd741f049bd';
    function isSuperAdmin() {
        var p = getProfile();
        return p && p.wallet_address && p.wallet_address.toLowerCase() === SUPER_ADMIN;
    }

    // ── Category tabs ──
    document.querySelectorAll('.cat-tab[data-cat]').forEach(function(tab) {
        tab.addEventListener('click', function() {
            document.querySelectorAll('.cat-tab[data-cat]').forEach(function(t) { t.classList.remove('active'); });
            tab.classList.add('active');
            state.category = tab.dataset.cat;
            state.page = 1;
            loadApps();
        });
    });

    // ── Pricing tabs (Free / Paid) ──
    document.querySelectorAll('.cat-tab[data-pricing]').forEach(function(tab) {
        tab.addEventListener('click', function() {
            if (tab.classList.contains('active')) {
                // Toggle off — deselect
                tab.classList.remove('active');
                state.pricing = '';
            } else {
                document.querySelectorAll('.cat-tab[data-pricing]').forEach(function(t) { t.classList.remove('active'); });
                tab.classList.add('active');
                state.pricing = tab.dataset.pricing;
            }
            state.page = 1;
            loadApps();
        });
    });

    // ── Search ──
    document.getElementById('appSearch').addEventListener('input', function(e) {
        clearTimeout(searchTimer);
        var val = e.target.value;
        searchTimer = setTimeout(function() {
            state.search = val;
            state.page = 1;
            loadApps();
        }, 300);
    });

    // ── Sort ──
    document.getElementById('appSort').addEventListener('change', function(e) {
        state.sort = e.target.value;
        state.page = 1;
        loadApps();
    });

    // ── Show Hidden toggle (admin only) ──
    if (isSuperAdmin()) {
        document.getElementById('showHiddenToggle').style.display = 'inline-flex';
        document.getElementById('anonPublishToggle').style.display = 'inline-flex';
        // Load current anonymous publish setting
        fetch(API + '?get_settings=1').then(function(r) { return r.json(); }).then(function(d) {
            if (d.settings) {
                document.getElementById('anonPublishCheck').checked = d.settings.allow_anonymous_publish !== 'false';
            }
        }).catch(function() {});
    }
    document.getElementById('showHiddenCheck').addEventListener('change', function(e) {
        state.showHidden = e.target.checked;
        state.page = 1;
        loadApps();
    });
    document.getElementById('anonPublishCheck').addEventListener('change', function(e) {
        var enabled = e.target.checked;
        fetch(API, {
            method: 'POST',
            headers: { 'Content-Type': 'application/json', 'Authorization': 'Bearer ' + getToken() },
            body: JSON.stringify({ action: 'toggle_anonymous_publish', app_id: '_', enabled: enabled })
        }).then(function(r) { return r.json(); }).then(function(d) {
            if (d.error) { alert(d.error); e.target.checked = !enabled; }
        }).catch(function() { alert('Failed to update setting'); e.target.checked = !enabled; });
    });

    // ── Featured Apps ──
    async function loadFeatured() {
        var section = document.getElementById('featuredSection');
        var grid = document.getElementById('featuredGrid');
        if (!section || !grid) return;

        try {
            var headers = {};
            if (isLoggedIn()) headers['Authorization'] = 'Bearer ' + getToken();
            var resp = await fetch(API + '?featured=true&limit=6', { headers: headers });
            var data = await resp.json();
            var apps = data.apps || [];
            if (apps.length === 0) return;

            section.classList.add('visible');
            grid.innerHTML = '';
            apps.forEach(function(app, i) {
                var card = document.createElement('div');
                card.className = 'app-card';
                card.style.animationDelay = (i * 0.04) + 's';
                var creator = creatorLabel(app);
                var catLabel = app.category ? app.category.charAt(0).toUpperCase() + app.category.slice(1) : 'Other';
                var emoji = catEmoji[app.category] || catEmoji.other;
                var previewHtml = app.has_code
                    ? '<div class="app-card-preview"><iframe src="/s/' + encodeURIComponent(app.slug) + '" sandbox="allow-scripts" loading="lazy" tabindex="-1"></iframe></div>'
                    : '<div class="app-card-preview"><div class="app-card-placeholder" data-cat="' + (app.category || 'other') + '">' + emoji + '</div></div>';
                var tokenBadge = '';
                if (app.staking_address && app.token_symbol) {
                    tokenBadge = '<a class="app-badge stake" href="/stake/' + encodeURIComponent(app.token_symbol) + '" onclick="event.stopPropagation()">' +
                        '$' + escapeHtml(app.token_symbol) +
                        ' <span class="app-badge-apy" data-pool="' + escapeHtml(app.staking_address) + '"></span>' +
                    '</a>';
                } else if (app.token_symbol) {
                    tokenBadge = '<span class="app-badge token">$' + escapeHtml(app.token_symbol) + '</span>';
                }

                card.innerHTML = previewHtml +
                    '<div class="app-card-info">' +
                        '<div class="app-card-name">' + escapeHtml(app.name || app.slug) + '</div>' +
                        '<div class="app-card-desc">' + escapeHtml(app.description || '') + '</div>' +
                        '<div class="app-card-meta">' +
                            '<span class="app-creator">' + escapeHtml(creator) + '</span>' +
                            '<span class="app-badge cat">' + catLabel + '</span>' +
                            (app.claws_price > 0
                                ? '<span class="app-badge paid">' + formatNum(app.claws_price) + ' CLAWS</span>'
                                : '<span class="app-badge free">Free</span>') +
                            tokenBadge +
                        '</div>' +
                    '</div>';
                card.addEventListener('click', function() { openDetail(app.id); });
                grid.appendChild(card);
            });
        } catch(e) { /* silent */ }
    }

    // ── Load Apps ──
    async function loadApps() {
        feedEl.innerHTML = '<div class="apps-loading">Loading apps...</div>';
        paginationEl.style.display = 'none';

        var params = new URLSearchParams({
            sort: state.sort,
            page: state.page,
            limit: 18
        });
        if (state.category !== 'all') params.set('category', state.category);
        if (state.pricing) params.set('pricing', state.pricing);
        if (state.search) params.set('search', state.search);
        if (state.showHidden) params.set('show_hidden', 'true');
        if (state.creatorWallet) params.set('creator_wallet', state.creatorWallet);
        if (state.creatorXHandle) params.set('creator_x_handle', state.creatorXHandle);
        if (state.creatorId) params.set('creator_id', state.creatorId);

        var headers = {};
        if (isLoggedIn()) headers['Authorization'] = 'Bearer ' + getToken();

        try {
            var resp = await fetch(API + '?' + params.toString(), { headers: headers });
            var data = await resp.json();

            state.apps = data.apps || [];
            state.pages = data.pages || 1;
            state.total = data.total || 0;

            // Update stats
            document.getElementById('statApps').textContent = data.total || state.apps.length;
            if (data.builders !== undefined) {
                document.getElementById('statBuilders').textContent = data.builders;
            }

            renderFeed();
        } catch(e) {
            feedEl.innerHTML = '<div class="apps-empty">Failed to load apps. Try again.</div>';
        }
    }

    // ── Render Grid ──
    function renderFeed() {
        if (state.apps.length === 0) {
            feedEl.innerHTML = '<div class="apps-empty">No apps found. <a href="/build">Build the first one!</a></div>';
            paginationEl.style.display = 'none';
            return;
        }

        feedEl.innerHTML = '';
        state.apps.forEach(function(app, i) {
            var card = document.createElement('div');
            card.className = 'app-card' + (app.moderated ? ' moderated' : '');
            card.style.animationDelay = (i * 0.04) + 's';

            var creator = creatorLabel(app);

            var priceBadge = app.claws_price > 0
                ? '<span class="app-badge paid">' + formatNum(app.claws_price) + ' CLAWS</span>' + (app.has_unlocked ? '<span class="app-badge owned">Owned</span>' : '')
                : '<span class="app-badge free">Free</span>';

            var tokenBadge = '';
            if (app.staking_address && app.token_symbol) {
                tokenBadge = '<a class="app-badge stake" href="/stake/' + encodeURIComponent(app.token_symbol) + '" onclick="event.stopPropagation()">' +
                    '$' + escapeHtml(app.token_symbol) +
                    ' <span class="app-badge-apy" data-pool="' + escapeHtml(app.staking_address) + '"></span>' +
                '</a>';
            } else if (app.token_symbol) {
                tokenBadge = '<span class="app-badge token">$' + escapeHtml(app.token_symbol) + '</span>';
            }

            var catLabel = app.category ? app.category.charAt(0).toUpperCase() + app.category.slice(1) : 'Other';
            var emoji = catEmoji[app.category] || catEmoji.other;

            // Preview area
            var previewHtml;
            if (app.has_code) {
                previewHtml = '<div class="app-card-preview"><iframe src="/s/' + encodeURIComponent(app.slug) + '" sandbox="allow-scripts" loading="lazy" tabindex="-1"></iframe></div>';
            } else {
                previewHtml = '<div class="app-card-preview"><div class="app-card-placeholder" data-cat="' + (app.category || 'other') + '">' + emoji + '</div></div>';
            }

            card.innerHTML =
                previewHtml +
                '<div class="app-card-info">' +
                    '<div class="app-card-name">' + escapeHtml(app.name || app.slug) + '</div>' +
                    '<div class="app-card-desc">' + escapeHtml(app.description || '') + '</div>' +
                    '<div class="app-card-meta">' +
                        '<span class="app-creator">' + escapeHtml(creator) + '</span>' +
                        '<span class="app-badge cat">' + catLabel + '</span>' +
                        priceBadge +
                        tokenBadge +
                        '<button class="app-card-upvote' + (app.has_upvoted ? ' upvoted' : '') + '" data-id="' + app.id + '" onclick="event.stopPropagation(); AppStore.upvote(\'' + app.id + '\', this)">' +
                            '<svg viewBox="0 0 24 24" fill="currentColor"><path d="M12 4l-8 8h5v8h6v-8h5z"/></svg>' +
                            '<span>' + (app.upvote_count || 0) + '</span>' +
                        '</button>' +
                    '</div>' +
                    (isSuperAdmin() ? '<div class="app-card-mod" onclick="event.stopPropagation()">' +
                        (app.moderated
                            ? '<button class="mod-btn mod-unhide" onclick="AppStore.moderate(\'' + app.id + '\', \'unhide\')" title="Unhide">Unhide</button>'
                            : '<button class="mod-btn mod-hide" onclick="AppStore.moderate(\'' + app.id + '\', \'hide\')" title="Hide from store">Hide</button>') +
                        '<button class="mod-btn mod-delete" onclick="AppStore.moderate(\'' + app.id + '\', \'delete\')" title="Delete permanently">Delete</button>' +
                    '</div>' : '') +
                '</div>';

            card.addEventListener('click', function() { openDetail(app.id); });
            feedEl.appendChild(card);
        });

    // ── Batch APY Fetch ──
    async function fetchCardApys() {
        var els = document.querySelectorAll('[data-pool]');
        if (!els.length) return;

        var poolMap = {};
        els.forEach(function(el) {
            var addr = el.getAttribute('data-pool');
            if (addr) poolMap[addr] = poolMap[addr] || [];
            poolMap[addr].push(el);
        });

        var RPC = 'https://mainnet.base.org';
        var addresses = Object.keys(poolMap);

        var calls = [];
        addresses.forEach(function(addr) {
            var padded = addr.slice(2).toLowerCase().padStart(64, '0');
            // totalStaked(address(0)) — we use totalStaked() selector 0x817b1cd2
            calls.push(
                fetch(RPC, {
                    method: 'POST',
                    headers: { 'Content-Type': 'application/json' },
                    body: JSON.stringify({ jsonrpc: '2.0', id: 1, method: 'eth_call', params: [{ to: addr, data: '0x817b1cd2' }, 'latest'] })
                }).then(function(r) { return r.json(); }).catch(function() { return null; })
            );
            // rewardRate() — selector 0x7b0a47ee
            calls.push(
                fetch(RPC, {
                    method: 'POST',
                    headers: { 'Content-Type': 'application/json' },
                    body: JSON.stringify({ jsonrpc: '2.0', id: 2, method: 'eth_call', params: [{ to: addr, data: '0x7b0a47ee' }, 'latest'] })
                }).then(function(r) { return r.json(); }).catch(function() { return null; })
            );
        });

        var results = await Promise.allSettled(calls);

        for (var i = 0; i < addresses.length; i++) {
            var stakedRes = results[i * 2];
            var rateRes = results[i * 2 + 1];

            var staked = stakedRes && stakedRes.status === 'fulfilled' && stakedRes.value && stakedRes.value.result
                ? Number(BigInt(stakedRes.value.result)) : 0;
            var rate = rateRes && rateRes.status === 'fulfilled' && rateRes.value && rateRes.value.result
                ? Number(BigInt(rateRes.value.result)) : 0;

            var apyText = '';
            if (staked > 0 && rate > 0) {
                var apy = (rate * 86400 * 365 / staked) * 100;
                apyText = apy >= 1 ? Math.round(apy) + '% APY' : apy.toFixed(1) + '% APY';
            }

            poolMap[addresses[i]].forEach(function(el) {
                if (apyText) {
                    el.textContent = apyText;
                }
            });
        }
    }

            label.textContent = 'Copied!';
            setTimeout(function() {

    // Prevent iframes from stealing scroll position on load or focus
    var _savedScrollY = 0;
    var _scrollLocked = false;
    function lockScroll() {
        _savedScrollY = window.scrollY;
        _scrollLocked = true;
        requestAnimationFrame(function() {
            if (_scrollLocked) {
                window.scrollTo(0, _savedScrollY);
                _scrollLocked = false;
            }
        });
    }
    window.addEventListener('blur', function() {
        if (document.activeElement && document.activeElement.tagName === 'IFRAME') lockScroll();
    });
    // Observe new iframes added to the DOM and lock scroll on load
    var _iframeObserver = new MutationObserver(function(mutations) {
        mutations.forEach(function(m) {
            m.addedNodes.forEach(function(node) {
                if (node.nodeType !== 1) return;
                var iframes = node.tagName === 'IFRAME' ? [node] : node.querySelectorAll ? node.querySelectorAll('iframe') : [];
                for (var i = 0; i < iframes.length; i++) {
                    iframes[i].addEventListener('load', lockScroll);
                }
            });
        });
    });
    _iframeObserver.observe(document.body, { childList: true, subtree: true });

    // ── Concierge ──
    (function() {
        var input = document.getElementById('conciergeInput');
        var btn = document.getElementById('conciergeBtn');
        var responseEl = document.getElementById('conciergeResponse');
        var suggestionsEl = document.getElementById('conciergeSuggestions');
        var suggestBtn = document.getElementById('suggestBtn');
        var lastQuery = '';

        var chipPool = [
            'a habit tracker with streaks',
            'a multiplayer trivia game',
            'a budget dashboard',
            'a recipe organizer',
            'a pomodoro timer',
            'a mood journal',
            'a flashcard quiz',
            'a workout logger',
            'a daily planner',
            'a drawing canvas'
        ];

        // Pick 3 random chips
        function renderChips() {
            var shuffled = chipPool.slice().sort(function() { return Math.random() - 0.5; });
            var picks = shuffled.slice(0, 3);
            suggestionsEl.innerHTML = '';
            picks.forEach(function(text) {
                var chip = document.createElement('span');
                chip.className = 'suggestion-chip';
                chip.textContent = text;
                chip.addEventListener('click', function() {
                    input.value = text;
                    askConcierge();
                });
                suggestionsEl.appendChild(chip);
            });
        }

        function hideChips() {
            suggestionsEl.style.display = 'none';
        }

        function getAppList() {
            return state.apps.map(function(a) {
                return a.name + ' (' + (a.category || 'other') + '): ' + (a.description || 'No description');
            }).join('\n');
        }

        function linkAppNames(text) {
            state.apps.forEach(function(app) {
                var escaped = app.name.replace(/[.*+?^${}()|[\]\\]/g, '\\$&');
                text = text.replace(new RegExp('\\b' + escaped + '\\b', 'gi'), '<a href="#" onclick="event.preventDefault(); AppStore.openDetail(\'' + app.id + '\')">' + app.name + '</a>');
            });
            return text;
        }

        function showResponse(html, isSuggest) {
            responseEl.style.display = 'block';
            responseEl.innerHTML = html;
            // Append regen button
            var regen = document.createElement('button');
            regen.className = 'concierge-regen';
            regen.innerHTML = '&#x1f504; Try again';
            regen.addEventListener('click', function() {
                if (isSuggest) {
                    suggestBtn.click();
                } else {
                    askConcierge(lastQuery);
                }
            });
            responseEl.appendChild(regen);
            responseEl.scrollIntoView({ behavior: 'smooth', block: 'nearest' });
        }

        function askConcierge(overrideQuery) {
            var query = overrideQuery || input.value.trim();
            if (!query) return;
            lastQuery = query;

            btn.disabled = true;
            btn.textContent = 'Thinking...';
            responseEl.style.display = 'block';
            responseEl.textContent = '...';
            hideChips();

            var systemPrompt = 'You are a concierge for the Inclawbate app store. ' +
                'Here are the current apps:\n' + getAppList() + '\n\n' +
                'When a user asks what they need, recommend matching apps by name. ' +
                'If nothing matches, suggest they build one at inclawbate.app/build using the Inclawbator. ' +
                'Keep responses short (2-4 sentences). Use app names exactly as listed.';

            fetch('/api/groq', {
                method: 'POST',
                headers: { 'Content-Type': 'application/json' },
                body: JSON.stringify({
                    messages: [
                        { role: 'system', content: systemPrompt },
                        { role: 'user', content: query }
                    ],
                    max_tokens: 300
                })
            })
            .then(function(r) { return r.json(); })
            .then(function(data) {
                var text = data.text || (data.choices && data.choices[0] && data.choices[0].message && data.choices[0].message.content) || 'Sorry, I couldn\'t process that.';
                showResponse(linkAppNames(text));
            })
            .catch(function() {
                responseEl.textContent = 'Something went wrong. Try again.';
            })
            .finally(function() {
                btn.disabled = false;
                btn.textContent = 'Ask';
            });
        }

        // "Suggest an Idea" button
        suggestBtn.addEventListener('click', function() {
            suggestBtn.disabled = true;
            suggestBtn.textContent = 'Thinking...';
            responseEl.style.display = 'block';
            responseEl.textContent = '...';
            hideChips();

            var appNames = state.apps.map(function(a) { return a.name; }).join(', ');
            var systemPrompt = 'Here are the apps already on Inclawbate: ' + appNames + '. ' +
                'Suggest ONE creative new app idea that doesn\'t exist yet. ' +
                'Give a name, one-sentence description, and why it\'s useful. 3-4 sentences max.';

            fetch('/api/groq', {
                method: 'POST',
                headers: { 'Content-Type': 'application/json' },
                body: JSON.stringify({
                    messages: [
                        { role: 'system', content: systemPrompt },
                        { role: 'user', content: 'Suggest a new app idea for the Inclawbate ecosystem.' }
                    ],
                    max_tokens: 300
                })
            })
            .then(function(r) { return r.json(); })
            .then(function(data) {
                var text = data.text || (data.choices && data.choices[0] && data.choices[0].message && data.choices[0].message.content) || 'Sorry, couldn\'t generate an idea right now.';
                var buildLink = '<br><a href="/build?idea=' + encodeURIComponent(text) + '" style="display:inline-block;margin-top:8px;padding:6px 14px;background:var(--accent-primary);color:#fff;border-radius:var(--radius-md);font-weight:700;font-size:0.85rem;">Build This &rarr;</a>';
                showResponse(text + buildLink, true);
            })
            .catch(function() {
                responseEl.textContent = 'Something went wrong. Try again.';
            })
            .finally(function() {
                suggestBtn.disabled = false;
                suggestBtn.textContent = 'Suggest an Idea';
            });
        });

        btn.addEventListener('click', function() { askConcierge(); });
        input.addEventListener('keydown', function(e) {
            if (e.key === 'Enter') askConcierge();
        });

        renderChips();
    })();
})();
</script>

<script src="/js/wallet-bundle.js"></script>
<script src="/js/privy-bundle.js"></script>
<script src="/js/nav-auth.js"></script>

</body>
</html>
