<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>App Store — Inclawbate</title>
    <meta name="description" content="Discover apps built on Inclawbate. Upvote your favorites, unlock premium tools with CLAWS.">
    <meta property="og:title" content="App Store — Inclawbate">
    <meta property="og:description" content="Discover apps built on Inclawbate. Upvote your favorites, unlock premium tools with CLAWS.">
    <meta property="og:type" content="website">
    <meta property="og:url" content="https://inclawbate.com/apps">
    <meta name="twitter:card" content="summary_large_image">
    <link rel="icon" href="data:image/svg+xml,<svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 100 100'><text y='.9em' font-size='90'>&#129438;</text></svg>">
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Nunito:wght@400;500;600;700;800;900&family=JetBrains+Mono:wght@300;400;600;700&display=swap" rel="stylesheet">
    <style>body{opacity:0}</style>
    <link rel="stylesheet" href="/styles/core.css">
    <link rel="stylesheet" href="/styles/components.css">
    <style>
        body { opacity: 1; background: var(--bg-deepest); }

        .apps-page {
            max-width: 800px;
            margin: 0 auto;
            padding: calc(var(--nav-height) + var(--space-xl)) var(--space-lg) var(--space-3xl);
        }

        /* ── Hero ── */
        .apps-hero {
            text-align: center;
            margin-bottom: var(--space-2xl);
            animation: fadeUp 0.5s ease both;
        }
        .apps-hero h1 {
            font-family: var(--font-display);
            font-size: 2.4rem;
            font-weight: 900;
            background: var(--title-gradient);
            -webkit-background-clip: text;
            -webkit-text-fill-color: transparent;
            background-clip: text;
            line-height: 1.15;
            margin-bottom: var(--space-sm);
        }
        .apps-hero p {
            font-size: 1rem;
            color: var(--text-secondary);
            max-width: 500px;
            margin: 0 auto;
        }

        /* ── Controls ── */
        .apps-controls {
            display: flex;
            align-items: center;
            gap: var(--space-md);
            margin-bottom: var(--space-xl);
            flex-wrap: wrap;
        }
        .apps-categories {
            display: flex;
            gap: var(--space-xs);
            flex: 1;
            flex-wrap: wrap;
        }
        .cat-tab {
            padding: var(--space-xs) var(--space-md);
            background: var(--bg-card);
            border: 1px solid var(--border-subtle);
            border-radius: var(--radius-full);
            color: var(--text-secondary);
            font-family: var(--font-body);
            font-size: 0.78rem;
            font-weight: 600;
            cursor: pointer;
            transition: all 0.15s ease;
            white-space: nowrap;
        }
        .cat-tab:hover { border-color: var(--border-bright); color: var(--text-primary); }
        .cat-tab.active {
            background: var(--accent-primary);
            border-color: var(--accent-primary);
            color: #fff;
        }
        .apps-search {
            width: 200px;
            padding: var(--space-sm) var(--space-md);
            background: var(--bg-card);
            border: 1px solid var(--border-subtle);
            border-radius: var(--radius-md);
            color: var(--text-primary);
            font-family: var(--font-body);
            font-size: 0.85rem;
            outline: none;
        }
        .apps-search:focus { border-color: var(--accent-primary); }
        .apps-search::placeholder { color: var(--text-dim); }
        .apps-sort {
            padding: var(--space-sm) var(--space-md);
            background: var(--bg-card);
            border: 1px solid var(--border-subtle);
            border-radius: var(--radius-md);
            color: var(--text-primary);
            font-family: var(--font-body);
            font-size: 0.85rem;
            cursor: pointer;
            outline: none;
        }

        /* ── Feed ── */
        .apps-feed {
            display: flex;
            flex-direction: column;
            gap: var(--space-md);
        }

        .app-card {
            display: flex;
            align-items: flex-start;
            gap: var(--space-lg);
            background: var(--bg-card);
            border: 1px solid var(--border-subtle);
            border-radius: var(--radius-lg);
            padding: var(--space-lg);
            cursor: pointer;
            transition: border-color 0.15s ease, background 0.15s ease;
            animation: fadeUp 0.3s ease both;
        }
        .app-card:hover {
            border-color: var(--border-bright);
            background: var(--bg-card-hover);
        }

        /* Upvote column */
        .app-upvote {
            display: flex;
            flex-direction: column;
            align-items: center;
            gap: 2px;
            min-width: 40px;
            flex-shrink: 0;
        }
        .app-upvote-btn {
            background: none;
            border: 1px solid var(--border-default);
            border-radius: var(--radius-sm);
            width: 36px;
            height: 36px;
            display: flex;
            align-items: center;
            justify-content: center;
            cursor: pointer;
            transition: all 0.15s ease;
            color: var(--text-dim);
        }
        .app-upvote-btn:hover {
            border-color: var(--accent-primary);
            color: var(--accent-primary);
        }
        .app-upvote-btn.upvoted {
            background: var(--accent-primary);
            border-color: var(--accent-primary);
            color: #fff;
        }
        .app-upvote-btn svg { width: 14px; height: 14px; }
        .app-upvote-count {
            font-family: var(--font-mono);
            font-size: 0.8rem;
            font-weight: 700;
            color: var(--text-secondary);
        }
        .app-upvote-btn.upvoted + .app-upvote-count { color: var(--accent-primary); }

        /* Info column */
        .app-info { flex: 1; min-width: 0; }
        .app-name {
            font-size: 1rem;
            font-weight: 800;
            color: var(--text-primary);
            margin-bottom: 4px;
        }
        .app-desc {
            font-size: 0.85rem;
            color: var(--text-secondary);
            line-height: 1.5;
            display: -webkit-box;
            -webkit-line-clamp: 2;
            -webkit-box-orient: vertical;
            overflow: hidden;
            margin-bottom: var(--space-sm);
        }
        .app-meta {
            display: flex;
            align-items: center;
            gap: var(--space-sm);
            flex-wrap: wrap;
        }
        .app-creator {
            font-family: var(--font-mono);
            font-size: 0.75rem;
            color: var(--text-dim);
        }
        .app-badge {
            display: inline-block;
            padding: 2px var(--space-sm);
            border-radius: var(--radius-full);
            font-size: 0.7rem;
            font-weight: 700;
            text-transform: uppercase;
            letter-spacing: 0.03em;
        }
        .app-badge.cat {
            background: hsla(240, 10%, 30%, 0.4);
            color: var(--text-secondary);
        }
        .app-badge.free {
            background: hsla(172, 40%, 30%, 0.3);
            color: var(--seafoam-300);
        }
        .app-badge.paid {
            background: hsla(32, 40%, 30%, 0.3);
            color: var(--sand-300);
        }

        /* Thumbnail */
        .app-thumb {
            width: 64px;
            height: 64px;
            border-radius: var(--radius-md);
            flex-shrink: 0;
            display: flex;
            align-items: center;
            justify-content: center;
            font-size: 1.6rem;
            background: linear-gradient(135deg, hsla(9, 40%, 40%, 0.3), hsla(172, 30%, 40%, 0.3));
        }

        /* ── Expanded Detail ── */
        .app-detail {
            display: none;
            margin-top: var(--space-md);
            padding-top: var(--space-md);
            border-top: 1px solid var(--border-subtle);
        }
        .app-card.expanded .app-detail { display: block; }
        .app-detail-desc {
            font-size: 0.9rem;
            color: var(--text-secondary);
            line-height: 1.6;
            margin-bottom: var(--space-md);
        }
        .app-detail-tags {
            display: flex;
            gap: var(--space-xs);
            flex-wrap: wrap;
            margin-bottom: var(--space-md);
        }
        .app-tag {
            padding: 2px var(--space-sm);
            background: var(--bg-elevated);
            border: 1px solid var(--border-subtle);
            border-radius: var(--radius-full);
            font-size: 0.7rem;
            color: var(--text-dim);
            font-family: var(--font-mono);
        }
        .app-preview-frame {
            width: 100%;
            height: 360px;
            border: 1px solid var(--border-default);
            border-radius: var(--radius-md);
            background: #fff;
            margin-bottom: var(--space-md);
        }
        .app-detail-actions {
            display: flex;
            gap: var(--space-sm);
        }
        .app-use-btn {
            padding: var(--space-sm) var(--space-xl);
            background: var(--accent-gradient);
            color: #fff;
            border: none;
            border-radius: var(--radius-md);
            font-family: var(--font-body);
            font-size: 0.85rem;
            font-weight: 700;
            cursor: pointer;
            text-decoration: none;
            transition: opacity 0.15s ease;
        }
        .app-use-btn:hover { opacity: 0.85; }

        /* ── Empty + Loading ── */
        .apps-empty, .apps-loading {
            text-align: center;
            padding: var(--space-3xl) var(--space-xl);
            color: var(--text-dim);
        }
        .apps-empty a { color: var(--accent-primary); }

        /* ── Pagination ── */
        .apps-pagination {
            display: flex;
            align-items: center;
            justify-content: center;
            gap: var(--space-md);
            margin-top: var(--space-xl);
        }
        .apps-pagination button {
            padding: var(--space-sm) var(--space-lg);
            background: var(--bg-card);
            border: 1px solid var(--border-default);
            border-radius: var(--radius-md);
            color: var(--text-secondary);
            font-family: var(--font-body);
            font-size: 0.85rem;
            cursor: pointer;
        }
        .apps-pagination button:disabled { opacity: 0.3; cursor: default; }
        .apps-pagination span {
            font-size: 0.85rem;
            color: var(--text-dim);
            font-family: var(--font-mono);
        }

        /* ── Unlock + Tip UI ── */
        .app-unlock-section, .app-tip-section {
            margin-top: var(--space-md);
            padding-top: var(--space-md);
            border-top: 1px solid var(--border-subtle);
        }
        .app-unlock-section h4, .app-tip-section h4 {
            font-size: 0.85rem;
            color: var(--text-primary);
            margin-bottom: var(--space-sm);
        }
        .app-unlock-info {
            font-size: 0.8rem;
            color: var(--text-secondary);
            margin-bottom: var(--space-md);
        }
        .app-unlock-status {
            font-size: 0.85rem;
            font-weight: 700;
            color: var(--seafoam-400);
            margin-bottom: var(--space-sm);
        }
        .app-tx-row {
            display: flex;
            gap: var(--space-sm);
            align-items: center;
            margin-bottom: var(--space-sm);
        }
        .app-tx-input {
            flex: 1;
            padding: var(--space-sm) var(--space-md);
            background: var(--bg-elevated);
            border: 1px solid var(--border-subtle);
            border-radius: var(--radius-md);
            color: var(--text-primary);
            font-family: var(--font-mono);
            font-size: 0.75rem;
            outline: none;
        }
        .app-tx-input:focus { border-color: var(--accent-primary); }
        .app-tx-input::placeholder { color: var(--text-dim); }
        .app-verify-btn {
            padding: var(--space-sm) var(--space-lg);
            background: var(--accent-gradient);
            color: #fff;
            border: none;
            border-radius: var(--radius-md);
            font-family: var(--font-body);
            font-size: 0.8rem;
            font-weight: 700;
            cursor: pointer;
            white-space: nowrap;
        }
        .app-verify-btn:disabled { opacity: 0.4; cursor: default; }
        .app-tip-amounts {
            display: flex;
            gap: var(--space-xs);
            margin-bottom: var(--space-sm);
            flex-wrap: wrap;
        }
        .app-tip-btn {
            padding: var(--space-xs) var(--space-md);
            background: var(--bg-elevated);
            border: 1px solid var(--border-default);
            border-radius: var(--radius-full);
            color: var(--text-secondary);
            font-family: var(--font-mono);
            font-size: 0.75rem;
            font-weight: 600;
            cursor: pointer;
            transition: all 0.15s ease;
        }
        .app-tip-btn:hover {
            border-color: var(--sand-400);
            color: var(--sand-300);
        }
        .app-tip-btn.active {
            background: hsla(32, 40%, 30%, 0.3);
            border-color: var(--sand-400);
            color: var(--sand-300);
        }
        .app-result {
            font-size: 0.8rem;
            margin-top: var(--space-sm);
        }
        .app-result.success { color: var(--seafoam-400); }
        .app-result.error { color: #ef4444; }

        @keyframes fadeUp {
            from { opacity: 0; transform: translateY(12px); }
            to { opacity: 1; transform: translateY(0); }
        }

        /* ── Mobile ── */
        @media (max-width: 640px) {
            .apps-hero h1 { font-size: 1.8rem; }
            .apps-controls { flex-direction: column; align-items: stretch; }
            .apps-search { width: 100%; }
            .app-thumb { display: none; }
            .app-card { gap: var(--space-md); }
            .app-preview-frame { height: 240px; }
        }
    </style>
</head>
<body>

<nav class="nav">
    <a href="/" class="nav-brand">
        <span class="nav-logo">inclawbate &#129438;</span>
    </a>
    <div class="nav-links">
        <a href="/stake" class="nav-link">Stake</a>
        <a href="/angel" class="nav-link">NFT</a>
        <a href="/build" class="nav-link">Build</a>
        <a href="/apps" class="nav-link active">Apps</a>
        <a href="/inclawbator" class="nav-link">Inclawbator</a>
    </div>
</nav>

<div class="apps-page">
    <!-- Hero -->
    <div class="apps-hero">
        <h1>App Store</h1>
        <p>Discover apps built on Inclawbate. Upvote your favorites.</p>
    </div>

    <!-- Controls -->
    <div class="apps-controls">
        <div class="apps-categories">
            <button class="cat-tab active" data-cat="all">All</button>
            <button class="cat-tab" data-cat="tools">Tools</button>
            <button class="cat-tab" data-cat="games">Games</button>
            <button class="cat-tab" data-cat="creative">Creative</button>
            <button class="cat-tab" data-cat="finance">Finance</button>
            <button class="cat-tab" data-cat="social">Social</button>
        </div>
        <input class="apps-search" type="text" placeholder="Search apps..." id="appSearch">
        <select class="apps-sort" id="appSort">
            <option value="trending">Trending</option>
            <option value="newest">Newest</option>
            <option value="popular">Most Popular</option>
        </select>
    </div>

    <!-- Feed -->
    <div id="appsFeed" class="apps-feed">
        <div class="apps-loading">Loading apps...</div>
    </div>

    <!-- Pagination -->
    <div id="appsPagination" class="apps-pagination" style="display:none;">
        <button id="prevPage" onclick="AppStore.prevPage()">Prev</button>
        <span id="pageInfo">1 / 1</span>
        <button id="nextPage" onclick="AppStore.nextPage()">Next</button>
    </div>
</div>

<script>
(function() {
    'use strict';

    var API = '/api/inclawbate/apps';
    var state = {
        category: 'all',
        search: '',
        sort: 'trending',
        page: 1,
        pages: 1,
        apps: [],
        expandedId: null
    };

    var searchTimer = null;
    var feedEl = document.getElementById('appsFeed');
    var paginationEl = document.getElementById('appsPagination');

    // ── Auth ──
    function getToken() { return localStorage.getItem('inclawbate_token'); }
    function getProfile() {
        try { return JSON.parse(localStorage.getItem('inclawbate_profile')); } catch(e) { return null; }
    }
    function isLoggedIn() { return !!getToken() && !!getProfile(); }

    // ── Category tabs ──
    document.querySelectorAll('.cat-tab').forEach(function(tab) {
        tab.addEventListener('click', function() {
            document.querySelectorAll('.cat-tab').forEach(function(t) { t.classList.remove('active'); });
            tab.classList.add('active');
            state.category = tab.dataset.cat;
            state.page = 1;
            loadApps();
        });
    });

    // ── Search ──
    document.getElementById('appSearch').addEventListener('input', function(e) {
        clearTimeout(searchTimer);
        var val = e.target.value;
        searchTimer = setTimeout(function() {
            state.search = val;
            state.page = 1;
            loadApps();
        }, 300);
    });

    // ── Sort ──
    document.getElementById('appSort').addEventListener('change', function(e) {
        state.sort = e.target.value;
        state.page = 1;
        loadApps();
    });

    // ── Load Apps ──
    async function loadApps() {
        feedEl.innerHTML = '<div class="apps-loading">Loading apps...</div>';
        paginationEl.style.display = 'none';

        var params = new URLSearchParams({
            sort: state.sort,
            page: state.page,
            limit: 20
        });
        if (state.category !== 'all') params.set('category', state.category);
        if (state.search) params.set('search', state.search);

        var headers = {};
        if (isLoggedIn()) headers['Authorization'] = 'Bearer ' + getToken();

        try {
            var resp = await fetch(API + '?' + params.toString(), { headers: headers });
            var data = await resp.json();

            state.apps = data.apps || [];
            state.pages = data.pages || 1;

            renderFeed();
        } catch(e) {
            feedEl.innerHTML = '<div class="apps-empty">Failed to load apps. Try again.</div>';
        }
    }

    // ── Render ──
    function renderFeed() {
        if (state.apps.length === 0) {
            feedEl.innerHTML = '<div class="apps-empty">No apps found. <a href="/build">Build the first one!</a></div>';
            paginationEl.style.display = 'none';
            return;
        }

        feedEl.innerHTML = '';
        state.apps.forEach(function(app, i) {
            var card = document.createElement('div');
            card.className = 'app-card';
            card.style.animationDelay = (i * 0.04) + 's';

            var creator = app.creator_x_handle
                ? '@' + app.creator_x_handle
                : (app.creator_wallet ? app.creator_wallet.slice(0, 6) + '...' + app.creator_wallet.slice(-4) : 'Anonymous');

            var priceBadge = app.claws_price > 0
                ? '<span class="app-badge paid">' + formatNum(app.claws_price) + ' CLAWS</span>'
                : '<span class="app-badge free">Free</span>';

            var catLabel = app.category ? app.category.charAt(0).toUpperCase() + app.category.slice(1) : 'Other';

            // Icon based on category
            var icons = { tools: '&#128295;', games: '&#127918;', creative: '&#127912;', finance: '&#128176;', social: '&#128172;', other: '&#128640;' };
            var icon = icons[app.category] || icons.other;

            var tags = (app.tags || []);
            var tagsHtml = tags.map(function(t) { return '<span class="app-tag">' + escapeHtml(t) + '</span>'; }).join('');

            var isPaid = app.claws_price > 0;
            var appIdSafe = app.id.replace(/'/g, '');

            // Build unlock section for paid apps
            var unlockHtml = '';
            if (isPaid && app.creator_wallet) {
                unlockHtml =
                    '<div class="app-unlock-section" id="unlock-' + appIdSafe + '">' +
                        '<h4>Unlock for ' + formatNum(app.claws_price) + ' CLAWS</h4>' +
                        '<p class="app-unlock-info">Send ' + formatNum(app.claws_price) + ' CLAWS to <strong style="font-family:var(--font-mono);font-size:0.7rem;">' + app.creator_wallet.slice(0, 8) + '...' + app.creator_wallet.slice(-6) + '</strong>, then paste the tx hash below.</p>' +
                        '<div class="app-tx-row">' +
                            '<input class="app-tx-input" type="text" placeholder="0x..." id="unlock-tx-' + appIdSafe + '" onclick="event.stopPropagation()">' +
                            '<button class="app-verify-btn" onclick="event.stopPropagation(); AppStore.unlock(\'' + appIdSafe + '\')">Verify</button>' +
                        '</div>' +
                        '<div class="app-result" id="unlock-result-' + appIdSafe + '"></div>' +
                    '</div>';
            }

            // Build tip section
            var tipHtml =
                '<div class="app-tip-section">' +
                    '<h4>Tip Creator</h4>' +
                    (app.creator_wallet
                        ? '<div class="app-tip-amounts">' +
                            '<button class="app-tip-btn" onclick="event.stopPropagation(); AppStore.selectTip(\'' + appIdSafe + '\', 10)">10 CLAWS</button>' +
                            '<button class="app-tip-btn" onclick="event.stopPropagation(); AppStore.selectTip(\'' + appIdSafe + '\', 50)">50 CLAWS</button>' +
                            '<button class="app-tip-btn" onclick="event.stopPropagation(); AppStore.selectTip(\'' + appIdSafe + '\', 100)">100 CLAWS</button>' +
                          '</div>' +
                          '<div class="app-tx-row">' +
                            '<input class="app-tx-input" type="text" placeholder="Paste tip tx hash..." id="tip-tx-' + appIdSafe + '" onclick="event.stopPropagation()">' +
                            '<button class="app-verify-btn" onclick="event.stopPropagation(); AppStore.tip(\'' + appIdSafe + '\')">Verify Tip</button>' +
                          '</div>' +
                          '<div class="app-result" id="tip-result-' + appIdSafe + '"></div>'
                        : '<p class="app-unlock-info">Creator has no wallet set.</p>') +
                '</div>';

            card.innerHTML =
                '<div class="app-upvote">' +
                    '<button class="app-upvote-btn' + (app.has_upvoted ? ' upvoted' : '') + '" data-id="' + app.id + '" onclick="event.stopPropagation(); AppStore.upvote(\'' + app.id + '\', this)">' +
                        '<svg viewBox="0 0 24 24" fill="currentColor"><path d="M12 4l-8 8h5v8h6v-8h5z"/></svg>' +
                    '</button>' +
                    '<span class="app-upvote-count">' + (app.upvote_count || 0) + '</span>' +
                '</div>' +
                '<div class="app-info">' +
                    '<div class="app-name">' + escapeHtml(app.name || app.slug) + '</div>' +
                    '<div class="app-desc">' + escapeHtml(app.description || '') + '</div>' +
                    '<div class="app-meta">' +
                        '<span class="app-creator">' + escapeHtml(creator) + '</span>' +
                        '<span class="app-badge cat">' + catLabel + '</span>' +
                        priceBadge +
                    '</div>' +
                    '<div class="app-detail">' +
                        '<div class="app-detail-desc">' + escapeHtml(app.description || '') + '</div>' +
                        (tagsHtml ? '<div class="app-detail-tags">' + tagsHtml + '</div>' : '') +
                        '<iframe class="app-preview-frame" src="/s/' + encodeURIComponent(app.slug) + '" sandbox="allow-scripts allow-same-origin" loading="lazy"></iframe>' +
                        '<div class="app-detail-actions">' +
                            '<a class="app-use-btn" href="/s/' + encodeURIComponent(app.slug) + '" target="_blank" onclick="event.stopPropagation()">Use App</a>' +
                            '<button class="app-use-btn" style="background:var(--bg-elevated);border:1px solid var(--border-default);color:var(--text-secondary);" onclick="event.stopPropagation(); AppStore.fork(\'' + appIdSafe + '\')">Fork</button>' +
                        '</div>' +
                        unlockHtml +
                        tipHtml +
                    '</div>' +
                '</div>' +
                '<div class="app-thumb">' + icon + '</div>';

            card.addEventListener('click', function() { toggleExpand(card, app.id); });
            feedEl.appendChild(card);
        });

        // Pagination
        if (state.pages > 1) {
            paginationEl.style.display = 'flex';
            document.getElementById('prevPage').disabled = state.page <= 1;
            document.getElementById('nextPage').disabled = state.page >= state.pages;
            document.getElementById('pageInfo').textContent = state.page + ' / ' + state.pages;
        } else {
            paginationEl.style.display = 'none';
        }
    }

    function toggleExpand(card, id) {
        if (state.expandedId === id) {
            card.classList.remove('expanded');
            state.expandedId = null;
        } else {
            // Collapse previous
            var prev = feedEl.querySelector('.app-card.expanded');
            if (prev) prev.classList.remove('expanded');
            card.classList.add('expanded');
            state.expandedId = id;
        }
    }

    // ── Upvote ──
    async function upvote(appId, btn) {
        if (!isLoggedIn()) {
            alert('Connect your wallet first to upvote.');
            return;
        }

        try {
            var resp = await fetch(API, {
                method: 'POST',
                headers: {
                    'Content-Type': 'application/json',
                    'Authorization': 'Bearer ' + getToken()
                },
                body: JSON.stringify({ action: 'upvote', app_id: appId })
            });
            var data = await resp.json();

            if (resp.ok) {
                btn.classList.toggle('upvoted', data.upvoted);
                var countEl = btn.parentNode.querySelector('.app-upvote-count');
                if (countEl && data.upvote_count !== undefined) {
                    countEl.textContent = data.upvote_count;
                }
            }
        } catch(e) { /* silent */ }
    }

    // ── Pagination ──
    function nextPage() {
        if (state.page < state.pages) {
            state.page++;
            loadApps();
            window.scrollTo({ top: 0, behavior: 'smooth' });
        }
    }
    function prevPage() {
        if (state.page > 1) {
            state.page--;
            loadApps();
            window.scrollTo({ top: 0, behavior: 'smooth' });
        }
    }

    // ── Unlock ──
    async function unlock(appId) {
        if (!isLoggedIn()) { alert('Connect your wallet first.'); return; }
        var txInput = document.getElementById('unlock-tx-' + appId);
        var resultEl = document.getElementById('unlock-result-' + appId);
        if (!txInput || !resultEl) return;

        var txHash = txInput.value.trim();
        if (!/^0x[a-fA-F0-9]{64}$/.test(txHash)) {
            resultEl.textContent = 'Enter a valid tx hash';
            resultEl.className = 'app-result error';
            return;
        }

        resultEl.textContent = 'Verifying on-chain...';
        resultEl.className = 'app-result';

        try {
            var resp = await fetch(API, {
                method: 'POST',
                headers: {
                    'Content-Type': 'application/json',
                    'Authorization': 'Bearer ' + getToken()
                },
                body: JSON.stringify({ action: 'unlock', app_id: appId, tx_hash: txHash })
            });
            var data = await resp.json();

            if (resp.ok && data.unlocked) {
                resultEl.textContent = 'Unlocked! Paid ' + data.amount + ' CLAWS.';
                resultEl.className = 'app-result success';
                // Replace unlock section with success
                var section = document.getElementById('unlock-' + appId);
                if (section) {
                    section.innerHTML = '<div class="app-unlock-status">Unlocked</div>';
                }
            } else {
                resultEl.textContent = data.error || 'Verification failed.';
                resultEl.className = 'app-result error';
            }
        } catch(e) {
            resultEl.textContent = 'Network error. Try again.';
            resultEl.className = 'app-result error';
        }
    }

    // ── Tip ──
    function selectTip(appId, amount) {
        // Highlight selected button
        var section = document.getElementById('tip-tx-' + appId);
        if (section) section.focus();
        var btns = section ? section.closest('.app-tip-section').querySelectorAll('.app-tip-btn') : [];
        btns.forEach(function(b) { b.classList.remove('active'); });
        event.target.classList.add('active');
    }

    async function tip(appId) {
        if (!isLoggedIn()) { alert('Connect your wallet first.'); return; }
        var txInput = document.getElementById('tip-tx-' + appId);
        var resultEl = document.getElementById('tip-result-' + appId);
        if (!txInput || !resultEl) return;

        var txHash = txInput.value.trim();
        if (!/^0x[a-fA-F0-9]{64}$/.test(txHash)) {
            resultEl.textContent = 'Enter a valid tx hash';
            resultEl.className = 'app-result error';
            return;
        }

        resultEl.textContent = 'Verifying tip on-chain...';
        resultEl.className = 'app-result';

        try {
            var resp = await fetch(API, {
                method: 'POST',
                headers: {
                    'Content-Type': 'application/json',
                    'Authorization': 'Bearer ' + getToken()
                },
                body: JSON.stringify({ action: 'tip', app_id: appId, tx_hash: txHash })
            });
            var data = await resp.json();

            if (resp.ok && data.tipped) {
                resultEl.textContent = 'Tipped ' + data.amount + ' CLAWS! Thanks for supporting the creator.';
                resultEl.className = 'app-result success';
                txInput.value = '';
            } else {
                resultEl.textContent = data.error || 'Tip verification failed.';
                resultEl.className = 'app-result error';
            }
        } catch(e) {
            resultEl.textContent = 'Network error. Try again.';
            resultEl.className = 'app-result error';
        }
    }

    // ── Fork ──
    async function fork(appId) {
        try {
            var resp = await fetch(API + '?id=' + appId);
            var data = await resp.json();
            if (!data.app || !data.app.code) {
                alert('Could not load app code.');
                return;
            }
            sessionStorage.setItem('fork_source', JSON.stringify({
                app_id: data.app.id,
                name: data.app.name,
                code: data.app.code
            }));
            window.location.href = '/build';
        } catch(e) {
            alert('Failed to fork. Try again.');
        }
    }

    // ── Helpers ──
    function escapeHtml(str) {
        var d = document.createElement('div');
        d.textContent = str || '';
        return d.innerHTML;
    }
    function formatNum(n) {
        return parseFloat(n).toLocaleString();
    }

    // ── Check URL params ──
    function checkParams() {
        var params = new URLSearchParams(window.location.search);
        if (params.get('category')) {
            state.category = params.get('category');
            document.querySelectorAll('.cat-tab').forEach(function(t) {
                t.classList.toggle('active', t.dataset.cat === state.category);
            });
        }
        if (params.get('search')) {
            state.search = params.get('search');
            document.getElementById('appSearch').value = state.search;
        }
    }

    // ── Admin Gate (temporary) ──
    var ADMIN_HANDLES = ['artstu'];
    function isAdmin() {
        var profile = getProfile();
        return profile && ADMIN_HANDLES.includes((profile.x_handle || '').toLowerCase());
    }

    // ── Init ──
    checkParams();
    if (!isLoggedIn() || !isAdmin()) {
        feedEl.innerHTML = '<div class="apps-empty" style="padding:80px 20px;">' +
            '<h2 style="color:var(--text-primary);margin-bottom:12px;">App Store — Coming Soon</h2>' +
            '<p style="color:var(--text-secondary);">We\'re curating the first wave of apps. Check back shortly.</p>' +
            '</div>';
    } else {
        loadApps();
    }

    // ── Public API ──
    window.AppStore = {
        upvote: upvote,
        unlock: unlock,
        tip: tip,
        selectTip: selectTip,
        fork: fork,
        nextPage: nextPage,
        prevPage: prevPage
    };
})();
</script>

<script src="/js/nav-auth.js"></script>
</body>
</html>
