<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>UBI - Inclawbate Instagram</title>
<style>
  * { margin: 0; padding: 0; box-sizing: border-box; }

  body {
    width: 1080px;
    height: 1080px;
    background: #0a0a0f;
    display: flex;
    align-items: center;
    justify-content: center;
    overflow: hidden;
    font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Helvetica, Arial, sans-serif;
  }

  .canvas {
    width: 1080px;
    height: 1080px;
    position: relative;
    display: flex;
    flex-direction: column;
    align-items: center;
    justify-content: center;
    gap: 0;
  }

  /* Subtle top glow behind the emoji */
  .emoji-glow {
    position: absolute;
    top: 220px;
    left: 50%;
    transform: translateX(-50%);
    width: 300px;
    height: 300px;
    background: radial-gradient(circle, rgba(229, 83, 61, 0.10) 0%, transparent 65%);
    filter: blur(30px);
    pointer-events: none;
  }

  .logo {
    font-size: 120px;
    line-height: 1;
    margin-bottom: 48px;
    position: relative;
    z-index: 2;
  }

  .headline {
    font-size: 62px;
    font-weight: 800;
    color: #ffffff;
    text-align: center;
    line-height: 1.15;
    letter-spacing: -1.5px;
    margin-bottom: 28px;
    position: relative;
    z-index: 2;
  }

  .headline .accent {
    color: #4db6ac;
  }

  .subline {
    font-size: 30px;
    font-weight: 500;
    color: rgba(255, 255, 255, 0.6);
    text-align: center;
    line-height: 1.4;
    max-width: 700px;
    margin-bottom: 80px;
    position: relative;
    z-index: 2;
  }

  .subline .accent {
    color: #4db6ac;
    font-weight: 600;
  }

  .url {
    font-size: 22px;
    font-weight: 500;
    color: rgba(255, 255, 255, 0.28);
    letter-spacing: 1px;
    position: relative;
    z-index: 2;
  }

  /* Faint grain */
  .canvas::after {
    content: '';
    position: absolute;
    inset: 0;
    background-image: url("data:image/svg+xml,%3Csvg viewBox='0 0 256 256' xmlns='http://www.w3.org/2000/svg'%3E%3Cfilter id='noise'%3E%3CfeTurbulence type='fractalNoise' baseFrequency='0.9' numOctaves='4' stitchTiles='stitch'/%3E%3C/filter%3E%3Crect width='100%25' height='100%25' filter='url(%23noise)' opacity='0.025'/%3E%3C/svg%3E");
    background-size: 256px 256px;
    pointer-events: none;
    opacity: 0.5;
  }
</style>
</head>
<body>
  <div class="canvas">
    <div class="emoji-glow"></div>
    <div class="logo">&#x1F99E;</div>
    <div class="headline">Claim <span class="accent">free tokens</span><br>daily</div>
    <div class="subline"><span class="accent">Universal Basic Income</span> &mdash;<br>just connect your wallet</div>
    <div class="url">inclawbate.com/ubi</div>
  </div>
</body>
</html>
