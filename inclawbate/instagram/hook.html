<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Hook - Inclawbate Instagram</title>
<style>
  * { margin: 0; padding: 0; box-sizing: border-box; }

  body {
    width: 1080px;
    height: 1080px;
    background: #0a0a0f;
    display: flex;
    align-items: center;
    justify-content: center;
    overflow: hidden;
    font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Helvetica, Arial, sans-serif;
  }

  .canvas {
    width: 1080px;
    height: 1080px;
    position: relative;
    display: flex;
    align-items: center;
    justify-content: center;
  }

  /* Subtle red glow — layered radials */
  .glow {
    position: absolute;
    top: 50%;
    left: 50%;
    transform: translate(-50%, -50%);
    width: 700px;
    height: 350px;
    background: radial-gradient(ellipse at center, rgba(229, 83, 61, 0.18) 0%, rgba(229, 83, 61, 0.06) 40%, transparent 70%);
    filter: blur(40px);
    pointer-events: none;
  }

  .glow-core {
    position: absolute;
    top: 50%;
    left: 50%;
    transform: translate(-50%, -50%);
    width: 400px;
    height: 180px;
    background: radial-gradient(ellipse at center, rgba(229, 83, 61, 0.12) 0%, transparent 70%);
    filter: blur(20px);
    pointer-events: none;
  }

  .text-block {
    position: relative;
    z-index: 2;
    text-align: center;
    padding: 0 80px;
  }

  h1 {
    font-size: 82px;
    font-weight: 800;
    color: #ffffff;
    line-height: 1.15;
    letter-spacing: -2px;
    text-rendering: geometricPrecision;
  }

  /* Extremely faint noise texture via pseudo-element */
  .canvas::after {
    content: '';
    position: absolute;
    inset: 0;
    background-image: url("data:image/svg+xml,%3Csvg viewBox='0 0 256 256' xmlns='http://www.w3.org/2000/svg'%3E%3Cfilter id='noise'%3E%3CfeTurbulence type='fractalNoise' baseFrequency='0.9' numOctaves='4' stitchTiles='stitch'/%3E%3C/filter%3E%3Crect width='100%25' height='100%25' filter='url(%23noise)' opacity='0.025'/%3E%3C/svg%3E");
    background-size: 256px 256px;
    pointer-events: none;
    opacity: 0.5;
  }
</style>
</head>
<body>
  <div class="canvas">
    <div class="glow"></div>
    <div class="glow-core"></div>
    <div class="text-block">
      <h1>Free money.<br>Every day.<br>No catch.</h1>
    </div>
  </div>
</body>
</html>
