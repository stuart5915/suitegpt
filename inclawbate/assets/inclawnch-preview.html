<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>inCLAWNCH Token Logo Preview</title>
    <style>
        * { margin: 0; padding: 0; box-sizing: border-box; }

        body {
            background: #0a0a0f;
            min-height: 100vh;
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            font-family: 'Segoe UI', 'Helvetica Neue', Arial, sans-serif;
            color: #ccc;
        }

        h1 {
            margin-bottom: 8px;
            font-size: 24px;
            font-weight: 300;
            letter-spacing: 4px;
            color: #4db6ac;
        }

        .subtitle {
            font-size: 13px;
            color: #555;
            margin-bottom: 40px;
            letter-spacing: 2px;
        }

        .logo-container {
            display: flex;
            flex-direction: column;
            align-items: center;
            gap: 48px;
        }

        .size-row {
            display: flex;
            align-items: flex-end;
            gap: 48px;
        }

        .size-label {
            text-align: center;
            margin-top: 12px;
            font-size: 12px;
            color: #444;
            letter-spacing: 1px;
        }

        .preview-512 img {
            width: 512px;
            height: 512px;
        }

        .preview-256 img {
            width: 256px;
            height: 256px;
        }

        .preview-128 img {
            width: 128px;
            height: 128px;
        }

        .preview-64 img {
            width: 64px;
            height: 64px;
        }

        .preview-32 img {
            width: 32px;
            height: 32px;
        }

        .checkerboard {
            background-image:
                linear-gradient(45deg, #1a1a24 25%, transparent 25%),
                linear-gradient(-45deg, #1a1a24 25%, transparent 25%),
                linear-gradient(45deg, transparent 75%, #1a1a24 75%),
                linear-gradient(-45deg, transparent 75%, #1a1a24 75%);
            background-size: 20px 20px;
            background-position: 0 0, 0 10px, 10px -10px, -10px 0px;
            padding: 24px;
            border-radius: 12px;
            border: 1px solid #1a1a24;
        }

        .divider {
            width: 100%;
            max-width: 600px;
            height: 1px;
            background: linear-gradient(90deg, transparent, #4db6ac33, #e5533d33, transparent);
            margin: 20px 0;
        }
    </style>
</head>
<body>
    <h1>inCLAWNCH</h1>
    <p class="subtitle">YIELD-BEARING STAKING TOKEN</p>

    <div class="logo-container">
        <!-- Full size -->
        <div class="preview-512 checkerboard">
            <img src="inclawnch-logo.svg" alt="inCLAWNCH Token Logo - 512px">
        </div>
        <p class="size-label">512 x 512</p>

        <div class="divider"></div>

        <!-- Smaller sizes -->
        <div class="size-row">
            <div>
                <div class="preview-256 checkerboard">
                    <img src="inclawnch-logo.svg" alt="inCLAWNCH Token Logo - 256px">
                </div>
                <p class="size-label">256 x 256</p>
            </div>
            <div>
                <div class="preview-128 checkerboard">
                    <img src="inclawnch-logo.svg" alt="inCLAWNCH Token Logo - 128px">
                </div>
                <p class="size-label">128 x 128</p>
            </div>
            <div>
                <div class="preview-64 checkerboard">
                    <img src="inclawnch-logo.svg" alt="inCLAWNCH Token Logo - 64px">
                </div>
                <p class="size-label">64 x 64</p>
            </div>
            <div>
                <div class="preview-32 checkerboard">
                    <img src="inclawnch-logo.svg" alt="inCLAWNCH Token Logo - 32px">
                </div>
                <p class="size-label">32 x 32</p>
            </div>
        </div>
    </div>
</body>
</html>
