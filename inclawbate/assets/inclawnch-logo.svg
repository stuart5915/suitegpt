<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512" width="512" height="512">
  <defs>
    <!-- Main gradient: seafoam to lobster red -->
    <linearGradient id="mainGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#4db6ac"/>
      <stop offset="100%" stop-color="#e5533d"/>
    </linearGradient>

    <!-- Subtle glow gradient for the coin rim -->
    <radialGradient id="coinGlow" cx="50%" cy="40%" r="50%">
      <stop offset="0%" stop-color="#1a2a2e"/>
      <stop offset="70%" stop-color="#0d1117"/>
      <stop offset="100%" stop-color="#0a0a0f"/>
    </radialGradient>

    <!-- Orbital ring gradient -->
    <linearGradient id="orbitGrad" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#4db6ac" stop-opacity="0.6"/>
      <stop offset="50%" stop-color="#e5533d" stop-opacity="0.3"/>
      <stop offset="100%" stop-color="#4db6ac" stop-opacity="0.6"/>
    </linearGradient>

    <!-- Text gradient -->
    <linearGradient id="textGrad" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#4db6ac"/>
      <stop offset="100%" stop-color="#e5533d"/>
    </linearGradient>

    <!-- Claw gradient -->
    <linearGradient id="clawGrad" x1="20%" y1="0%" x2="80%" y2="100%">
      <stop offset="0%" stop-color="#e5533d"/>
      <stop offset="40%" stop-color="#e5533d"/>
      <stop offset="100%" stop-color="#4db6ac"/>
    </linearGradient>

    <!-- Yield arrow gradient -->
    <linearGradient id="arrowGrad" x1="0%" y1="100%" x2="0%" y2="0%">
      <stop offset="0%" stop-color="#4db6ac" stop-opacity="0.4"/>
      <stop offset="100%" stop-color="#4db6ac" stop-opacity="0.9"/>
    </linearGradient>

    <!-- Drop shadow for depth -->
    <filter id="coinShadow" x="-10%" y="-10%" width="120%" height="120%">
      <feDropShadow dx="0" dy="4" stdDeviation="8" flood-color="#000" flood-opacity="0.5"/>
    </filter>

    <!-- Inner glow on claw -->
    <filter id="clawGlow">
      <feGaussianBlur in="SourceGraphic" stdDeviation="3" result="blur"/>
      <feMerge>
        <feMergeNode in="blur"/>
        <feMergeNode in="SourceGraphic"/>
      </feMerge>
    </filter>
  </defs>

  <!-- === COIN BASE === -->

  <!-- Outer coin shadow ring -->
  <circle cx="256" cy="256" r="248" fill="none" stroke="#000" stroke-width="2" opacity="0.3" filter="url(#coinShadow)"/>

  <!-- Coin outer rim with gradient border -->
  <circle cx="256" cy="256" r="244" fill="none" stroke="url(#mainGrad)" stroke-width="4" opacity="0.8"/>

  <!-- Coin face background -->
  <circle cx="256" cy="256" r="240" fill="url(#coinGlow)"/>

  <!-- Inner decorative ring -->
  <circle cx="256" cy="256" r="224" fill="none" stroke="url(#mainGrad)" stroke-width="1.5" opacity="0.35"/>

  <!-- Subtle inner ring for coin depth -->
  <circle cx="256" cy="256" r="218" fill="none" stroke="url(#mainGrad)" stroke-width="0.5" opacity="0.15"/>

  <!-- === ORBITAL RINGS (yield/staking motif) === -->

  <!-- Outer orbit ellipse - tilted -->
  <ellipse cx="256" cy="256" rx="190" ry="60" fill="none" stroke="url(#orbitGrad)" stroke-width="1.2" transform="rotate(-25, 256, 256)" opacity="0.5" stroke-dasharray="6 4"/>

  <!-- Inner orbit ellipse - opposite tilt -->
  <ellipse cx="256" cy="256" rx="160" ry="45" fill="none" stroke="url(#orbitGrad)" stroke-width="1" transform="rotate(25, 256, 256)" opacity="0.35" stroke-dasharray="4 6"/>

  <!-- Small orbital dots -->
  <circle cx="108" cy="196" r="3.5" fill="#4db6ac" opacity="0.7"/>
  <circle cx="404" cy="316" r="3.5" fill="#e5533d" opacity="0.7"/>
  <circle cx="356" cy="148" r="2.5" fill="#4db6ac" opacity="0.5"/>
  <circle cx="156" cy="364" r="2.5" fill="#e5533d" opacity="0.5"/>

  <!-- === LOBSTER CLAW (central icon) === -->
  <g transform="translate(256, 215)" filter="url(#clawGlow)">
    <!-- Left pincer of claw -->
    <path d="
      M -8,0
      C -12,-20 -38,-55 -52,-68
      C -60,-75 -62,-78 -58,-84
      C -54,-90 -46,-88 -40,-82
      C -30,-72 -18,-50 -10,-30
      Z
    " fill="url(#clawGrad)" opacity="0.95"/>

    <!-- Right pincer of claw -->
    <path d="
      M 8,0
      C 12,-20 38,-55 52,-68
      C 60,-75 62,-78 58,-84
      C 54,-90 46,-88 40,-82
      C 30,-72 18,-50 10,-30
      Z
    " fill="url(#clawGrad)" opacity="0.95"/>

    <!-- Claw base / knuckle -->
    <path d="
      M -20,10
      C -24,0 -14,-12 -8,0
      L 8,0
      C 14,-12 24,0 20,10
      C 16,22 10,30 0,32
      C -10,30 -16,22 -20,10
      Z
    " fill="#e5533d" opacity="0.9"/>

    <!-- Claw joint segments -->
    <ellipse cx="0" cy="42" rx="14" ry="10" fill="#c9442e" opacity="0.8"/>
    <ellipse cx="0" cy="58" rx="11" ry="8" fill="#b33c28" opacity="0.7"/>

    <!-- Inner pincer detail lines -->
    <path d="M -6,-2 C -10,-18 -30,-48 -42,-62" fill="none" stroke="#ff7b6b" stroke-width="1" opacity="0.4"/>
    <path d="M 6,-2 C 10,-18 30,-48 42,-62" fill="none" stroke="#ff7b6b" stroke-width="1" opacity="0.4"/>

    <!-- Small highlight on left pincer tip -->
    <circle cx="-50" cy="-80" r="3" fill="#ff9a8b" opacity="0.3"/>
    <!-- Small highlight on right pincer tip -->
    <circle cx="50" cy="-80" r="3" fill="#ff9a8b" opacity="0.3"/>
  </g>

  <!-- === YIELD ARROWS (growth / staking motif) === -->

  <!-- Upward yield arrow - left -->
  <g transform="translate(168, 280)" opacity="0.55">
    <line x1="0" y1="30" x2="0" y2="0" stroke="url(#arrowGrad)" stroke-width="2" stroke-linecap="round"/>
    <polyline points="-6,8 0,0 6,8" fill="none" stroke="#4db6ac" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"/>
  </g>

  <!-- Upward yield arrow - right -->
  <g transform="translate(344, 280)" opacity="0.55">
    <line x1="0" y1="30" x2="0" y2="0" stroke="url(#arrowGrad)" stroke-width="2" stroke-linecap="round"/>
    <polyline points="-6,8 0,0 6,8" fill="none" stroke="#4db6ac" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"/>
  </g>

  <!-- Upward yield arrow - center (larger) -->
  <g transform="translate(256, 268)" opacity="0.4">
    <line x1="0" y1="35" x2="0" y2="0" stroke="url(#arrowGrad)" stroke-width="2.5" stroke-linecap="round"/>
    <polyline points="-7,9 0,0 7,9" fill="none" stroke="#4db6ac" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round"/>
  </g>

  <!-- === TEXT === -->

  <!-- "in" prefix - smaller, subtle -->
  <text x="177" y="370" font-family="'Segoe UI', 'Helvetica Neue', Arial, sans-serif" font-size="32" font-weight="400" fill="#4db6ac" opacity="0.6" letter-spacing="1">in</text>

  <!-- "CLAWNCH" - prominent -->
  <text x="207" y="370" font-family="'Segoe UI', 'Helvetica Neue', Arial, sans-serif" font-size="36" font-weight="700" fill="url(#textGrad)" letter-spacing="3">CLAWNCH</text>

  <!-- Subtle tagline -->
  <text x="256" y="398" font-family="'Segoe UI', 'Helvetica Neue', Arial, sans-serif" font-size="12" font-weight="400" fill="#4db6ac" opacity="0.35" text-anchor="middle" letter-spacing="4">YIELD TOKEN</text>

  <!-- === DECORATIVE CORNER NOTCHES (coin minting detail) === -->

  <!-- Top notch marks -->
  <line x1="256" y1="14" x2="256" y2="22" stroke="url(#mainGrad)" stroke-width="1.5" opacity="0.3"/>
  <line x1="236" y1="15" x2="238" y2="23" stroke="url(#mainGrad)" stroke-width="1" opacity="0.2"/>
  <line x1="276" y1="15" x2="274" y2="23" stroke="url(#mainGrad)" stroke-width="1" opacity="0.2"/>

  <!-- Bottom notch marks -->
  <line x1="256" y1="498" x2="256" y2="490" stroke="url(#mainGrad)" stroke-width="1.5" opacity="0.3"/>
  <line x1="236" y1="497" x2="238" y2="489" stroke="url(#mainGrad)" stroke-width="1" opacity="0.2"/>
  <line x1="276" y1="497" x2="274" y2="489" stroke="url(#mainGrad)" stroke-width="1" opacity="0.2"/>

  <!-- Left notch marks -->
  <line x1="14" y1="256" x2="22" y2="256" stroke="url(#mainGrad)" stroke-width="1.5" opacity="0.3"/>

  <!-- Right notch marks -->
  <line x1="498" y1="256" x2="490" y2="256" stroke="url(#mainGrad)" stroke-width="1.5" opacity="0.3"/>
</svg>