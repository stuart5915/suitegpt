<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 400 500" width="400" height="500">
  <!-- Transparent background — embroidery ready -->

  <!-- Lobster icon -->
  <g transform="translate(200, 180)">
    <!-- Left claw -->
    <path d="
      M -18,0
      C -24,-30 -58,-75 -76,-92
      C -86,-100 -90,-104 -84,-112
      C -78,-118 -68,-116 -60,-108
      C -46,-96 -28,-66 -16,-40
      Z
    " fill="#e5533d"/>

    <!-- Right claw -->
    <path d="
      M 18,0
      C 24,-30 58,-75 76,-92
      C 86,-100 90,-104 84,-112
      C 78,-118 68,-116 60,-108
      C 46,-96 28,-66 16,-40
      Z
    " fill="#e5533d"/>

    <!-- Left small pincer tip -->
    <path d="
      M -84,-112
      C -92,-118 -96,-110 -90,-104
      C -86,-100 -80,-106 -84,-112
      Z
    " fill="#c9442e"/>

    <!-- Right small pincer tip -->
    <path d="
      M 84,-112
      C 92,-118 96,-110 90,-104
      C 86,-100 80,-106 84,-112
      Z
    " fill="#c9442e"/>

    <!-- Body / head -->
    <ellipse cx="0" cy="10" rx="28" ry="22" fill="#e5533d"/>

    <!-- Body segment 1 -->
    <ellipse cx="0" cy="42" rx="22" ry="14" fill="#d4403a"/>

    <!-- Body segment 2 -->
    <ellipse cx="0" cy="64" rx="18" ry="12" fill="#c9442e"/>

    <!-- Body segment 3 (tail start) -->
    <ellipse cx="0" cy="84" rx="14" ry="10" fill="#b83c28"/>

    <!-- Tail fan -->
    <path d="
      M 0,94
      C -10,100 -22,118 -20,126
      C -18,132 -8,128 0,120
      C 8,128 18,132 20,126
      C 22,118 10,100 0,94
      Z
    " fill="#d4403a"/>

    <!-- Tail center fin -->
    <path d="
      M 0,94
      C -4,106 -6,120 0,128
      C 6,120 4,106 0,94
      Z
    " fill="#e5533d"/>

    <!-- Eyes -->
    <circle cx="-12" cy="-2" r="4" fill="#0a0a0f"/>
    <circle cx="12" cy="-2" r="4" fill="#0a0a0f"/>
    <circle cx="-11" cy="-3" r="1.5" fill="#fff" opacity="0.8"/>
    <circle cx="13" cy="-3" r="1.5" fill="#fff" opacity="0.8"/>

    <!-- Left leg 1 -->
    <line x1="-24" y1="20" x2="-44" y2="34" stroke="#c9442e" stroke-width="4" stroke-linecap="round"/>
    <!-- Left leg 2 -->
    <line x1="-22" y1="34" x2="-40" y2="50" stroke="#c9442e" stroke-width="4" stroke-linecap="round"/>
    <!-- Left leg 3 -->
    <line x1="-18" y1="48" x2="-36" y2="64" stroke="#c9442e" stroke-width="3.5" stroke-linecap="round"/>

    <!-- Right leg 1 -->
    <line x1="24" y1="20" x2="44" y2="34" stroke="#c9442e" stroke-width="4" stroke-linecap="round"/>
    <!-- Right leg 2 -->
    <line x1="22" y1="34" x2="40" y2="50" stroke="#c9442e" stroke-width="4" stroke-linecap="round"/>
    <!-- Right leg 3 -->
    <line x1="18" y1="48" x2="36" y2="64" stroke="#c9442e" stroke-width="3.5" stroke-linecap="round"/>

    <!-- Antennae -->
    <path d="M -8,-18 C -14,-40 -26,-58 -34,-66" fill="none" stroke="#e5533d" stroke-width="2.5" stroke-linecap="round"/>
    <path d="M 8,-18 C 14,-40 26,-58 34,-66" fill="none" stroke="#e5533d" stroke-width="2.5" stroke-linecap="round"/>
  </g>

  <!-- "inclawbate" text -->
  <text x="200" y="420" text-anchor="middle" font-family="'Nunito', 'Segoe UI', Arial, sans-serif" font-size="52" font-weight="800" letter-spacing="2" fill="#f0ece6">inclawbate</text>

  <!-- Subtle tagline -->
  <text x="200" y="460" text-anchor="middle" font-family="'Segoe UI', Arial, sans-serif" font-size="16" font-weight="400" letter-spacing="6" fill="#6b6560">THE AGENT-HUMAN ECONOMY</text>
</svg>
