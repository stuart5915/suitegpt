<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Welcome ClawnStrategy — Inclawbate</title>
<link href="https://fonts.googleapis.com/css2?family=Nunito:wght@400;600;700;800;900&family=JetBrains+Mono:wght@400;500;600&display=swap" rel="stylesheet">
<style>
  *, *::before, *::after { margin: 0; padding: 0; box-sizing: border-box; }

  :root {
    --bg-deepest: #06060b;
    --bg-surface: #0a0a11;
    --bg-card: #15151e;
    --border-subtle: hsl(240, 4%, 16%);
    --border-default: hsl(240, 3%, 22%);
    --text-primary: hsl(12, 8%, 92%);
    --text-secondary: hsl(12, 4%, 58%);
    --text-dim: hsl(12, 2%, 42%);
    --lobster-400: hsl(9, 52%, 56%);
    --seafoam-400: hsl(172, 32%, 48%);
    --clawnstr-red: hsl(0, 68%, 42%);
    --clawnstr-glow: hsla(0, 68%, 42%, 0.25);
    --font-display: 'Nunito', system-ui, sans-serif;
    --font-mono: 'JetBrains Mono', monospace;
  }

  body {
    background: var(--bg-deepest);
    color: var(--text-primary);
    font-family: var(--font-display);
    min-height: 100vh;
    display: flex;
    align-items: center;
    justify-content: center;
    overflow: hidden;
    position: relative;
  }

  /* ── Ambient background glows ── */
  body::before {
    content: '';
    position: fixed;
    top: -30%;
    left: -20%;
    width: 70%;
    height: 70%;
    background: radial-gradient(ellipse, hsla(0, 68%, 42%, 0.06) 0%, transparent 65%);
    pointer-events: none;
    animation: drift1 20s ease-in-out infinite;
  }
  body::after {
    content: '';
    position: fixed;
    bottom: -30%;
    right: -20%;
    width: 70%;
    height: 70%;
    background: radial-gradient(ellipse, hsla(9, 60%, 54%, 0.05) 0%, transparent 65%);
    pointer-events: none;
    animation: drift2 25s ease-in-out infinite;
  }
  @keyframes drift1 { 0%, 100% { transform: translate(0, 0); } 50% { transform: translate(40px, 30px); } }
  @keyframes drift2 { 0%, 100% { transform: translate(0, 0); } 50% { transform: translate(-30px, -40px); } }

  /* ── Grid pattern overlay ── */
  .grid-overlay {
    position: fixed;
    inset: 0;
    background-image:
      linear-gradient(hsla(240, 4%, 16%, 0.3) 1px, transparent 1px),
      linear-gradient(90deg, hsla(240, 4%, 16%, 0.3) 1px, transparent 1px);
    background-size: 60px 60px;
    mask-image: radial-gradient(ellipse 80% 60% at 50% 50%, black 20%, transparent 70%);
    pointer-events: none;
    z-index: 0;
  }

  /* ── Main card ── */
  .card {
    position: relative;
    z-index: 1;
    width: 720px;
    padding: 56px 48px 48px;
    text-align: center;
    background: linear-gradient(165deg, hsla(0, 68%, 42%, 0.04) 0%, var(--bg-surface) 30%, var(--bg-surface) 70%, hsla(9, 60%, 54%, 0.03) 100%);
    border: 1px solid var(--border-subtle);
    border-radius: 24px;
    box-shadow:
      0 0 80px hsla(0, 68%, 42%, 0.06),
      0 0 160px hsla(9, 60%, 54%, 0.03),
      0 24px 64px hsla(240, 10%, 3%, 0.6);
  }

  /* ── Top tag ── */
  .tag {
    display: inline-block;
    font-family: var(--font-mono);
    font-size: 0.68rem;
    font-weight: 600;
    letter-spacing: 0.12em;
    text-transform: uppercase;
    color: var(--seafoam-400);
    background: hsla(172, 32%, 48%, 0.08);
    border: 1px solid hsla(172, 32%, 48%, 0.2);
    border-radius: 999px;
    padding: 6px 18px;
    margin-bottom: 32px;
    animation: fadeUp 0.8s ease-out both;
  }

  /* ── Logos row ── */
  .logos {
    display: flex;
    align-items: center;
    justify-content: center;
    gap: 24px;
    margin-bottom: 36px;
    animation: fadeUp 0.8s 0.15s ease-out both;
  }
  .logo {
    width: 88px;
    height: 88px;
    border-radius: 50%;
    object-fit: cover;
    border: 2px solid var(--border-default);
  }
  .logo--inclawbate {
    box-shadow:
      0 0 16px hsla(9, 60%, 54%, 0.2),
      0 0 40px hsla(9, 60%, 54%, 0.1);
  }
  .logo--clawnstr {
    box-shadow:
      0 0 16px var(--clawnstr-glow),
      0 0 40px hsla(0, 68%, 42%, 0.12);
  }
  .handshake {
    font-size: 2rem;
    filter: grayscale(0.3);
    animation: pulse 3s ease-in-out infinite;
  }
  @keyframes pulse { 0%, 100% { transform: scale(1); opacity: 0.8; } 50% { transform: scale(1.12); opacity: 1; } }

  /* ── Headline ── */
  .headline {
    font-size: 2.2rem;
    font-weight: 900;
    line-height: 1.2;
    margin-bottom: 8px;
    animation: fadeUp 0.8s 0.3s ease-out both;
  }
  .headline .highlight {
    background: linear-gradient(135deg, hsl(0, 60%, 52%), hsl(0, 68%, 62%), hsl(15, 70%, 60%));
    -webkit-background-clip: text;
    -webkit-text-fill-color: transparent;
    background-clip: text;
  }

  .subline {
    font-size: 1rem;
    color: var(--text-secondary);
    margin-bottom: 36px;
    animation: fadeUp 0.8s 0.4s ease-out both;
  }

  /* ── Divider ── */
  .divider {
    height: 1px;
    background: linear-gradient(90deg, transparent, var(--border-subtle) 20%, hsla(0, 68%, 42%, 0.4) 50%, var(--border-subtle) 80%, transparent);
    margin-bottom: 32px;
    animation: fadeUp 0.8s 0.5s ease-out both;
  }

  /* ── Info row ── */
  .info-row {
    display: flex;
    gap: 16px;
    margin-bottom: 32px;
    animation: fadeUp 0.8s 0.55s ease-out both;
  }
  .info-card {
    flex: 1;
    background: var(--bg-card);
    border: 1px solid var(--border-subtle);
    border-radius: 14px;
    padding: 18px 16px;
    text-align: center;
  }
  .info-label {
    font-family: var(--font-mono);
    font-size: 0.62rem;
    font-weight: 600;
    letter-spacing: 0.08em;
    text-transform: uppercase;
    color: var(--text-dim);
    margin-bottom: 8px;
  }
  .info-value {
    font-family: var(--font-mono);
    font-size: 0.78rem;
    font-weight: 600;
    color: var(--text-primary);
    word-break: break-all;
  }
  .info-value--accent { color: var(--seafoam-400); }

  /* ── CTA area ── */
  .cta {
    animation: fadeUp 0.8s 0.65s ease-out both;
  }
  .cta-link {
    display: inline-block;
    font-family: var(--font-mono);
    font-size: 0.8rem;
    font-weight: 600;
    color: var(--text-primary);
    background: linear-gradient(135deg, hsla(0, 68%, 42%, 0.15), hsla(9, 52%, 56%, 0.1));
    border: 1px solid hsla(0, 68%, 42%, 0.3);
    border-radius: 999px;
    padding: 14px 36px;
    text-decoration: none;
    transition: all 0.3s;
    letter-spacing: 0.02em;
  }
  .cta-link:hover {
    border-color: hsla(0, 68%, 42%, 0.6);
    box-shadow: 0 0 24px var(--clawnstr-glow);
    transform: translateY(-2px);
  }

  /* ── Footer branding ── */
  .footer {
    margin-top: 28px;
    animation: fadeUp 0.8s 0.75s ease-out both;
  }
  .footer-text {
    font-family: var(--font-mono);
    font-size: 0.62rem;
    color: var(--text-dim);
    letter-spacing: 0.06em;
  }
  .footer-text span {
    color: var(--lobster-400);
  }

  /* ── Chain badge ── */
  .chain-badge {
    display: inline-flex;
    align-items: center;
    gap: 6px;
    font-family: var(--font-mono);
    font-size: 0.68rem;
    font-weight: 600;
    color: hsl(220, 60%, 65%);
    background: hsla(220, 60%, 55%, 0.08);
    border: 1px solid hsla(220, 60%, 55%, 0.18);
    border-radius: 999px;
    padding: 5px 14px;
    margin-bottom: 28px;
    animation: fadeUp 0.8s 0.48s ease-out both;
  }
  .chain-badge svg {
    width: 14px;
    height: 14px;
  }

  @keyframes fadeUp {
    from { opacity: 0; transform: translateY(16px); }
    to { opacity: 1; transform: translateY(0); }
  }
</style>
</head>
<body>

<div class="grid-overlay"></div>

<div class="card">
  <div class="tag">New Partner Pool</div>

  <div class="logos">
    <img src="assets/inclawnch-logo.png" alt="Inclawbate" class="logo logo--inclawbate">
    <div class="handshake">&times;</div>
    <img src="assets/clawnstr-logo.jpg" alt="ClawnStrategy" class="logo logo--clawnstr">
  </div>

  <h1 class="headline">Welcome <span class="highlight">ClawnStrategy</span></h1>
  <p class="subline">The first partner staking pool is live on Inclawbate.</p>

  <div class="chain-badge">
    <svg viewBox="0 0 24 24" fill="currentColor"><circle cx="12" cy="12" r="10" fill="none" stroke="currentColor" stroke-width="2"/><path d="M12 6v6l4 2" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round"/></svg>
    On-chain on Base
  </div>

  <div class="divider"></div>

  <div class="info-row">
    <div class="info-card">
      <div class="info-label">Token</div>
      <div class="info-value">$CLAWNSTR</div>
    </div>
    <div class="info-card">
      <div class="info-label">Type</div>
      <div class="info-value">Stake &amp; Earn</div>
    </div>
    <div class="info-card">
      <div class="info-label">Network</div>
      <div class="info-value info-value--accent">Base L2</div>
    </div>
  </div>

  <div class="cta">
    <a href="https://inclawbate.com/stake/clawnstr" class="cta-link">inclawbate.com/stake/clawnstr</a>
  </div>

  <div class="footer">
    <div class="footer-text">Powered by <span>Inclawbate</span> Staking-as-a-Service</div>
  </div>
</div>

</body>
</html>
