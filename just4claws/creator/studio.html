<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <script>document.write('<base href="'+(location.hostname.includes('just4claws')?'/':'/j4c/')+'">')</script>
    <title>AI Studio | Just4Claws</title>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700;800;900&family=Playfair+Display:ital,wght@0,400;0,700;1,400&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="styles/core.css">
    <link rel="stylesheet" href="styles/nav.css">
    <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2/dist/umd/supabase.min.js"></script>
    <style>
        .studio-layout {
            display: grid; grid-template-columns: 1fr 1fr; gap: 24px;
        }
        .studio-panel {
            background: var(--bg-card); border: 1px solid var(--border);
            border-radius: var(--radius-lg); padding: 24px;
        }
        .studio-panel h3 {
            font-size: 16px; font-weight: 700; color: var(--text-bright);
            margin-bottom: 16px;
        }
        .style-presets {
            display: flex; gap: 8px; flex-wrap: wrap; margin-bottom: 16px;
        }
        .style-preset {
            padding: 6px 14px; border-radius: 100px; font-size: 13px;
            background: rgba(255,255,255,0.04); color: var(--text);
            border: 1px solid var(--border); cursor: pointer;
            transition: all 0.3s; font-family: var(--font-body);
        }
        .style-preset:hover, .style-preset.active {
            background: rgba(232, 67, 147, 0.1); color: var(--pink-bright);
            border-color: rgba(232, 67, 147, 0.25);
        }
        .preview-area {
            aspect-ratio: 1; border-radius: var(--radius);
            background: var(--bg-input); border: 1px dashed var(--border);
            display: flex; align-items: center; justify-content: center;
            overflow: hidden; position: relative;
        }
        .preview-area img {
            width: 100%; height: 100%; object-fit: cover;
        }
        .preview-placeholder {
            text-align: center; color: var(--text-dim);
        }
        .preview-placeholder .icon { font-size: 48px; margin-bottom: 12px; }
        .preview-placeholder p { font-size: 14px; }
        .preview-actions {
            display: flex; gap: 8px; margin-top: 12px;
        }
        .generating-overlay {
            position: absolute; inset: 0;
            background: rgba(8, 6, 12, 0.85);
            display: flex; flex-direction: column;
            align-items: center; justify-content: center; gap: 16px;
        }
        .generating-overlay p {
            color: var(--text-bright); font-size: 14px; font-weight: 600;
        }
        .prompt-counter {
            text-align: right; font-size: 12px; color: var(--text-dim); margin-top: 4px;
        }
        .prompt-suggestions {
            display: flex; gap: 6px; flex-wrap: wrap;
        }
        .prompt-chip {
            padding: 5px 12px; border-radius: 100px; font-size: 12px;
            background: rgba(232, 67, 147, 0.08); color: var(--pink-bright);
            border: 1px solid rgba(232, 67, 147, 0.15); cursor: pointer;
            transition: all 0.2s; font-family: var(--font-body); white-space: nowrap;
        }
        .prompt-chip:hover {
            background: rgba(232, 67, 147, 0.15); border-color: rgba(232, 67, 147, 0.3);
        }
        .toggle-track {
            position:absolute;inset:0;border-radius:11px;cursor:pointer;
            background:rgba(255,255,255,0.1);border:1px solid var(--border);
            transition:all 0.3s;
        }
        .toggle-track::after {
            content:'';position:absolute;top:2px;left:2px;width:16px;height:16px;
            border-radius:50%;background:#fff;transition:all 0.3s;
        }
        .toggle-track.on {
            background:rgba(232,67,147,0.4);border-color:rgba(232,67,147,0.6);
        }
        .toggle-track.on::after { transform:translateX(18px); }
        .drafts-section { margin-top: 40px; }
        .drafts-section h3 {
            font-size: 18px; font-weight: 700; color: var(--text-bright);
            margin-bottom: 16px;
        }
        @media (max-width: 768px) {
            .studio-layout { grid-template-columns: 1fr; }
        }
    </style>
</head>
<body>
    <div class="atmo-top"></div>

    <div class="page-container">
        <div class="page-header">
            <h1>AI Studio</h1>
            <p>Generate AI content for your subscribers</p>
        </div>

        <div class="studio-layout">
            <!-- Left: Controls -->
            <div class="studio-panel">
                <h3>Create Content</h3>

                <div class="form-group">
                    <label class="form-label">Quick Ideas</label>
                    <div class="prompt-suggestions" id="prompt-suggestions"></div>
                </div>

                <div class="form-group">
                    <label class="form-label">Prompt</label>
                    <textarea class="textarea" id="gen-prompt" rows="4" placeholder="Describe what you want to generate..." maxlength="500" oninput="updateCounter()"></textarea>
                    <div class="prompt-counter"><span id="char-count">0</span>/500</div>
                </div>

                <div class="form-group">
                    <label class="form-label">Style</label>
                    <div class="style-presets">
                        <button class="style-preset active" onclick="setStyle(this, 'realistic')">Realistic</button>
                        <button class="style-preset" onclick="setStyle(this, 'anime')">Anime</button>
                        <button class="style-preset" onclick="setStyle(this, 'fantasy')">Fantasy</button>
                        <button class="style-preset" onclick="setStyle(this, 'artistic')">Artistic</button>
                        <button class="style-preset" onclick="setStyle(this, 'cyberpunk')">Cyberpunk</button>
                    </div>
                </div>

                <div class="form-group">
                    <label class="form-label">Model</label>
                    <select class="select" id="gen-model">
                        <option value="fast">FLUX Fast (1 credit, ~5s)</option>
                        <option value="flux">FLUX HD (3 credits, ~30s-2min)</option>
                    </select>
                </div>

                <div class="form-group">
                    <div class="form-label" style="display:flex;align-items:center;gap:10px;cursor:pointer" onclick="toggleExplicit()">
                        Explicit Mode
                        <div style="position:relative;width:40px;height:22px">
                            <div class="toggle-track" id="toggle-track"></div>
                        </div>
                        <span id="explicit-label" style="font-size:12px;color:var(--text-dim)">OFF</span>
                    </div>
                    <p style="font-size:11px;color:var(--text-dim);margin-top:4px">Adds NSFW/nude modifiers to your prompt</p>
                </div>

                <button class="btn btn-primary btn-block btn-lg" id="gen-btn" onclick="generate()">
                    Generate
                </button>
            </div>

            <!-- Right: Preview -->
            <div class="studio-panel">
                <h3>Preview</h3>
                <div class="preview-area" id="preview-area">
                    <div class="preview-placeholder" id="preview-placeholder">
                        <div class="icon">&#x1F3A8;</div>
                        <p>Your generated content will appear here</p>
                    </div>
                </div>
                <div class="preview-actions" id="preview-actions" style="display:none">
                    <button class="btn btn-primary" onclick="saveToDrafts()">Save to Drafts</button>
                    <button class="btn btn-secondary" onclick="generate()">Regenerate</button>
                </div>
            </div>
        </div>

        <!-- Drafts -->
        <div class="drafts-section">
            <h3>Your Drafts</h3>
            <div class="content-grid" id="drafts-grid">
                <div class="loading-spinner"></div>
            </div>
            <div class="empty-state" id="drafts-empty" style="display:none">
                <p>No drafts yet. Generate some content above!</p>
            </div>
        </div>
    </div>

    <script src="js/supabase-init.js"></script>
    <script src="js/nav.js"></script>
    <script>
        let currentStyle = 'realistic';
        let currentImageUrl = null;
        let explicitMode = false;

        function toggleExplicit() {
            explicitMode = !explicitMode;
            const track = document.getElementById('toggle-track');
            const label = document.getElementById('explicit-label');
            track.classList.toggle('on', explicitMode);
            label.textContent = explicitMode ? 'ON' : 'OFF';
            label.style.color = explicitMode ? 'var(--pink-bright)' : 'var(--text-dim)';
        }

        const SUGGESTIONS = [
            'sexy woman in red lingerie, bedroom, seductive pose',
            'nude woman lying on silk sheets, soft lighting, elegant',
            'busty blonde in lace bra, mirror selfie, bedroom',
            'athletic woman in tiny bikini, poolside, wet skin, sun',
            'curvy brunette in sheer bodysuit, neon lights',
            'naked woman in bathtub, candles, steam, romantic',
            'redhead in stockings and garter belt, boudoir',
            'woman in leather corset, dark room, dominant pose',
            'topless woman on beach at sunset, wind in hair',
            'latina woman in thong, bent over, looking back',
            'asian woman in schoolgirl skirt, flirty pose',
            'fitness model flexing, sports bra, sweaty, gym',
            'woman in wet white t-shirt, rain, see-through',
            'two women kissing, lingerie, bed, passionate',
            'woman straddling chair, naked, tattoos, edgy',
            'blonde in tiny french maid outfit, playful',
            'woman in shower, glass door, steam, nude',
            'goth girl in fishnets, dark makeup, chains',
            'milf in silk robe, open, wine glass, couch',
            'cheerleader outfit, no underwear, locker room',
            'nurse costume, unbuttoned, stethoscope, heels',
            'secretary bent over desk, skirt lifted, office',
            'woman riding mechanical bull, denim shorts, rodeo',
            'yoga pose, naked, flexible, studio lighting',
        ];

        // Render random subset of suggestions
        function renderSuggestions() {
            const el = document.getElementById('prompt-suggestions');
            const shuffled = SUGGESTIONS.sort(() => Math.random() - 0.5).slice(0, 8);
            el.innerHTML = shuffled.map(s =>
                `<button class="prompt-chip" onclick="usePrompt(this)">${s.length > 40 ? s.slice(0, 40) + '…' : s}</button>`
            ).join('') + `<button class="prompt-chip" onclick="renderSuggestions()" style="background:rgba(255,255,255,0.04);color:var(--text-dim);border-color:var(--border)">↻ More</button>`;
            // Store full prompts as data attributes
            el.querySelectorAll('.prompt-chip:not(:last-child)').forEach((btn, i) => {
                btn.dataset.prompt = shuffled[i];
            });
        }

        function usePrompt(btn) {
            const prompt = btn.dataset.prompt || btn.textContent;
            document.getElementById('gen-prompt').value = prompt;
            updateCounter();
        }

        renderSuggestions();

        // Load drafts if wallet connected
        initAuth({ requireAuth: false }).then(() => {
            if (j4c.wallet) loadDrafts();
            else document.getElementById('drafts-grid').innerHTML = '';
        });

        function updateCounter() {
            document.getElementById('char-count').textContent = document.getElementById('gen-prompt').value.length;
        }

        function setStyle(el, style) {
            currentStyle = style;
            document.querySelectorAll('.style-preset').forEach(s => s.classList.remove('active'));
            el.classList.add('active');
        }

        async function generate() {
            const prompt = document.getElementById('gen-prompt').value.trim();
            if (!prompt) { showToast('Please enter a prompt', 'error'); return; }

            const btn = document.getElementById('gen-btn');
            btn.disabled = true;
            btn.textContent = 'Submitting...';

            const preview = document.getElementById('preview-area');
            preview.innerHTML = `
                <div class="generating-overlay">
                    <div class="loading-spinner"></div>
                    <p id="gen-status">Submitting...</p>
                </div>
            `;

            try {
                const model = document.getElementById('gen-model').value;
                const res = await fetch(J4C_BASE + '/api/generate', {
                    method: 'POST',
                    headers: { 'Content-Type': 'application/json' },
                    body: JSON.stringify({ prompt, style: currentStyle, model, explicit: explicitMode })
                });
                const data = await res.json();

                if (data.error) { showErr(preview, btn, data.error); return; }

                let imageUrl;

                if (data.status === 'COMPLETED' && data.image_url) {
                    // Instant result
                    imageUrl = data.image_url;
                } else if (data.status === 'PROCESSING' && data.fetch_url) {
                    // Need to poll
                    btn.textContent = 'Generating...';
                    imageUrl = await pollJob(data.fetch_url);
                } else {
                    showErr(preview, btn, 'Unexpected response'); return;
                }

                currentImageUrl = imageUrl;
                preview.innerHTML = `<img src="${imageUrl}" alt="Generated content">`;
                document.getElementById('preview-actions').style.display = 'flex';
                showToast('Image generated!', 'success');
            } catch (err) {
                showErr(preview, btn, err.message);
                return;
            }

            btn.disabled = false;
            btn.textContent = 'Generate';
        }

        function showErr(preview, btn, msg) {
            showToast(msg, 'error');
            preview.innerHTML = `<div class="preview-placeholder"><div class="icon">&#x26A0;</div><p>${msg}</p></div>`;
            btn.disabled = false;
            btn.textContent = 'Generate';
        }

        async function pollJob(fetchUrl) {
            for (let i = 0; i < 150; i++) { // 150 x 2s = 5 min max
                await new Promise(r => setTimeout(r, 2000));
                const el = document.getElementById('gen-status');
                if (el) {
                    const secs = i * 2;
                    if (secs < 20) el.textContent = 'Generating image...';
                    else if (secs < 60) el.textContent = `Rendering... (${secs}s)`;
                    else el.textContent = `Almost done... (${secs}s)`;
                }
                const r = await fetch(J4C_BASE + `/api/status?fetch_url=${encodeURIComponent(fetchUrl)}`);
                const d = await r.json();
                if (d.status === 'FAILED') throw new Error(d.error || 'Generation failed');
                if (d.status === 'COMPLETED') {
                    if (d.image_url) return d.image_url;
                    throw new Error(d.error || 'No image returned');
                }
            }
            throw new Error('Timed out after 5 minutes. Try again or use SDXL Fast model.');
        }

        async function saveToDrafts() {
            if (!currentImageUrl) return;
            if (!j4c.wallet) {
                showToast('Connect wallet to save drafts', 'error');
                return;
            }

            const { error } = await supabase.from('j4c_content').insert({
                creator_id: j4c.wallet,
                image_url: currentImageUrl,
                thumbnail_url: currentImageUrl,
                generation_prompt: document.getElementById('gen-prompt').value,
                generation_model: document.getElementById('gen-model').value,
                is_published: false,
                is_gated: true
            });

            if (error) {
                showToast('Failed to save draft', 'error');
                return;
            }

            showToast('Saved to drafts!', 'success');
            currentImageUrl = null;
            document.getElementById('preview-actions').style.display = 'none';
            loadDrafts();
        }

        async function loadDrafts() {
            const grid = document.getElementById('drafts-grid');

            const { data: drafts } = await supabase
                .from('j4c_content')
                .select('*')
                .eq('creator_id', j4c.wallet)
                .eq('is_published', false)
                .order('created_at', { ascending: false });

            if (!drafts || drafts.length === 0) {
                grid.innerHTML = '';
                document.getElementById('drafts-empty').style.display = 'block';
                return;
            }

            document.getElementById('drafts-empty').style.display = 'none';
            grid.innerHTML = drafts.map(d => `
                <div class="content-item">
                    ${d.thumbnail_url || d.image_url
                        ? `<img src="${d.thumbnail_url || d.image_url}" alt="">`
                        : `<div style="width:100%;height:100%;background:linear-gradient(135deg,#2d1035,var(--pink))"></div>`
                    }
                    <div class="content-overlay">
                        <button class="btn btn-sm btn-primary" onclick="publishDraft('${d.id}')" style="font-size:11px;padding:4px 10px">Publish</button>
                        <button class="btn btn-sm btn-danger" onclick="deleteDraft('${d.id}')" style="font-size:11px;padding:4px 10px;margin-left:4px">Delete</button>
                    </div>
                </div>
            `).join('');
        }

        async function publishDraft(id) {
            await supabase.from('j4c_content')
                .update({ is_published: true, published_at: new Date().toISOString() })
                .eq('id', id);
            showToast('Published!', 'success');
            loadDrafts();
        }

        async function deleteDraft(id) {
            await supabase.from('j4c_content').delete().eq('id', id);
            showToast('Draft deleted', '');
            loadDrafts();
        }
    </script>
</body>
</html>
