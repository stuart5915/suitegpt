<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>AI Studio | Just4Claws</title>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700;800;900&family=Playfair+Display:ital,wght@0,400;0,700;1,400&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="/styles/core.css">
    <link rel="stylesheet" href="/styles/nav.css">
    <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2/dist/umd/supabase.min.js"></script>
    <style>
        .studio-layout {
            display: grid; grid-template-columns: 1fr 1fr; gap: 24px;
        }
        .studio-panel {
            background: var(--bg-card); border: 1px solid var(--border);
            border-radius: var(--radius-lg); padding: 24px;
        }
        .studio-panel h3 {
            font-size: 16px; font-weight: 700; color: var(--text-bright);
            margin-bottom: 16px;
        }
        .style-presets {
            display: flex; gap: 8px; flex-wrap: wrap; margin-bottom: 16px;
        }
        .style-preset {
            padding: 6px 14px; border-radius: 100px; font-size: 13px;
            background: rgba(255,255,255,0.04); color: var(--text);
            border: 1px solid var(--border); cursor: pointer;
            transition: all 0.3s; font-family: var(--font-body);
        }
        .style-preset:hover, .style-preset.active {
            background: rgba(232, 67, 147, 0.1); color: var(--pink-bright);
            border-color: rgba(232, 67, 147, 0.25);
        }
        .preview-area {
            aspect-ratio: 1; border-radius: var(--radius);
            background: var(--bg-input); border: 1px dashed var(--border);
            display: flex; align-items: center; justify-content: center;
            overflow: hidden; position: relative;
        }
        .preview-area img {
            width: 100%; height: 100%; object-fit: cover;
        }
        .preview-placeholder {
            text-align: center; color: var(--text-dim);
        }
        .preview-placeholder .icon { font-size: 48px; margin-bottom: 12px; }
        .preview-placeholder p { font-size: 14px; }
        .preview-actions {
            display: flex; gap: 8px; margin-top: 12px;
        }
        .generating-overlay {
            position: absolute; inset: 0;
            background: rgba(8, 6, 12, 0.85);
            display: flex; flex-direction: column;
            align-items: center; justify-content: center; gap: 16px;
        }
        .generating-overlay p {
            color: var(--text-bright); font-size: 14px; font-weight: 600;
        }
        .prompt-counter {
            text-align: right; font-size: 12px; color: var(--text-dim); margin-top: 4px;
        }
        .drafts-section { margin-top: 40px; }
        .drafts-section h3 {
            font-size: 18px; font-weight: 700; color: var(--text-bright);
            margin-bottom: 16px;
        }
        @media (max-width: 768px) {
            .studio-layout { grid-template-columns: 1fr; }
        }
    </style>
</head>
<body>
    <div class="atmo-top"></div>

    <div class="page-container">
        <div class="page-header">
            <h1>AI Studio</h1>
            <p>Generate AI content for your subscribers</p>
        </div>

        <div class="studio-layout">
            <!-- Left: Controls -->
            <div class="studio-panel">
                <h3>Create Content</h3>

                <div class="form-group">
                    <label class="form-label">Prompt</label>
                    <textarea class="textarea" id="gen-prompt" rows="4" placeholder="Describe the character or scene you want to generate..." maxlength="500" oninput="updateCounter()"></textarea>
                    <div class="prompt-counter"><span id="char-count">0</span>/500</div>
                </div>

                <div class="form-group">
                    <label class="form-label">Style</label>
                    <div class="style-presets">
                        <button class="style-preset active" onclick="setStyle(this, 'realistic')">Realistic</button>
                        <button class="style-preset" onclick="setStyle(this, 'anime')">Anime</button>
                        <button class="style-preset" onclick="setStyle(this, 'fantasy')">Fantasy</button>
                        <button class="style-preset" onclick="setStyle(this, 'artistic')">Artistic</button>
                        <button class="style-preset" onclick="setStyle(this, 'cyberpunk')">Cyberpunk</button>
                    </div>
                </div>

                <div class="form-group">
                    <label class="form-label">Model</label>
                    <select class="select" id="gen-model">
                        <option value="flux">Flux (Recommended)</option>
                        <option value="dalle">DALL-E 3</option>
                    </select>
                </div>

                <button class="btn btn-primary btn-block btn-lg" id="gen-btn" onclick="generate()">
                    Generate
                </button>
            </div>

            <!-- Right: Preview -->
            <div class="studio-panel">
                <h3>Preview</h3>
                <div class="preview-area" id="preview-area">
                    <div class="preview-placeholder" id="preview-placeholder">
                        <div class="icon">&#x1F3A8;</div>
                        <p>Your generated content will appear here</p>
                    </div>
                </div>
                <div class="preview-actions" id="preview-actions" style="display:none">
                    <button class="btn btn-primary" onclick="saveToDrafts()">Save to Drafts</button>
                    <button class="btn btn-secondary" onclick="generate()">Regenerate</button>
                </div>
            </div>
        </div>

        <!-- Drafts -->
        <div class="drafts-section">
            <h3>Your Drafts</h3>
            <div class="content-grid" id="drafts-grid">
                <div class="loading-spinner"></div>
            </div>
            <div class="empty-state" id="drafts-empty" style="display:none">
                <p>No drafts yet. Generate some content above!</p>
            </div>
        </div>
    </div>

    <script src="/js/supabase-init.js"></script>
    <script src="/js/nav.js"></script>
    <script>
        let currentStyle = 'realistic';
        let currentImageUrl = null;

        (async () => {
            const profile = await initAuth();
            if (!profile || !['creator', 'creator_pro'].includes(profile.role)) {
                window.location.href = '/app';
                return;
            }
            loadDrafts();
        })();

        function updateCounter() {
            document.getElementById('char-count').textContent = document.getElementById('gen-prompt').value.length;
        }

        function setStyle(el, style) {
            currentStyle = style;
            document.querySelectorAll('.style-preset').forEach(s => s.classList.remove('active'));
            el.classList.add('active');
        }

        async function generate() {
            const prompt = document.getElementById('gen-prompt').value.trim();
            if (!prompt) {
                showToast('Please enter a prompt', 'error');
                return;
            }

            const btn = document.getElementById('gen-btn');
            btn.disabled = true;
            btn.textContent = 'Generating...';

            const preview = document.getElementById('preview-area');
            preview.innerHTML = `
                <div class="generating-overlay">
                    <div class="loading-spinner"></div>
                    <p>Generating your content...</p>
                </div>
            `;

            try {
                const res = await fetch('/api/just4claws/generate', {
                    method: 'POST',
                    headers: { 'Content-Type': 'application/json' },
                    body: JSON.stringify({
                        prompt,
                        style: currentStyle,
                        model: document.getElementById('gen-model').value,
                        user_id: j4c.profile.id
                    })
                });

                const data = await res.json();

                if (data.error) {
                    showToast(data.error, 'error');
                    preview.innerHTML = `<div class="preview-placeholder"><div class="icon">&#x26A0;</div><p>${data.error}</p></div>`;
                } else {
                    currentImageUrl = data.image_url;
                    preview.innerHTML = `<img src="${data.image_url}" alt="Generated content">`;
                    document.getElementById('preview-actions').style.display = 'flex';
                }
            } catch (err) {
                showToast('Generation failed. Try again.', 'error');
                preview.innerHTML = `<div class="preview-placeholder"><div class="icon">&#x26A0;</div><p>Generation failed</p></div>`;
            }

            btn.disabled = false;
            btn.textContent = 'Generate';
        }

        async function saveToDrafts() {
            if (!currentImageUrl) return;

            const { error } = await supabase.from('j4c_content').insert({
                creator_id: j4c.profile.id,
                image_url: currentImageUrl,
                thumbnail_url: currentImageUrl,
                generation_prompt: document.getElementById('gen-prompt').value,
                generation_model: document.getElementById('gen-model').value,
                is_published: false,
                is_gated: true
            });

            if (error) {
                showToast('Failed to save draft', 'error');
                return;
            }

            showToast('Saved to drafts!', 'success');
            currentImageUrl = null;
            document.getElementById('preview-actions').style.display = 'none';
            loadDrafts();
        }

        async function loadDrafts() {
            const grid = document.getElementById('drafts-grid');

            const { data: drafts } = await supabase
                .from('j4c_content')
                .select('*')
                .eq('creator_id', j4c.profile.id)
                .eq('is_published', false)
                .order('created_at', { ascending: false });

            if (!drafts || drafts.length === 0) {
                grid.innerHTML = '';
                document.getElementById('drafts-empty').style.display = 'block';
                return;
            }

            document.getElementById('drafts-empty').style.display = 'none';
            grid.innerHTML = drafts.map(d => `
                <div class="content-item">
                    ${d.thumbnail_url || d.image_url
                        ? `<img src="${d.thumbnail_url || d.image_url}" alt="">`
                        : `<div style="width:100%;height:100%;background:linear-gradient(135deg,#2d1035,var(--pink))"></div>`
                    }
                    <div class="content-overlay">
                        <button class="btn btn-sm btn-primary" onclick="publishDraft('${d.id}')" style="font-size:11px;padding:4px 10px">Publish</button>
                        <button class="btn btn-sm btn-danger" onclick="deleteDraft('${d.id}')" style="font-size:11px;padding:4px 10px;margin-left:4px">Delete</button>
                    </div>
                </div>
            `).join('');
        }

        async function publishDraft(id) {
            await supabase.from('j4c_content')
                .update({ is_published: true, published_at: new Date().toISOString() })
                .eq('id', id);
            showToast('Published!', 'success');
            loadDrafts();
        }

        async function deleteDraft(id) {
            await supabase.from('j4c_content').delete().eq('id', id);
            showToast('Draft deleted', '');
            loadDrafts();
        }
    </script>
</body>
</html>
