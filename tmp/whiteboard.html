<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, user-scalable=no">
<title>Whiteboard — Inclawbate</title>
<link href="https://fonts.googleapis.com/css2?family=Nunito:wght@400;600;700;800&display=swap" rel="stylesheet">
<style>
*{margin:0;padding:0;box-sizing:border-box}
body{background:#0a0a0f;color:#e2e8f0;font-family:'Nunito',sans-serif;overflow:hidden;height:100vh;display:flex;flex-direction:column}
.toolbar{display:flex;align-items:center;gap:8px;padding:8px 12px;background:#111118;border-bottom:1px solid #1e1e2e;flex-wrap:wrap;z-index:10}
.toolbar-group{display:flex;align-items:center;gap:4px}
.toolbar-divider{width:1px;height:24px;background:#2a2a3a;margin:0 4px}
.tool-btn{background:#1a1a2e;border:2px solid #2a2a3a;border-radius:8px;color:#a0a0b0;padding:6px 10px;cursor:pointer;font-family:inherit;font-size:0.75rem;font-weight:700;transition:all 0.15s;display:flex;align-items:center;gap:4px}
.tool-btn:hover{border-color:#6366f1;color:#c0c0d0}
.tool-btn.active{background:#6366f1;border-color:#6366f1;color:#fff}
.tool-btn svg{width:16px;height:16px}
.color-swatch{width:24px;height:24px;border-radius:50%;border:2px solid transparent;cursor:pointer;transition:all 0.15s;flex-shrink:0}
.color-swatch:hover{transform:scale(1.15)}
.color-swatch.active{border-color:#fff;box-shadow:0 0 8px rgba(255,255,255,0.3)}
.size-slider{-webkit-appearance:none;width:80px;height:4px;background:#2a2a3a;border-radius:2px;outline:none}
.size-slider::-webkit-slider-thumb{-webkit-appearance:none;width:14px;height:14px;background:#6366f1;border-radius:50%;cursor:pointer}
.size-label{font-size:0.7rem;color:#888;font-weight:600;min-width:24px;text-align:center}
.canvas-wrap{flex:1;position:relative;overflow:hidden;background:#0a0a0f}
canvas{display:block;cursor:crosshair;touch-action:none}
.footer{text-align:center;padding:6px;font-size:0.7rem;color:#555;background:#111118;border-top:1px solid #1e1e2e}
.footer span{color:#6366f1}
.toast{position:fixed;top:16px;left:50%;transform:translateX(-50%) translateY(-80px);background:#1a1a2e;border:1px solid #6366f1;color:#e2e8f0;padding:8px 20px;border-radius:8px;font-size:0.8rem;font-weight:600;transition:transform 0.3s ease;z-index:100;pointer-events:none}
.toast.show{transform:translateX(-50%) translateY(0)}
@media(max-width:600px){
.toolbar{gap:4px;padding:6px 8px}
.tool-btn{padding:5px 7px;font-size:0.65rem}
.tool-btn .btn-label{display:none}
.size-slider{width:50px}
.toolbar-divider{margin:0 2px}
}
</style>
</head>
<body>
<div class="toolbar">
  <div class="toolbar-group" id="colors"></div>
  <div class="toolbar-divider"></div>
  <div class="toolbar-group">
    <button class="tool-btn active" id="brushBtn" onclick="setTool('brush')">
      <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M12 19l7-7 3 3-7 7-3-3z"/><path d="M18 13l-1.5-7.5L2 2l3.5 14.5L13 18l5-5z"/></svg>
      <span class="btn-label">Brush</span>
    </button>
    <button class="tool-btn" id="eraserBtn" onclick="setTool('eraser')">
      <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M20 20H7L3 16l9-9 8 8-4 4z"/><line x1="6" y1="11" x2="13" y2="18"/></svg>
      <span class="btn-label">Eraser</span>
    </button>
  </div>
  <div class="toolbar-divider"></div>
  <div class="toolbar-group">
    <input type="range" class="size-slider" id="sizeSlider" min="1" max="20" value="3">
    <span class="size-label" id="sizeLabel">3</span>
  </div>
  <div class="toolbar-divider"></div>
  <div class="toolbar-group">
    <button class="tool-btn" onclick="undo()">
      <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><polyline points="1 4 1 10 7 10"/><path d="M3.51 15a9 9 0 1 0 2.13-9.36L1 10"/></svg>
      <span class="btn-label">Undo</span>
    </button>
    <button class="tool-btn" onclick="clearCanvas()">
      <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><polyline points="3 6 5 6 21 6"/><path d="M19 6v14a2 2 0 0 1-2 2H7a2 2 0 0 1-2-2V6m3 0V4a2 2 0 0 1 2-2h4a2 2 0 0 1 2 2v2"/></svg>
      <span class="btn-label">Clear</span>
    </button>
    <button class="tool-btn" onclick="download()">
      <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M21 15v4a2 2 0 0 1-2 2H5a2 2 0 0 1-2-2v-4"/><polyline points="7 10 12 15 17 10"/><line x1="12" y1="15" x2="12" y2="3"/></svg>
      <span class="btn-label">Save</span>
    </button>
  </div>
</div>
<div class="canvas-wrap" id="canvasWrap">
  <canvas id="canvas"></canvas>
</div>
<div class="footer">Built on <span>Inclawbate</span></div>
<div class="toast" id="toast"></div>

<script>
var COLORS = ['#ffffff','#ef4444','#22c55e','#3b82f6','#eab308','#a855f7','#f97316','#ec4899'];
var canvas = document.getElementById('canvas');
var ctx = canvas.getContext('2d');
var wrap = document.getElementById('canvasWrap');
var drawing = false;
var tool = 'brush';
var color = '#ffffff';
var size = 3;
var history = [];
var MAX_HISTORY = 20;

// Init colors
var colorsEl = document.getElementById('colors');
COLORS.forEach(function(c, i) {
  var s = document.createElement('div');
  s.className = 'color-swatch' + (i === 0 ? ' active' : '');
  s.style.background = c;
  s.onclick = function() {
    color = c;
    document.querySelectorAll('.color-swatch').forEach(function(el) { el.classList.remove('active'); });
    s.classList.add('active');
    setTool('brush');
  };
  colorsEl.appendChild(s);
});

// Size slider
var slider = document.getElementById('sizeSlider');
var sizeLabel = document.getElementById('sizeLabel');
slider.oninput = function() { size = parseInt(this.value); sizeLabel.textContent = size; };

function resizeCanvas() {
  var img = null;
  if (canvas.width > 0 && canvas.height > 0) {
    try { img = ctx.getImageData(0, 0, canvas.width, canvas.height); } catch(e) {}
  }
  var dpr = window.devicePixelRatio || 1;
  var w = wrap.clientWidth;
  var h = wrap.clientHeight;
  canvas.width = w * dpr;
  canvas.height = h * dpr;
  canvas.style.width = w + 'px';
  canvas.style.height = h + 'px';
  ctx.scale(dpr, dpr);
  ctx.fillStyle = '#0a0a0f';
  ctx.fillRect(0, 0, w, h);
  if (img) {
    try { ctx.putImageData(img, 0, 0); } catch(e) {}
  }
  ctx.lineCap = 'round';
  ctx.lineJoin = 'round';
}
window.addEventListener('resize', resizeCanvas);
resizeCanvas();
saveState();

function saveState() {
  if (history.length >= MAX_HISTORY) history.shift();
  history.push(canvas.toDataURL());
}

function setTool(t) {
  tool = t;
  document.getElementById('brushBtn').classList.toggle('active', t === 'brush');
  document.getElementById('eraserBtn').classList.toggle('active', t === 'eraser');
}

function getPos(e) {
  var rect = canvas.getBoundingClientRect();
  var x, y;
  if (e.touches) {
    x = e.touches[0].clientX - rect.left;
    y = e.touches[0].clientY - rect.top;
  } else {
    x = e.clientX - rect.left;
    y = e.clientY - rect.top;
  }
  return { x: x, y: y };
}

function startDraw(e) {
  e.preventDefault();
  drawing = true;
  var p = getPos(e);
  ctx.beginPath();
  ctx.moveTo(p.x, p.y);
  ctx.strokeStyle = tool === 'eraser' ? '#0a0a0f' : color;
  ctx.lineWidth = tool === 'eraser' ? size * 3 : size;
  ctx.lineCap = 'round';
  ctx.lineJoin = 'round';
  // Draw a dot for single clicks
  ctx.lineTo(p.x + 0.1, p.y + 0.1);
  ctx.stroke();
}

function draw(e) {
  if (!drawing) return;
  e.preventDefault();
  var p = getPos(e);
  ctx.lineTo(p.x, p.y);
  ctx.stroke();
}

function endDraw(e) {
  if (!drawing) return;
  drawing = false;
  ctx.closePath();
  saveState();
}

canvas.addEventListener('mousedown', startDraw);
canvas.addEventListener('mousemove', draw);
canvas.addEventListener('mouseup', endDraw);
canvas.addEventListener('mouseleave', endDraw);
canvas.addEventListener('touchstart', startDraw, { passive: false });
canvas.addEventListener('touchmove', draw, { passive: false });
canvas.addEventListener('touchend', endDraw);
canvas.addEventListener('touchcancel', endDraw);

function undo() {
  if (history.length <= 1) return;
  history.pop();
  var img = new Image();
  img.onload = function() {
    var dpr = window.devicePixelRatio || 1;
    ctx.setTransform(1, 0, 0, 1, 0, 0);
    ctx.clearRect(0, 0, canvas.width, canvas.height);
    ctx.drawImage(img, 0, 0);
    ctx.setTransform(dpr, 0, 0, dpr, 0, 0);
  };
  img.src = history[history.length - 1];
  showToast('Undo');
}

function clearCanvas() {
  var dpr = window.devicePixelRatio || 1;
  ctx.setTransform(1, 0, 0, 1, 0, 0);
  ctx.fillStyle = '#0a0a0f';
  ctx.fillRect(0, 0, canvas.width, canvas.height);
  ctx.setTransform(dpr, 0, 0, dpr, 0, 0);
  saveState();
  showToast('Canvas cleared');
}

function download() {
  var link = document.createElement('a');
  link.download = 'whiteboard-' + Date.now() + '.png';
  link.href = canvas.toDataURL();
  link.click();
  showToast('Saved as PNG');
}

function showToast(msg) {
  var t = document.getElementById('toast');
  t.textContent = msg;
  t.classList.add('show');
  setTimeout(function() { t.classList.remove('show'); }, 1500);
}

// Keyboard shortcuts
document.addEventListener('keydown', function(e) {
  if (e.ctrlKey && e.key === 'z') { e.preventDefault(); undo(); }
  if (e.key === 'b') setTool('brush');
  if (e.key === 'e') setTool('eraser');
  if (e.key === '[') { size = Math.max(1, size - 1); slider.value = size; sizeLabel.textContent = size; }
  if (e.key === ']') { size = Math.min(20, size + 1); slider.value = size; sizeLabel.textContent = size; }
});
</script>
</body>
</html>
